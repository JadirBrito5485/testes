
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testemunhos | Restaurar</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}
header{padding:30px 15px;text-align:center;border-bottom:1px solid #222}
header h1{margin:0 0 20px;font-size:30px}
nav{display:flex;justify-content:center;gap:25px;flex-wrap:wrap}
nav a{color:#ddd;text-decoration:none;font-weight:bold;font-size:14px}
nav a.active,nav a:hover{color:#e4bd67}
main{max-width:1200px;margin:auto;padding:35px 18px;min-height:65vh}
h2{font-size:25px;margin-bottom:25px}
.slide{display:flex;align-items:center;justify-content:center;gap:12px;margin:25px auto;max-width:900px}
.imagem-box{flex:1;min-width:0;display:flex;justify-content:center}
.imagem-box img{max-width:100%;max-height:650px;object-fit:contain;border-radius:10px;cursor:zoom-in}
.seta{background:#222;border:1px solid #444;color:white;border-radius:50%;width:44px;height:44px;flex-shrink:0;font-size:23px;cursor:pointer}
.seta:hover{background:#444}
.legenda{text-align:center;color:#ccc;line-height:1.7}
.contador{text-align:center;color:#888;font-size:13px}
.zoom{display:none;position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:200;align-items:center;justify-content:center;padding:15px;cursor:zoom-out}
.zoom.aberto{display:flex}
.zoom img{max-width:100%;max-height:95vh;object-fit:contain}
footer{padding:35px;text-align:center;border-top:1px solid #222;color:#777;position:relative}
.adm-btn{position:absolute;right:12px;bottom:10px;background:none;border:0;color:#393939;cursor:pointer;font-size:11px}
.whats{position:fixed;bottom:20px;left:20px;background:#168b49;color:white;padding:13px 17px;border-radius:35px;text-decoration:none;font-weight:bold;font-size:13px;z-index:10;display:flex;align-items:center;gap:8px}
.whats svg{width:22px;height:22px;fill:currentColor}
.modal{display:none;position:fixed;inset:0;background:#000e;z-index:100;overflow:auto;padding:25px}
.modal.aberto{display:block}
.painel{max-width:750px;margin:25px auto;background:#111;border:1px solid #333;border-radius:12px;padding:25px}
input,textarea{display:block;width:100%;background:#050505;color:white;border:1px solid #444;padding:13px;margin:10px 0 16px;border-radius:5px;font:inherit}
textarea{min-height:100px}
button.acao{background:#d4aa55;color:#000;border:0;padding:12px 18px;border-radius:5px;font-weight:bold;cursor:pointer}
button.excluir{background:#a32323;color:#fff;border:0;padding:9px;border-radius:5px;cursor:pointer}
.linha{padding:14px 0;border-bottom:1px solid #333;display:flex;justify-content:space-between;gap:12px;align-items:center}
.fechar{float:right;background:transparent;color:#fff;border:0;font-size:25px;cursor:pointer}
.aviso{color:#aaa}
@media(max-width:550px){
header h1{font-size:25px}
.whats{font-size:11px}
.slide{gap:5px}
.seta{width:34px;height:34px;font-size:19px}
.imagem-box img{max-height:70vh}
}
</style>
</head>
<body>

<header>
<h1 id="tituloSite">RESTAURAR</h1>
<nav>
<a href="index.html">VÍDEOS</a>
<a class="active" href="testemunhos.html">TESTEMUNHOS</a>
<a href="estudos.html">ESTUDOS</a>
</nav>
</header>

<main>
<h2>TESTEMUNHOS</h2>

<div id="areaTestemunhos">
<div class="slide">
<button class="seta" onclick="anterior()" aria-label="Anterior">❮</button>
<div class="imagem-box">
<img id="fotoTestemunho" alt="Testemunho" onclick="ampliar()">
</div>
<button class="seta" onclick="proximo()" aria-label="Próximo">❯</button>
</div>
<p id="legenda" class="legenda"></p>
<p id="contador" class="contador"></p>
</div>

<p id="mensagemVazia" class="aviso" style="display:none">
Nenhum testemunho cadastrado.
</p>
</main>

<div id="zoom" class="zoom" onclick="fecharZoom()">
<img id="fotoZoom" alt="Testemunho ampliado">
</div>

<a id="whatsapp" class="whats" target="_blank" rel="noopener">
<svg viewBox="0 0 24 24" aria-hidden="true">
<path d="M12 .5A11.5 11.5 0 002.1 17.8L.5 23.5l5.9-1.5A11.5 11.5 0 1012 .5zm0 20.9a9.4 9.4 0 01-4.8-1.3l-.4-.2-3.5.9.9-3.4-.2-.4a9.4 9.4 0 118 4.4zm5.2-7c-.3-.2-1.7-.8-2-.9-.3-.1-.5-.2-.7.2s-.8.9-1 .9c-.2.1-.4 0-.7-.1-.4-.2-1.4-.5-2.6-1.7-1-.9-1.7-2-1.9-2.3-.2-.4 0-.5.2-.7l.5-.6.3-.5c.1-.2 0-.4 0-.6l-.9-2.1c-.2-.5-.5-.4-.7-.4h-.6c-.2 0-.6.1-.9.5s-1.2 1.2-1.2 2.8 1.2 3.1 1.4 3.3c.2.2 2.3 3.5 5.5 4.8 2.7 1.1 3.2.9 3.8.8.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.3.2-1.4z"/>
</svg>
FALE COM O PROFETA
</a>

<footer>
© RESTAURAR
<button class="adm-btn" onclick="abrirADM()">A</button>
</footer>

<div id="modal" class="modal">
<div class="painel">
<button class="fechar" onclick="fecharADM()">×</button>
<h2>ADMINISTRADOR</h2>

<div id="login">
<input type="password" id="senha" placeholder="Senha do administrador">
<button class="acao" onclick="entrar()">ENTRAR</button>
<p id="erro" style="color:#f66"></p>
</div>

<div id="conteudoADM" style="display:none">
<h3>Configurações gerais</h3>
<label>Nome do site</label>
<input id="nomeSite">
<label>WhatsApp (somente números)</label>
<input id="numeroWhats">
<button class="acao" onclick="salvarConfig()">SALVAR CONFIGURAÇÕES</button>

<hr>
<h3>Cadastrar testemunho</h3>
<input id="imagemLink" placeholder="Link da imagem (https://...)">
<textarea id="imagemLegenda" placeholder="Descrição do testemunho (opcional)"></textarea>
<button class="acao" onclick="adicionarTestemunho()">SALVAR TESTEMUNHO</button>

<h3>Testemunhos cadastrados</h3>
<div id="listaADM"></div>
<p class="aviso">As alterações são salvas neste navegador.</p>
</div>
</div>
</div>

<script>
const CHAVE="restaurar_site_v3";
const SENHA="848218";

let indice=0;
let intervalo=null;
let ampliado=false;

function dados(){
try{
return JSON.parse(localStorage.getItem(CHAVE)) || {
config:{titulo:"RESTAURAR",whatsapp:"5547999999999"},
videos:[],testemunhos:[],estudos:[]
};
}catch(e){
return {
config:{titulo:"RESTAURAR",whatsapp:"5547999999999"},
videos:[],testemunhos:[],estudos:[]
};
}
}

function salvar(d){
localStorage.setItem(CHAVE,JSON.stringify(d));
}

function el(id){
return document.getElementById(id);
}

function urlValida(url){
try{
const u=new URL(url);
return u.protocol==="https:" || u.protocol==="http:";
}catch(e){
return false;
}
}

function configurar(){
const d=dados();
el("tituloSite").textContent=d.config?.titulo||"RESTAURAR";
el("whatsapp").href="https://wa.me/"+(d.config?.whatsapp||"5547999999999").replace(/\D/g,"");
}

function render(){
configurar();
const testemunhos=dados().testemunhos||[];
if(indice>=testemunhos.length)indice=0;

if(!testemunhos.length){
el("areaTestemunhos").style.display="none";
el("mensagemVazia").style.display="block";
return;
}

el("areaTestemunhos").style.display="block";
el("mensagemVazia").style.display="none";

const atual=testemunhos[indice];
el("fotoTestemunho").src=atual.imagem;
el("fotoTestemunho").alt=atual.legenda||"Testemunho";
el("legenda").textContent=atual.legenda||"";
el("contador").textContent=(indice+1)+" de "+testemunhos.length;
}

function proximo(){
const lista=dados().testemunhos||[];
if(!lista.length)return;
indice=(indice+1)%lista.length;
render();
iniciarSlide();
}

function anterior(){
const lista=dados().testemunhos||[];
if(!lista.length)return;
indice=(indice-1+lista.length)%lista.length;
render();
iniciarSlide();
}

function iniciarSlide(){
clearInterval(intervalo);
if(ampliado)return;

intervalo=setInterval(function(){
const lista=dados().testemunhos||[];
if(lista.length>1){
indice=(indice+1)%lista.length;
render();
}
},60000);
}

function ampliar(){
const foto=el("fotoTestemunho");
if(!foto.src)return;
ampliado=true;
clearInterval(intervalo);
el("fotoZoom").src=foto.src;
el("zoom").classList.add("aberto");
}

function fecharZoom(){
el("zoom").classList.remove("aberto");
ampliado=false;
iniciarSlide();
}

function abrirADM(){
el("modal").classList.add("aberto");
if(sessionStorage.getItem("restaurar_adm")==="sim"){
mostrarADM();
}
}

function fecharADM(){
el("modal").classList.remove("aberto");
}

function entrar(){
if(el("senha").value.trim()===SENHA){
sessionStorage.setItem("restaurar_adm","sim");
mostrarADM();
}else{
el("erro").textContent="Senha incorreta.";
}
}

function mostrarADM(){
el("login").style.display="none";
el("conteudoADM").style.display="block";
const d=dados();
el("nomeSite").value=d.config?.titulo||"RESTAURAR";
el("numeroWhats").value=d.config?.whatsapp||"";
listarADM();
}

function salvarConfig(){
const d=dados();
d.config={
titulo:el("nomeSite").value.trim()||"RESTAURAR",
whatsapp:el("numeroWhats").value.replace(/\D/g,"")
};
salvar(d);
render();
alert("Configurações salvas!");
}

function adicionarTestemunho(){
const imagem=el("imagemLink").value.trim();
const legenda=el("imagemLegenda").value.trim();

if(!urlValida(imagem)){
alert("Informe um link válido de imagem.");
return;
}

const d=dados();
d.testemunhos=d.testemunhos||[];
d.testemunhos.push({
id:Date.now(),
imagem:imagem,
legenda:legenda
});

salvar(d);
el("imagemLink").value="";
el("imagemLegenda").value="";
indice=d.testemunhos.length-1;
render();
listarADM();
iniciarSlide();
alert("Testemunho salvo com sucesso!");
}

function listarADM(){
const area=el("listaADM");
area.replaceChildren();

(dados().testemunhos||[]).forEach((t,i)=>{
const div=document.createElement("div");
div.className="linha";
const span=document.createElement("span");
span.textContent=t.legenda||"Testemunho "+(i+1);
const btn=document.createElement("button");
btn.className="excluir";
btn.textContent="EXCLUIR";
btn.onclick=()=>excluirTestemunho(t.id);
div.append(span,btn);
area.append(div);
});
}

function excluirTestemunho(id){
if(!confirm("Deseja excluir este testemunho?"))return;
const d=dados();
d.testemunhos=(d.testemunhos||[]).filter(t=>t.id!==id);
salvar(d);
indice=0;
render();
listarADM();
iniciarSlide();
}

window.addEventListener("storage",function(){
render();
iniciarSlide();
});

render();
iniciarSlide();
</script>
</body>
</html>
