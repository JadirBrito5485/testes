
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudos | Restaurar</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#000;
color:#fff;
font-family:Arial,sans-serif;
}

header{
padding:30px 15px;
text-align:center;
border-bottom:1px solid #222;
}

header h1{
margin:0 0 20px;
font-size:30px;
}

nav{
display:flex;
justify-content:center;
gap:25px;
flex-wrap:wrap;
}

nav a{
color:#ddd;
text-decoration:none;
font-weight:bold;
font-size:14px;
}

nav a.active,nav a:hover{color:#e4bd67}

main{
max-width:1200px;
margin:auto;
padding:35px 18px;
min-height:65vh;
}

h2{font-size:25px;margin-bottom:25px}

.grade{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:20px;
}

.card{
background:#101010;
border:1px solid #282828;
border-radius:10px;
overflow:hidden;
cursor:pointer;
transition:transform .2s,border-color .2s;
}

.card:hover{
transform:translateY(-3px);
border-color:#806b42;
}

.card img{
width:100%;
aspect-ratio:16/9;
object-fit:cover;
display:block;
}

.card-corpo{padding:18px}

.card h3{
font-size:19px;
margin:0 0 12px;
line-height:1.4;
}

.card p{
color:#aaa;
font-size:15px;
line-height:1.7;
margin:0;
}

.artigo{
display:none;
max-width:850px;
margin:auto;
}

.artigo h2{
font-size:32px;
line-height:1.4;
margin-bottom:25px;
}

.artigo-imagem{
display:block;
max-width:100%;
height:auto;
margin:25px auto;
border-radius:8px;
}

.artigo-texto{
white-space:pre-wrap;
font-size:18px;
line-height:1.9;
color:#ddd;
overflow-wrap:anywhere;
}

.voltar{
background:#202020;
color:#fff;
border:1px solid #444;
border-radius:5px;
padding:12px 18px;
margin-bottom:25px;
cursor:pointer;
}

footer{
padding:35px;
text-align:center;
border-top:1px solid #222;
color:#777;
position:relative;
}

.adm-btn{
position:absolute;
right:12px;
bottom:10px;
background:none;
border:0;
color:#393939;
cursor:pointer;
font-size:11px;
}

.whats{
position:fixed;
bottom:20px;
left:20px;
background:#168b49;
color:white;
padding:13px 17px;
border-radius:35px;
text-decoration:none;
font-weight:bold;
font-size:13px;
z-index:10;
display:flex;
align-items:center;
gap:8px;
}

.whats svg{
width:22px;
height:22px;
fill:currentColor;
}

.modal{
display:none;
position:fixed;
inset:0;
background:#000e;
z-index:100;
overflow:auto;
padding:25px;
}

.modal.aberto{display:block}

.painel{
max-width:750px;
margin:25px auto;
background:#111;
border:1px solid #333;
border-radius:12px;
padding:25px;
}

input,textarea{
display:block;
width:100%;
background:#050505;
color:white;
border:1px solid #444;
padding:13px;
margin:10px 0 16px;
border-radius:5px;
font:inherit;
}

textarea{min-height:130px}

#estudoTexto{min-height:300px}

button.acao{
background:#d4aa55;
color:#000;
border:0;
padding:12px 18px;
border-radius:5px;
font-weight:bold;
cursor:pointer;
}

button.excluir{
background:#a32323;
color:#fff;
border:0;
padding:9px;
border-radius:5px;
cursor:pointer;
}

button.editar{
background:#333;
color:#fff;
border:1px solid #555;
padding:9px;
border-radius:5px;
cursor:pointer;
}

.linha{
padding:14px 0;
border-bottom:1px solid #333;
display:flex;
justify-content:space-between;
gap:12px;
align-items:center;
}

.botoes{
display:flex;
gap:7px;
flex-wrap:wrap;
}

.fechar{
float:right;
background:transparent;
color:#fff;
border:0;
font-size:25px;
cursor:pointer;
}

.aviso{color:#aaa}

hr{
border:0;
border-top:1px solid #333;
margin:25px 0;
}

@media(max-width:850px){
.grade{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:550px){
.grade{grid-template-columns:1fr}
header h1{font-size:25px}
.whats{font-size:11px}
.artigo h2{font-size:26px}
.artigo-texto{font-size:17px}
.linha{align-items:flex-start}
}
</style>
</head>

<body>

<header>
<h1 id="tituloSite">RESTAURAR</h1>

<nav>
<a href="index.html">VÍDEOS</a>
<a href="testemunhos.html">TESTEMUNHOS</a>
<a class="active" href="estudos.html">ESTUDOS</a>
</nav>
</header>

<main>

<section id="paginaLista">

<h2>ESTUDOS</h2>

<div id="gradeEstudos" class="grade"></div>

</section>

<article id="paginaArtigo" class="artigo">

<button class="voltar" onclick="voltarEstudos()">
← VOLTAR AOS ESTUDOS
</button>

<h2 id="artigoTitulo"></h2>

<div id="artigoConteudo"></div>

</article>

</main>

<a id="whatsapp" class="whats" target="_blank" rel="noopener">

<svg viewBox="0 0 24 24" aria-hidden="true">
<path d="M12 .5A11.5 11.5 0 002.1 17.8L.5 23.5l5.9-1.5A11.5 11.5 0 1012 .5zm0 20.9a9.4 9.4 0 01-4.8-1.3l-.4-.2-3.5.9.9-3.4-.2-.4a9.4 9.4 0 118 4.4zm5.2-7c-.3-.2-1.7-.8-2-.9-.3-.1-.4-.2-.7.2s-.8.9-1 .9c-.2.1-.4 0-.7-.1-.4-.2-1.4-.5-2.6-1.7-1-.9-1.7-2-1.9-2.3-.2-.4 0-.5.2-.7l.5-.6.3-.5c.1-.2 0-.4 0-.6l-.9-2.1c-.2-.5-.5-.4-.7-.4h-.6c-.2 0-.6.1-.9.5s-1.2 1.2-1.2 2.8 1.2 3.1 1.4 3.3c.2.2 2.3 3.5 5.5 4.8 2.7 1.1 3.2.9 3.8.8.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.3.2-1.4z"/>
</svg>

FALE COM O PROFETA
</a>

<footer>
© RESTAURAR
<button class="adm-btn" onclick="abrirADM()">A</button>
</footer>

<div id="modal" class="modal">

<div class="painel">

<button class="fechar" onclick="fecharADM()">×</button>

<h2>ADMINISTRADOR</h2>

<div id="login">

<input type="password" id="senha"
placeholder="Senha do administrador">

<button class="acao" onclick="entrar()">ENTRAR</button>

<p id="erro" style="color:#f66"></p>

</div>

<div id="conteudoADM" style="display:none">

<h3>Configurações gerais</h3>

<label>Nome do site</label>
<input id="nomeSite">

<label>WhatsApp (somente números)</label>
<input id="numeroWhats">

<button class="acao" onclick="salvarConfig()">
SALVAR CONFIGURAÇÕES
</button>

<hr>

<h3 id="tituloFormulario">Cadastrar estudo</h3>

<input type="hidden" id="estudoID">

<label>Título do estudo</label>
<input id="estudoTitulo" placeholder="Título do artigo">

<label>Imagem de capa (URL)</label>
<input id="estudoCapa" placeholder="https://site.com/imagem.jpg">

<label>Descrição resumida</label>
<textarea id="estudoResumo"
placeholder="Resumo que aparecerá na página de estudos"></textarea>

<label>Conteúdo completo</label>
<textarea id="estudoTexto"
placeholder="Escreva o artigo completo aqui"></textarea>

<label>Imagens adicionais (uma URL por linha)</label>
<textarea id="estudoImagens"
placeholder="https://site.com/imagem1.jpg"></textarea>

<button class="acao" onclick="salvarEstudo()">
SALVAR ESTUDO
</button>

<button class="editar" onclick="limparFormulario()">
LIMPAR
</button>

<hr>

<h3>Estudos cadastrados</h3>

<div id="listaADM"></div>

<p class="aviso">
As alterações são salvas neste navegador.
</p>

</div>
</div>
</div>

<script>

const CHAVE="restaurar_site_v3";
const SENHA="848218";

function dados(){
try{
return JSON.parse(localStorage.getItem(CHAVE)) || {
config:{titulo:"RESTAURAR",whatsapp:"5547999999999"},
videos:[],testemunhos:[],estudos:[]
};
}catch(e){
return {
config:{titulo:"RESTAURAR",whatsapp:"5547999999999"},
videos:[],testemunhos:[],estudos:[]
};
}
}

function salvar(d){
localStorage.setItem(CHAVE,JSON.stringify(d));
}

function el(id){
return document.getElementById(id);
}

function urlValida(url){
try{
const u=new URL(url);
return u.protocol==="https:" || u.protocol==="http:";
}catch(e){
return false;
}
}

function configurar(){
const d=dados();

el("tituloSite").textContent=
d.config?.titulo||"RESTAURAR";

el("whatsapp").href=
"https://wa.me/"+(d.config?.whatsapp||"5547999999999").replace(/\D/g,"");
}

function render(){

configurar();

const area=el("gradeEstudos");
area.replaceChildren();

const estudos=dados().estudos||[];

if(!estudos.length){
area.textContent="Nenhum estudo cadastrado.";
return;
}

estudos.forEach(estudo=>{

const card=document.createElement("div");
card.className="card";
card.tabIndex=0;
card.setAttribute("role","button");

card.onclick=()=>abrirEstudo(estudo.id);

card.onkeydown=e=>{
if(e.key==="Enter")abrirEstudo(estudo.id);
};

if(estudo.capa&&urlValida(estudo.capa)){
const img=document.createElement("img");
img.src=estudo.capa;
img.alt=estudo.titulo;
img.loading="lazy";
card.append(img);
}

const corpo=document.createElement("div");
corpo.className="card-corpo";

const titulo=document.createElement("h3");
titulo.textContent=estudo.titulo;

const resumo=document.createElement("p");
resumo.textContent=estudo.resumo||"Clique para ler o estudo completo.";

corpo.append(titulo,resumo);
card.append(corpo);
area.append(card);

});

}

function abrirEstudo(id){

const estudo=(dados().estudos||[]).find(e=>String(e.id)===String(id));

if(!estudo)return;

el("paginaLista").style.display="none";
el("paginaArtigo").style.display="block";

el("artigoTitulo").textContent=estudo.titulo;

const area=el("artigoConteudo");
area.replaceChildren();

if(estudo.capa&&urlValida(estudo.capa)){
const imagem=document.createElement("img");
imagem.className="artigo-imagem";
imagem.src=estudo.capa;
imagem.alt=estudo.titulo;
area.append(imagem);
}

const texto=document.createElement("div");
texto.className="artigo-texto";
texto.textContent=estudo.texto||"";

area.append(texto);

(estudo.imagens||[]).forEach(url=>{
if(!urlValida(url))return;

const img=document.createElement("img");
img.className="artigo-imagem";
img.src=url;
img.alt=estudo.titulo;
img.loading="lazy";
area.append(img);
});

window.scrollTo(0,0);

}

function voltarEstudos(){
el("paginaArtigo").style.display="none";
el("paginaLista").style.display="block";
window.scrollTo(0,0);
}

function abrirADM(){

el("modal").classList.add("aberto");

if(sessionStorage.getItem("restaurar_adm")==="sim"){
mostrarADM();
}

}

function fecharADM(){
el("modal").classList.remove("aberto");
}

function entrar(){

if(el("senha").value.trim()===SENHA){

sessionStorage.setItem("restaurar_adm","sim");

mostrarADM();

}else{

el("erro").textContent="Senha incorreta.";

}

}

function mostrarADM(){

el("login").style.display="none";
el("conteudoADM").style.display="block";

const d=dados();

el("nomeSite").value=d.config?.titulo||"RESTAURAR";
el("numeroWhats").value=d.config?.whatsapp||"";

listarADM();

}

function salvarConfig(){

const d=dados();

d.config={
titulo:el("nomeSite").value.trim()||"RESTAURAR",
whatsapp:el("numeroWhats").value.replace(/\D/g,"")
};

salvar(d);
render();

alert("Configurações salvas!");

}

function salvarEstudo(){

const titulo=el("estudoTitulo").value.trim();
const capa=el("estudoCapa").value.trim();
const resumo=el("estudoResumo").value.trim();
const texto=el("estudoTexto").value.trim();

const imagens=el("estudoImagens").value
.split("\n")
.map(x=>x.trim())
.filter(Boolean);

if(!titulo){
alert("Informe o título do estudo.");
return;
}

if(capa&&!urlValida(capa)){
alert("Informe uma URL válida para a capa.");
return;
}

if(imagens.some(x=>!urlValida(x))){
alert("Existe uma URL de imagem inválida.");
return;
}

const d=dados();
d.estudos=d.estudos||[];

const id=el("estudoID").value;

if(id){

const estudo=d.estudos.find(e=>String(e.id)===String(id));

if(estudo){
estudo.titulo=titulo;
estudo.capa=capa;
estudo.resumo=resumo;
estudo.texto=texto;
estudo.imagens=imagens;
}

}else{

d.estudos.push({
id:Date.now(),
titulo,
capa,
resumo,
texto,
imagens
});

}

salvar(d);

limparFormulario();
render();
listarADM();

alert("Estudo salvo com sucesso!");

}

function editarEstudo(id){

const estudo=(dados().estudos||[])
.find(e=>String(e.id)===String(id));

if(!estudo)return;

el("estudoID").value=estudo.id;
el("estudoTitulo").value=estudo.titulo||"";
el("estudoCapa").value=estudo.capa||"";
el("estudoResumo").value=estudo.resumo||"";
el("estudoTexto").value=estudo.texto||"";
el("estudoImagens").value=(estudo.imagens||[]).join("\n");

el("tituloFormulario").textContent="Editar estudo";

el("estudoTitulo").focus();

}

function limparFormulario(){

["estudoID","estudoTitulo","estudoCapa",
"estudoResumo","estudoTexto","estudoImagens"]
.forEach(id=>el(id).value="");

el("tituloFormulario").textContent="Cadastrar estudo";

}

function listarADM(){

const area=el("listaADM");
area.replaceChildren();

(dados().estudos||[]).forEach(estudo=>{

const div=document.createElement("div");
div.className="linha";

const span=document.createElement("span");
span.textContent=estudo.titulo;

const botoes=document.createElement("div");
botoes.className="botoes";

const editar=document.createElement("button");
editar.className="editar";
editar.textContent="EDITAR";
editar.onclick=()=>editarEstudo(estudo.id);

const excluir=document.createElement("button");
excluir.className="excluir";
excluir.textContent="EXCLUIR";
excluir.onclick=()=>excluirEstudo(estudo.id);

botoes.append(editar,excluir);
div.append(span,botoes);
area.append(div);

});

}

function excluirEstudo(id){

if(!confirm("Deseja excluir este estudo?"))return;

const d=dados();

d.estudos=(d.estudos||[])
.filter(e=>String(e.id)!==String(id));

salvar(d);

render();
listarADM();
voltarEstudos();

}

window.addEventListener("storage",render);

render();

</script>
</body>
</html>
