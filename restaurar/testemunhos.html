
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testemunhos | Restaurar</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
background:#000;
color:#fff;
font-family:Arial,sans-serif;
}

header{
padding:30px 15px;
text-align:center;
border-bottom:1px solid #222;
}

header h1{
margin:0 0 20px;
font-size:30px;
}

nav{
display:flex;
justify-content:center;
gap:25px;
flex-wrap:wrap;
}

nav a{
color:#ddd;
text-decoration:none;
font-weight:bold;
font-size:14px;
}

nav a.active,
nav a:hover{
color:#e4bd67;
}

main{
max-width:1200px;
margin:auto;
padding:35px 18px;
min-height:65vh;
}

h2{
font-size:25px;
margin-bottom:25px;
}

/* GRADE */

.grade{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:20px;
}

.card{
position:relative;
background:#101010;
border:1px solid #282828;
border-radius:10px;
overflow:hidden;
min-width:0;
}

.imagem-box{
height:330px;
background:#080808;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.imagem-box img{
width:100%;
height:100%;
object-fit:contain;
cursor:zoom-in;
display:block;
}

.legenda{
padding:15px;
color:#ccc;
font-size:14px;
line-height:1.6;
overflow-wrap:anywhere;
}

/* BOTÃO X */

.botao-x{
position:absolute;
top:9px;
right:9px;
width:36px;
height:36px;
border-radius:50%;
background:rgba(0,0,0,.88);
color:#fff;
border:1px solid #666;
font-size:24px;
cursor:pointer;
z-index:5;
display:flex;
align-items:center;
justify-content:center;
}

.botao-x:hover{
background:#a32323;
}

/* AMPLIAÇÃO */

.zoom{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.97);
z-index:200;
align-items:center;
justify-content:center;
padding:20px;
cursor:zoom-out;
}

.zoom.aberto{
display:flex;
}

.zoom img{
max-width:100%;
max-height:94vh;
object-fit:contain;
border-radius:5px;
}

.zoom-instrucao{
position:absolute;
bottom:12px;
left:0;
right:0;
text-align:center;
font-size:12px;
color:#aaa;
pointer-events:none;
}

/* RODAPÉ */

footer{
padding:35px;
text-align:center;
border-top:1px solid #222;
color:#777;
position:relative;
}

.adm-btn{
position:absolute;
right:12px;
bottom:10px;
background:none;
border:0;
color:#393939;
cursor:pointer;
font-size:11px;
}

/* WHATSAPP */

.whats{
position:fixed;
bottom:20px;
left:20px;
background:#168b49;
color:white;
padding:13px 17px;
border-radius:35px;
text-decoration:none;
font-weight:bold;
font-size:13px;
z-index:10;
display:flex;
align-items:center;
gap:8px;
}

.whats svg{
width:22px;
height:22px;
fill:currentColor;
}

/* ADMINISTRADOR */

.modal{
display:none;
position:fixed;
inset:0;
background:#000e;
z-index:100;
overflow:auto;
padding:25px;
}

.modal.aberto{
display:block;
}

.painel{
max-width:750px;
margin:25px auto;
background:#111;
border:1px solid #333;
border-radius:12px;
padding:25px;
}

input,
textarea{
display:block;
width:100%;
background:#050505;
color:white;
border:1px solid #444;
padding:13px;
margin:10px 0 16px;
border-radius:5px;
font:inherit;
}

textarea{
min-height:100px;
}

button.acao{
background:#d4aa55;
color:#000;
border:0;
padding:12px 18px;
border-radius:5px;
font-weight:bold;
cursor:pointer;
}

button.excluir{
background:#a32323;
color:#fff;
border:0;
padding:9px;
border-radius:5px;
cursor:pointer;
}

.linha{
padding:14px 0;
border-bottom:1px solid #333;
display:flex;
justify-content:space-between;
gap:12px;
align-items:center;
}

.linha span{
overflow-wrap:anywhere;
}

.fechar{
float:right;
background:transparent;
color:#fff;
border:0;
font-size:25px;
cursor:pointer;
}

.aviso{
color:#aaa;
line-height:1.6;
}

hr{
border:0;
border-top:1px solid #333;
margin:25px 0;
}

/* TABLET */

@media(max-width:850px){

.grade{
grid-template-columns:repeat(2,minmax(0,1fr));
}

.imagem-box{
height:300px;
}

}

/* CELULAR */

@media(max-width:550px){

header h1{
font-size:25px;
}

.grade{
grid-template-columns:1fr;
gap:16px;
}

.imagem-box{
height:380px;
}

.whats{
font-size:11px;
}

main{
padding:25px 12px;
}

.linha{
align-items:flex-start;
}

}

/* CELULARES PEQUENOS */

@media(max-width:360px){

.imagem-box{
height:300px;
}

nav{
gap:14px;
}

nav a{
font-size:12px;
}

}
</style>
</head>

<body>

<header>
<h1 id="tituloSite">RESTAURAR</h1>

<nav>
<a href="index.html">VÍDEOS</a>
<a class="active" href="testemunhos.html">TESTEMUNHOS</a>
<a href="estudos.html">ESTUDOS</a>
</nav>
</header>

<main>

<h2>TESTEMUNHOS</h2>

<div id="gradeTestemunhos" class="grade"></div>

<p id="mensagemVazia" class="aviso" style="display:none">
Nenhum testemunho cadastrado.
</p>

</main>

<!-- IMAGEM AMPLIADA -->

<div
id="zoom"
class="zoom"
role="dialog"
aria-modal="true"
aria-label="Testemunho ampliado"
onclick="fecharZoom()"
>

<img id="fotoZoom" alt="Testemunho ampliado">

<div class="zoom-instrucao">
Clique novamente para fechar
</div>

</div>

<!-- WHATSAPP -->

<a
id="whatsapp"
class="whats"
target="_blank"
rel="noopener"
>

<svg viewBox="0 0 24 24" aria-hidden="true">
<path d="M12 .5A11.5 11.5 0 002.1 17.8L.5 23.5l5.9-1.5A11.5 11.5 0 1012 .5zm0 20.9a9.4 9.4 0 01-4.8-1.3l-.4-.2-3.5.9.9-3.4-.2-.4a9.4 9.4 0 118 4.4 9.4 9.4 0 01-4.8-1.3zm5.2-7c-.3-.2-1.7-.8-2-.9-.3-.1-.5-.2-.7.2s-.8.9-1 .9c-.2.1-.4 0-.7-.1-.4-.2-1.4-.5-2.6-1.7-1-.9-1.7-2-1.9-2.3-.2-.4 0-.5.2-.7l.5-.6.3-.5c.1-.2 0-.4 0-.6l-.9-2.1c-.2-.5-.5-.4-.7-.4h-.6c-.2 0-.6.1-.9.5s-1.2 1.2-1.2 2.8 1.2 3.1 1.4 3.3c.2.2 2.3 3.5 5.5 4.8 2.7 1.1 3.2.9 3.8.8.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.3.2-1.4z"/>
</svg>

FALE COM O PROFETA

</a>

<footer>

© RESTAURAR

<button
class="adm-btn"
onclick="abrirADM()"
aria-label="Administrador"
>
A
</button>

</footer>

<!-- ADMINISTRADOR -->

<div id="modal" class="modal">

<div class="painel">

<button
class="fechar"
onclick="fecharADM()"
aria-label="Fechar administrador"
>
×
</button>

<h2>ADMINISTRADOR</h2>

<div id="login">

<input
type="password"
id="senha"
placeholder="Senha do administrador"
>

<button class="acao" onclick="entrar()">
ENTRAR
</button>

<p id="erro" style="color:#f66"></p>

</div>

<div id="conteudoADM" style="display:none">

<h3>Configurações gerais</h3>

<label>Nome do site</label>
<input id="nomeSite">

<label>WhatsApp (somente números)</label>
<input id="numeroWhats">

<button class="acao" onclick="salvarConfig()">
SALVAR CONFIGURAÇÕES
</button>

<hr>

<h3>Cadastrar testemunho</h3>

<label>Link da imagem</label>

<input
id="imagemLink"
placeholder="https://site.com/imagem.jpg"
>

<label>Descrição do testemunho</label>

<textarea
id="imagemLegenda"
placeholder="Descrição (opcional)"
></textarea>

<button class="acao" onclick="adicionarTestemunho()">
SALVAR TESTEMUNHO
</button>

<hr>

<h3>Testemunhos cadastrados</h3>

<div id="listaADM"></div>

<p class="aviso">
Os cadastros desta versão são salvos neste navegador.
</p>

</div>
</div>
</div>

<script>

const CHAVE="restaurar_site_v3";
const SENHA="848218";

const FILA_CHAVE="restaurar_fila_testemunhos_v1";

let ordem=[];
let imagemAberta=false;

function el(id){
return document.getElementById(id);
}

function dados(){

try{

return JSON.parse(localStorage.getItem(CHAVE)) || {
config:{
titulo:"RESTAURAR",
whatsapp:"5547999999999"
},
videos:[],
testemunhos:[],
estudos:[]
};

}catch(e){

return {
config:{
titulo:"RESTAURAR",
whatsapp:"5547999999999"
},
videos:[],
testemunhos:[],
estudos:[]
};

}

}

function salvar(d){

localStorage.setItem(
CHAVE,
JSON.stringify(d)
);

}

function urlValida(url){

try{

const u=new URL(url);

return (
u.protocol==="https:" ||
u.protocol==="http:"
);

}catch(e){

return false;

}

}

function configurar(){

const d=dados();

el("tituloSite").textContent=
d.config?.titulo||"RESTAURAR";

el("whatsapp").href=
"https://wa.me/"+
String(
d.config?.whatsapp||"5547999999999"
).replace(/\D/g,"");

}

/* FILA INDIVIDUAL */

function recuperarOrdem(){

try{

const valor=JSON.parse(
localStorage.getItem(FILA_CHAVE)
);

return Array.isArray(valor)?valor:[];

}catch(e){

return [];

}

}

function salvarOrdem(){

try{

localStorage.setItem(
FILA_CHAVE,
JSON.stringify(ordem)
);

}catch(e){}

}

function atualizarOrdem(){

const testemunhos=dados().testemunhos||[];

const ids=testemunhos.map(t=>String(t.id));

const anterior=ordem.length
?ordem
:recuperarOrdem();

ordem=anterior.filter(
id=>ids.includes(String(id))
);

const novos=ids.filter(
id=>!ordem.includes(id)
);

ordem=[...novos,...ordem];

salvarOrdem();

}

function listaOrdenada(){

const testemunhos=dados().testemunhos||[];

atualizarOrdem();

return ordem
.map(id=>testemunhos.find(
t=>String(t.id)===String(id)
))
.filter(Boolean);

}

/* EXIBIR GRADE */

function render(){

configurar();

const area=el("gradeTestemunhos");

area.replaceChildren();

const testemunhos=listaOrdenada();

el("mensagemVazia").style.display=
testemunhos.length?"none":"block";

testemunhos.forEach(t=>{

const card=document.createElement("article");

card.className="card";

const box=document.createElement("div");

box.className="imagem-box";

const img=document.createElement("img");

img.src=t.imagem;
img.alt=t.legenda||"Testemunho";
img.loading="lazy";
img.tabIndex=0;

img.onclick=()=>ampliar(t.imagem,t.legenda);

img.onkeydown=e=>{

if(e.key==="Enter"||e.key===" "){
e.preventDefault();
ampliar(t.imagem,t.legenda);
}

};

const botao=document.createElement("button");

botao.className="botao-x";

botao.textContent="×";

botao.title="Mover testemunho para o final";

botao.setAttribute(
"aria-label",
"Mover testemunho para o final da lista"
);

botao.onclick=()=>moverParaFinal(t.id);

box.append(img,botao);

card.append(box);

if(t.legenda){

const legenda=document.createElement("div");

legenda.className="legenda";

legenda.textContent=t.legenda;

card.append(legenda);

}

area.append(card);

});

}

/* X: MOVER PARA O FINAL */

function moverParaFinal(id){

const chave=String(id);

atualizarOrdem();

if(!ordem.includes(chave))return;

ordem=ordem.filter(
item=>item!==chave
);

ordem.push(chave);

salvarOrdem();

render();

}

/* AMPLIAR E RECUAR IMAGEM */

function ampliar(url,legenda){

if(!urlValida(url))return;

imagemAberta=true;

el("fotoZoom").src=url;

el("fotoZoom").alt=legenda||"Testemunho ampliado";

el("zoom").classList.add("aberto");

document.body.style.overflow="hidden";

}

function fecharZoom(){

if(!imagemAberta)return;

imagemAberta=false;

el("zoom").classList.remove("aberto");

el("fotoZoom").removeAttribute("src");

document.body.style.overflow="";

}

document.addEventListener("keydown",function(e){

if(e.key==="Escape"){

fecharZoom();

fecharADM();

}

});

/* ADMINISTRADOR */

function abrirADM(){

el("modal").classList.add("aberto");

if(
sessionStorage.getItem("restaurar_adm")==="sim"
){

mostrarADM();

}

}

function fecharADM(){

el("modal").classList.remove("aberto");

}

function entrar(){

if(el("senha").value.trim()===SENHA){

sessionStorage.setItem(
"restaurar_adm",
"sim"
);

el("erro").textContent="";

mostrarADM();

}else{

el("erro").textContent="Senha incorreta.";

}

}

function mostrarADM(){

el("login").style.display="none";

el("conteudoADM").style.display="block";

const d=dados();

el("nomeSite").value=
d.config?.titulo||"RESTAURAR";

el("numeroWhats").value=
d.config?.whatsapp||"";

listarADM();

}

function salvarConfig(){

const d=dados();

d.config={
titulo:el("nomeSite").value.trim()||"RESTAURAR",
whatsapp:el("numeroWhats").value.replace(/\D/g,"")
};

salvar(d);

render();

alert("Configurações salvas!");

}

/* CADASTRAR TESTEMUNHO */

function adicionarTestemunho(){

const imagem=el("imagemLink").value.trim();

const legenda=el("imagemLegenda").value.trim();

if(!urlValida(imagem)){

alert("Informe um link válido de imagem.");

return;

}

const d=dados();

d.testemunhos=d.testemunhos||[];

d.testemunhos.push({

id:Date.now().toString()+"-"+Math.random().toString(36).slice(2),

imagem:imagem,

legenda:legenda

});

salvar(d);

el("imagemLink").value="";

el("imagemLegenda").value="";

render();

listarADM();

alert("Testemunho salvo com sucesso!");

}

/* LISTAR NO ADMINISTRADOR */

function listarADM(){

const area=el("listaADM");

area.replaceChildren();

(dados().testemunhos||[]).forEach((t,i)=>{

const div=document.createElement("div");

div.className="linha";

const span=document.createElement("span");

span.textContent=
t.legenda||"Testemunho "+(i+1);

const btn=document.createElement("button");

btn.className="excluir";

btn.textContent="EXCLUIR";

btn.onclick=()=>excluirTestemunho(t.id);

div.append(span,btn);

area.append(div);

});

}

/* EXCLUSÃO DEFINITIVA SOMENTE NO ADM */

function excluirTestemunho(id){

if(!confirm("Deseja excluir este testemunho?"))return;

const d=dados();

d.testemunhos=(d.testemunhos||[]).filter(
t=>String(t.id)!==String(id)
);

salvar(d);

ordem=ordem.filter(
item=>item!==String(id)
);

salvarOrdem();

render();

listarADM();

}

/* SINCRONIZAR ABAS */

window.addEventListener("storage",function(e){

if(e.key===CHAVE||e.key===FILA_CHAVE){

if(e.key===FILA_CHAVE){
ordem=recuperarOrdem();
}

render();

}

});

/* INICIALIZAÇÃO */

render();

</script>

</body>
</html>
