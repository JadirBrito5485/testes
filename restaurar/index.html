<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Jadir Brito | Estudos Bíblicos</title>
<style>
:root{--bg:#fff;--surface:#fff;--ink:#172033;--muted:#647084;--line:#e5e8ee;--accent:#20365f;--soft:#f5f7fa}
html.dark{--bg:#111418;--surface:#1b2027;--ink:#f4f6fa;--muted:#b7c1d0;--line:#343d49;--accent:#b7d0ff;--soft:#252b33;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Arial,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #7ca7f7;outline-offset:3px}.wrap{width:min(1120px,92%);margin:auto}header{border-bottom:1px solid var(--line);background:var(--surface)}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:75px}.brand{font-weight:800;letter-spacing:.05em;font-size:23px}.theme{background:var(--soft);border:1px solid var(--line);border-radius:9px;color:var(--ink);padding:8px 12px}.hero{text-align:center;padding:55px 0 34px}.hero h1{font:700 clamp(36px,6vw,60px)/1.15 Georgia,serif;margin:0 0 12px}.hero p{max-width:690px;margin:auto;color:var(--muted);font-size:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin:30px 0 70px}.card{border:1px solid var(--line);border-radius:13px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 5px 18px #0000000a}.cover{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--soft);display:block}.cardBody{padding:20px;display:flex;flex-direction:column;flex:1}.card h2{font:700 23px/1.28 Georgia,serif;margin:0 0 12px}.card p{color:var(--muted);margin:0 0 20px;flex:1;overflow-wrap:anywhere}.read{align-self:flex-start;background:#20365f;color:white;border:0;border-radius:8px;padding:10px 16px;font-weight:700}.read:hover{background:#314f83}.status{color:var(--muted);text-align:center;margin:30px auto}.status.error{color:#b42318}.article{max-width:850px;margin:32px auto 75px}.article h1{font:700 clamp(32px,5vw,50px)/1.17 Georgia,serif;margin:20px 0}.article .articleCover{width:100%;max-height:500px;object-fit:contain;border-radius:10px;margin:15px 0 30px}.articleText{font:19px/1.85 Georgia,serif;overflow-wrap:anywhere}.articleText p{white-space:pre-wrap;margin:0 0 24px}.articleText h2{font-size:29px;line-height:1.3;margin:36px 0 15px}.articleText h3{font-size:24px;margin:30px 0 12px}.articleText img{max-width:100%;height:auto;display:block;margin:22px auto;border-radius:9px}.back{background:var(--soft);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 13px}.hidden{display:none!important}footer{border-top:1px solid var(--line);color:var(--muted);text-align:center;padding:24px}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.top{min-height:66px}.brand{font-size:19px}.hero{padding:35px 0 22px}.hero p{font-size:16px}.grid{grid-template-columns:1fr;gap:16px}.card h2{font-size:21px}.articleText{font-size:17px;line-height:1.75}.articleText h2{font-size:25px}}
</style>
</head>
<body>
<header><div class="wrap top"><div class="brand">JADIR BRITO</div><button class="theme" id="themeBtn" type="button" aria-label="Alternar tema">☾ Modo escuro</button></div></header>
<main class="wrap">
<section id="listing"><div class="hero"><h1>Estudos Bíblicos</h1><p>Conheça a Palavra de Deus por meio de estudos, referências bíblicas e ensinamentos para a vida cristã.</p></div><p id="status" class="status" role="status">Carregando estudos...</p><div id="grid" class="grid"></div></section>
<article id="article" class="article hidden"><button class="back" id="backBtn" type="button">← Voltar aos estudos</button><h1 id="articleTitle"></h1><div id="articleContent"></div><button class="back" id="backBottom" type="button">Ver outros estudos</button></article>
</main><footer>© <span id="year"></span> Jadir Brito — Estudos Bíblicos</footer>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getDatabase,ref,onValue} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
const firebaseConfig={
 apiKey:'AIzaSyAWs1MDxOQYjqZ5LlzC4IlXscyDs-N9xfM',
 authDomain:'namoro-f18ac.firebaseapp.com',
 databaseURL:'https://namoro-f18ac-default-rtdb.firebaseio.com',
 projectId:'namoro-f18ac',
 storageBucket:'namoro-f18ac.firebasestorage.app',
 messagingSenderId:'336479537433',
 appId:'1:336479537433:web:dd282c67e98ca196e05d88',
 measurementId:'G-1YLR1JNZYY'
};
const app=initializeApp(firebaseConfig),db=getDatabase(app),$=id=>document.getElementById(id);
let studies={},order=[],loadedStudies=false,loadedOrder=false,failed=false;
const title=e=>e?.titulo||'Estudo bíblico',cover=e=>e?.capa||e?.imagem||'',summary=e=>e?.resumo||e?.descricao||'',content=e=>e?.texto||e?.conteudo||'';
function validUrl(s){try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)}catch{return false}}
function orderedIds(){const ids=Object.keys(studies).sort((a,b)=>(Number(studies[b]?.criadoEm)||0)-(Number(studies[a]?.criadoEm)||0));const set=new Set(ids);return [...new Set([...order.filter(x=>set.has(x)),...ids])];}
function makeImage(url,alt,cls){if(!validUrl(url))return null;const img=document.createElement('img');img.src=url;img.alt=alt;img.className=cls;img.loading='lazy';return img}
function renderList(){if(!loadedStudies||!loadedOrder)return;const grid=$('grid');grid.replaceChildren();const ids=orderedIds();$('status').textContent='';$('status').classList.remove('error');if(!ids.length){$('status').textContent='Nenhum estudo publicado no momento.';return}for(const id of ids){const e=studies[id];if(!e)continue;const card=document.createElement('div');card.className='card';const img=makeImage(cover(e),title(e),'cover');if(img)card.append(img);const body=document.createElement('div');body.className='cardBody';const h=document.createElement('h2');h.textContent=title(e);const p=document.createElement('p');p.textContent=summary(e);const btn=document.createElement('button');btn.className='read';btn.textContent='LER ESTUDO COMPLETO';btn.addEventListener('click',()=>openStudy(id,true));body.append(h,p,btn);card.append(body);grid.append(card)}syncRoute()}
function renderText(parent,value){const root=document.createElement('div');root.className='articleText';const blocks=String(value||'').split(/\n\s*\n/);for(const block of blocks){const t=block.trim();if(!t)continue;const lines=t.split('\n');const p=document.createElement('p');p.textContent=lines.join('\n');root.append(p)}parent.append(root)}
function openStudy(id,push){const e=studies[id];if(!e)return;const url=new URL(location.href);url.searchParams.set('estudo',id);if(push)history.pushState({estudo:id},'',url);$('listing').classList.add('hidden');$('article').classList.remove('hidden');$('articleTitle').textContent=title(e);const area=$('articleContent');area.replaceChildren();const img=makeImage(cover(e),title(e),'articleCover');if(img)area.append(img);renderText(area,content(e));const extras=Array.isArray(e.imagens)?e.imagens:typeof e.imagens==='string'?e.imagens.split('\n'):[];for(const u of extras){const image=makeImage(String(u).trim(),title(e),'articleCover');if(image)area.append(image)}document.title=title(e)+' | Jadir Brito';window.scrollTo(0,0)}
function showList(push){if(push){const u=new URL(location.href);u.searchParams.delete('estudo');history.pushState({},'',u)}$('article').classList.add('hidden');$('listing').classList.remove('hidden');document.title='Jadir Brito | Estudos Bíblicos';window.scrollTo(0,0)}
function syncRoute(){const id=new URLSearchParams(location.search).get('estudo');if(id&&studies[id])openStudy(id,false);else showList(false)}
$('backBtn').onclick=()=>showList(true);$('backBottom').onclick=()=>showList(true);window.addEventListener('popstate',syncRoute);
onValue(ref(db,'restaurar/estudos'),snap=>{studies=snap.val()||{};loadedStudies=true;renderList()},err=>{failed=true;$('status').textContent='Não foi possível carregar os estudos. Verifique a conexão e as permissões de leitura do Firebase.';$('status').classList.add('error');console.error(err)});
onValue(ref(db,'restaurar/ordemEstudos'),snap=>{const v=snap.val();order=Array.isArray(v)?v:v&&typeof v==='object'?Object.values(v):[];loadedOrder=true;renderList()},err=>{console.warn('Não foi possível carregar a ordem dos estudos:',err);order=[];loadedOrder=true;renderList()});
$('year').textContent=new Date().getFullYear();const key='jb_theme';function applyTheme(dark){document.documentElement.classList.toggle('dark',dark);$('themeBtn').textContent=dark?'☀ Modo claro':'☾ Modo escuro';localStorage.setItem(key,dark?'dark':'light')};applyTheme(localStorage.getItem(key)==='dark');$('themeBtn').onclick=()=>applyTheme(!document.documentElement.classList.contains('dark'));
</script>
</body></html>
