<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vídeos | Restaurar</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}
header{
  text-align:center;
  padding:38px 15px 24px;
}
h1{
  letter-spacing:3px;
  font-size:clamp(30px,5vw,48px);
  margin:0 0 12px;
}
header p,.sub{color:#aaa}
nav{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  border-bottom:1px solid #292929;
  padding:14px;
}
nav a{
  color:#fff;
  text-decoration:none;
  font-size:13px;
  font-weight:bold;
  padding:13px 18px;
  border-radius:6px;
}
nav a:hover,nav .active{
  background:#b89455;
  color:#000;
}
main{
  max-width:1450px;
  min-height:65vh;
  margin:auto;
  padding:42px 20px 80px;
}
main h2,.sub{text-align:center}
.sub{margin-bottom:38px}
.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:22px;
}
.card{
  border:1px solid #292929;
  border-radius:12px;
  overflow:hidden;
}
.player{aspect-ratio:16/9}
.player iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}
.card h3{
  padding:15px;
  margin:0;
  font-size:16px;
  line-height:1.5;
  overflow-wrap:anywhere;
}
.empty{
  grid-column:1/-1;
  text-align:center;
  color:#aaa;
  padding:60px;
  border:1px dashed #444;
  border-radius:12px;
}
footer{
  position:relative;
  text-align:center;
  border-top:1px solid #292929;
  padding:30px;
  color:#aaa;
}
.a{
  position:absolute;
  bottom:8px;
  right:12px;
  color:#444;
  background:none;
  border:0;
  cursor:pointer;
}
.a:hover{color:white}
.overlay{
  position:fixed;
  inset:0;
  background:#000d;
  display:grid;
  place-items:center;
  padding:15px;
  z-index:5;
}
.overlay[hidden]{display:none}
.modal{
  width:min(760px,100%);
  max-height:94vh;
  overflow:auto;
  background:#111;
  border:1px solid #333;
  border-radius:12px;
  padding:24px;
}
.modal input{
  width:100%;
  padding:12px;
  background:#1b1b1b;
  border:1px solid #444;
  color:white;
  border-radius:7px;
  margin:8px 0 14px;
}
.btn{
  border:1px solid #444;
  border-radius:7px;
  background:#292929;
  color:white;
  padding:10px 14px;
  cursor:pointer;
}
.gold{
  background:#b89455;
  color:#000;
  border-color:#b89455;
}
.danger{background:#962424}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:12px 0;
}
.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  border:1px solid #333;
  border-radius:9px;
  padding:12px;
  margin:10px 0;
}
.item strong{overflow-wrap:anywhere}
.msg{color:#a7e9b3}
.error{color:#fda4af}
[hidden]{display:none!important}

@media(max-width:1100px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:800px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:500px){
  .grid{grid-template-columns:1fr}
  .item{display:block}
  nav a{padding:10px;font-size:12px}
}
</style>
</head>

<body>

<header>
  <h1>RESTAURAR</h1>
  <p>Mensagens de fé, esperança e restauração</p>
</header>

<nav>
  <a class="active" href="videos.html">VÍDEOS</a>
  <a href="testemunhos.html">TESTEMUNHOS</a>
  <a href="estudos.html">ESTUDOS</a>
</nav>

<main>
  <h2>VÍDEOS</h2>
  <p class="sub">
    Mensagens de fé, esperança e restauração para sua vida.
  </p>
  <div class="grid" id="grid">
    <div class="empty">Carregando vídeos...</div>
  </div>
</main>

<footer>
  <p><b>JADIR BRITO</b></p>
  <p>Fé • Esperança • Restauração</p>
  <button class="a" id="open" aria-label="Administração">A</button>
</footer>

<!-- LOGIN: SOMENTE SENHA -->

<div class="overlay" id="login" hidden>
  <div class="modal" style="max-width:400px">
    <h2>Administração</h2>
    <form id="loginForm">
      <label for="password">Senha do ADM</label>
      <input
        type="password"
        id="password"
        inputmode="numeric"
        required
        autocomplete="off"
      >
      <div class="actions">
        <button class="btn gold" type="submit">Entrar</button>
        <button type="button" class="btn" id="cancel">
          Cancelar
        </button>
      </div>
      <p class="msg" id="loginMsg"></p>
    </form>
  </div>
</div>

<!-- ADMINISTRADOR -->

<div class="overlay" id="panel" hidden>
  <div class="modal">
    <h2>Gerenciar vídeos</h2>

    <div class="actions">
      <button class="btn gold" id="save">
        Salvar alterações
      </button>
      <button class="btn" id="close">Fechar</button>
      <button class="btn danger" id="logout">Sair</button>
    </div>

    <p class="msg" id="msg"></p>

    <hr>

    <form id="videoForm">
      <input type="hidden" id="editing" value="-1">

      <label for="title">Título do vídeo</label>
      <input id="title" required maxlength="180">

      <label for="url">Link do YouTube</label>
      <input id="url" type="url" required>

      <div class="actions">
        <button class="btn gold" type="submit">
          Adicionar / Atualizar
        </button>
        <button type="button" class="btn" id="clear">
          Limpar
        </button>
      </div>
    </form>

    <hr>

    <h3>Vídeos cadastrados</h3>
    <div id="list"></div>

    <button class="btn gold" id="saveBottom">
      Salvar alterações
    </button>
  </div>
</div>

<script type="module">

import {initializeApp} from
'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';

import {
  getFirestore,
  doc,
  onSnapshot,
  setDoc
} from
'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';

import {
  getAuth,
  signInWithCustomToken,
  signOut,
  onAuthStateChanged
} from
'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';

/* FIREBASE DO SITE */

const firebaseConfig = {
  apiKey:"AIzaSyAWs1MDxOQYjqZ5LlzC4IlXscyDs-N9xfM",
  authDomain:"namoro-f18ac.firebaseapp.com",
  databaseURL:"https://namoro-f18ac-default-rtdb.firebaseio.com",
  projectId:"namoro-f18ac",
  storageBucket:"namoro-f18ac.firebasestorage.app",
  messagingSenderId:"336479537433",
  appId:"1:336479537433:web:dd282c67e98ca196e05d88",
  measurementId:"G-1YLR1JNZYY"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const ref = doc(db,"restaurar","publico");

const LOGIN_ENDPOINT =
  "https://us-central1-namoro-f18ac.cloudfunctions.net/restaurarAdminLogin";

const $ = id => document.getElementById(id);

let videos = [];
let draft = [];
let dirty = false;
let admin = false;
let busy = false;

/* IDENTIFICAR VÍDEO DO YOUTUBE */

function idFrom(url) {
  try {
    const u = new URL(url);
    let id = "";

    if (["youtu.be","www.youtu.be"].includes(u.hostname)) {
      id = u.pathname.split("/")[1] || "";
    } else if ([
      "youtube.com",
      "www.youtube.com",
      "m.youtube.com",
      "www.youtube-nocookie.com"
    ].includes(u.hostname)) {
      id = u.pathname === "/watch"
        ? u.searchParams.get("v") || ""
        : (u.pathname.match(
            /^\/(?:embed|shorts|live)\/([^/]+)/
          ) || [])[1] || "";
    }

    return /^[\w-]{11}$/.test(id) ? id : null;
  } catch {
    return null;
  }
}

function normalize(items) {
  return Array.isArray(items)
    ? items.filter(x => x && idFrom(x.url)).map(x => ({
        title:String(x.title || "Mensagem").slice(0,180),
        url:String(x.url)
      }))
    : [];
}

/* MOSTRAR VÍDEOS CADASTRADOS */

function render() {
  const grid = $("grid");
  grid.replaceChildren();

  if (!videos.length) {
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = "Em breve, novas mensagens.";
    grid.append(d);
    return;
  }

  for (const item of videos) {
    const card = document.createElement("article");
    card.className = "card";

    const p = document.createElement("div");
    p.className = "player";

    const frame = document.createElement("iframe");
    frame.src =
      "https://www.youtube-nocookie.com/embed/" +
      idFrom(item.url) + "?rel=0";

    frame.title = item.title;
    frame.loading = "lazy";
    frame.allow =
      "accelerometer; autoplay; clipboard-write; " +
      "encrypted-media; gyroscope; picture-in-picture; web-share";
    frame.allowFullscreen = true;

    p.append(frame);

    const h = document.createElement("h3");
    h.textContent = item.title;

    card.append(p,h);
    grid.append(card);
  }
}

function notice(text,error=false,el="msg") {
  $(el).textContent = text;
  $(el).className = "msg" + (error ? " error" : "");
}

function button(label,fn,cls="") {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "btn " + cls;
  b.textContent = label;
  b.onclick = fn;
  return b;
}

/* LISTA DO ADM */

function renderList() {
  const list = $("list");
  list.replaceChildren();

  draft.forEach((v,i) => {
    const row = document.createElement("div");
    row.className = "item";

    const title = document.createElement("strong");
    title.textContent = (i+1) + ". " + v.title;

    const actions = document.createElement("div");
    actions.className = "actions";

    actions.append(
      button("Editar",() => {
        $("editing").value = i;
        $("title").value = v.title;
        $("url").value = v.url;
        $("title").focus();
      }),

      button("↑",() => move(i,-1)),
      button("↓",() => move(i,1)),

      button("Excluir",() => {
        if (confirm("Excluir vídeo?")) {
          draft.splice(i,1);
          changed();
          renderList();
        }
      },"danger")
    );

    row.append(title,actions);
    list.append(row);
  });
}

function changed() {
  dirty = true;
  notice("Alterações pendentes. Clique em Salvar alterações.");
}

function move(i,d) {
  const j = i+d;
  if (j<0 || j>=draft.length) return;

  [draft[i],draft[j]] = [draft[j],draft[i]];
  changed();
  renderList();
}

function resetForm() {
  $("videoForm").reset();
  $("editing").value = "-1";
}

$("clear").onclick = resetForm;

$("videoForm").onsubmit = e => {
  e.preventDefault();

  const title = $("title").value.trim();
  const url = $("url").value.trim();

  if (!title || !idFrom(url)) {
    alert("Informe título e URL válida do YouTube.");
    return;
  }

  const i = Number($("editing").value);

  if (i>=0 && i<draft.length) {
    draft[i] = {title,url};
  } else {
    draft.push({title,url});
  }

  resetForm();
  changed();
  renderList();
};

/* ABRIR ADMINISTRADOR */

function openPanel() {
  if (!admin) return;

  draft = structuredClone(videos);
  dirty = false;
  renderList();
  resetForm();
  notice("");

  $("login").hidden = true;
  $("panel").hidden = false;
}

$("open").onclick = () => {
  if (admin) {
    openPanel();
  } else {
    $("login").hidden = false;
    $("password").focus();
  }
};

$("cancel").onclick = () => {
  $("login").hidden = true;
};

/* LOGIN SOMENTE COM SENHA */

$("loginForm").onsubmit = async e => {
  e.preventDefault();

  notice("Validando senha...",false,"loginMsg");

  try {
    const res = await fetch(LOGIN_ENDPOINT,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        password:$("password").value
      })
    });

    if (!res.ok) throw Error("Acesso negado");

    const data = await res.json();

    if (!data.token) throw Error("Token ausente");

    await signInWithCustomToken(auth,data.token);

    $("password").value = "";
    openPanel();

  } catch(err) {
    console.error(err);

    notice(
      "Senha incorreta ou serviço de login indisponível.",
      true,
      "loginMsg"
    );
  }
};

function close() {
  if (dirty && !confirm(
    "Descartar alterações não salvas?"
  )) return;

  dirty = false;
  $("panel").hidden = true;
}

$("close").onclick = close;

$("logout").onclick = async () => {
  if (dirty && !confirm(
    "Descartar alterações não salvas?"
  )) return;

  dirty = false;
  await signOut(auth);
  $("panel").hidden = true;
};

onAuthStateChanged(auth,user => {
  admin = !!user && user.uid === "restaurar-admin";

  if (!admin) {
    $("panel").hidden = true;
  }
});

/* SALVAR NO FIREBASE */

async function save() {
  if (!admin || busy) return;

  busy = true;
  notice("Salvando...");

  try {
    await setDoc(
      ref,
      {videos:normalize(draft)},
      {merge:true}
    );

    videos = normalize(draft);
    draft = structuredClone(videos);
    dirty = false;

    render();
    renderList();

    notice("Vídeos salvos no Firebase com sucesso!");

  } catch(e) {
    console.error(e);

    notice(
      "Erro ao salvar. Confira as regras do Firestore.",
      true
    );
  } finally {
    busy = false;
  }
}

$("save").onclick = save;
$("saveBottom").onclick = save;

/* CARREGAR VÍDEOS JÁ CADASTRADOS */

onSnapshot(ref,snapshot => {
  videos = normalize(
    snapshot.exists() ? snapshot.data().videos : []
  );

  render();

  if (!dirty) {
    draft = structuredClone(videos);

    if (!$("panel").hidden) {
      renderList();
    }
  }

},error => {
  console.error(error);
  $("grid").textContent =
    "Erro ao carregar vídeos. Confira o Firestore.";
});

window.addEventListener("beforeunload",e => {
  if (dirty) {
    e.preventDefault();
    e.returnValue = "";
  }
});

</script>
</body>
</html>
