<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}
header{padding:28px 12px;text-align:center;border-bottom:1px solid #222}
header h1{margin:0 0 20px;font-size:30px}
nav{display:flex;justify-content:center;gap:24px;flex-wrap:wrap}

.grade{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.card{background:#101010;border:1px solid #292929;border-radius:9px;overflow:hidden;min-width:0}

.player{width:100%;aspect-ratio:16/9;background:#111}

.thumb{display:block;width:100%;height:100%;border:0;padding:0;position:relative;background:#111;color:white;cursor:pointer}

.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#e62117;color:white;border-radius:12px;padding:12px 21px;font-size:23px;pointer-events:none}
.descricao{padding:10px 14px;color:#aaa;font-size:13px;line-height:1.6}
.acoes{padding:10px;display:flex;justify-content:flex-end}
.fim{background:#292929;color:#bbb;border:1px solid #444;border-radius:5px;padding:7px 12px;cursor:pointer}
footer{padding:35px;text-align:center;border-top:1px solid #222;color:#777;position:relative}
.adm-btn{position:absolute;right:12px;bottom:10px;background:none;border:0;color:#393939;font-size:11px;cursor:pointer}
.whats{position:fixed;bottom:18px;left:18px;background:#168b49;color:#fff;text-decoration:none;padding:13px 16px;border-radius:35px;font-size:12px;font-weight:bold;z-index:20;display:flex;align-items:center;gap:8px}
.whats svg{width:22px;height:22px;fill:currentColor}
.modal{display:none;position:fixed;inset:0;background:#000e;z-index:100;overflow:auto;padding:16px}
.modal.aberto{display:block}
.painel{max-width:800px;margin:20px auto;background:#111;border:1px solid #333;border-radius:10px;padding:23px}
.fechar{float:right;background:none;color:white;border:0;font-size:28px;cursor:pointer}
input,textarea{display:block;width:100%;background:#050505;color:white;border:1px solid #444;padding:12px;margin:10px 0 16px;font:inherit;border-radius:5px}
textarea{min-height:90px;resize:vertical}
label{display:block;color:#ddd;margin-top:12px}
.btn{background:#d4aa55;color:#000;border:0;border-radius:5px;padding:12px 17px;font-weight:bold;cursor:pointer}
.btn:disabled{opacity:.5}
.sec{background:#333;color:white}
hr{border:0;border-top:1px solid #333;margin:25px 0}
.linha{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid #333}
.linha-info{flex:1;min-width:160px;overflow-wrap:anywhere}
.linha-info small{display:block;color:#aaa;margin-top:5px}
.linha-acoes{display:flex;gap:5px;flex-wrap:wrap}
.linha-acoes button{padding:8px;border:1px solid #555;border-radius:5px;background:#333;color:white;cursor:pointer}
.linha-acoes .danger{background:#922}
.aviso{color:#aaa;line-height:1.6;white-space:pre-line}
.erro{color:#ff8585}
.sucesso{color:#a2e7b2}
@media(max-width:1100px){.grade{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:800px){.grade{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:550px){.grade{grid-template-columns:1fr}.painel{padding:15px}nav{gap:15px}nav a{font-size:12px}}
</style>
</head>

<script type="module">

import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,doc,onSnapshot,updateDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {getDatabase,ref,onValue,push,set,update,remove} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const firebaseConfig={
 apiKey:"AIzaSyAWs1MDxOQYjqZ5LlzC4IlXscyDs-N9xfM",
 authDomain:"namoro-f18ac.firebaseapp.com",
 databaseURL:"https://namoro-f18ac-default-rtdb.firebaseio.com",
 projectId:"namoro-f18ac",
 storageBucket:"namoro-f18ac.firebasestorage.app",
 messagingSenderId:"336479537433",
 appId:"1:336479537433:web:dd282c67e98ca196e05d88",
 measurementId:"G-1YLR1JNZYY"
};

const app=initializeApp(firebaseConfig);
const fs=getFirestore(app);
const db=getDatabase(app);
const auth=getAuth(app);

const documento=doc(fs,"restaurar","publico");
const videosRef=ref(db,"restaurar/videos");
const configRef=ref(db,"restaurar/config");
const ordemRef=ref(db,"restaurar/ordemVideos");

const $=id=>document.getElementById(id);

let dadosFS=[];
let dadosRT={};
let formatoFS="array";
let prontoFS=false;
let prontoRT=false;
let erroFS="";
let erroRT="";
let fonte="nenhuma";
let videos=[];
let ordem=[];
let ordemADM=[];
let ordemOficial=[];
let ordemPendente=false;
let config={titulo:"RESTAURAR",whatsapp:"5547988233530"};

const CHAVE="restaurar_fila_rapida_v2";

function msg(id,texto,erro=false){
 $(id).textContent=texto;
 $(id).className=erro?"erro":"sucesso";
}

function ytId(link){
 if(typeof link!=="string")return null;
 if(/^[\w-]{11}$/.test(link.trim()))return link.trim();

 try{
  const u=new URL(link);
  const h=u.hostname.toLowerCase().replace(/^www\./,"");
  let id="";

  if(h==="youtu.be"){
   id=u.pathname.split("/")[1];
  }else if([
   "youtube.com","m.youtube.com",
   "music.youtube.com","youtube-nocookie.com"
  ].includes(h)){
   if(u.pathname==="/watch"){
    id=u.searchParams.get("v");
   }else{
    const p=u.pathname.split("/").filter(Boolean);
    if(["embed","shorts","live","v"].includes(p[0]))id=p[1];
   }
  }

  return /^[\w-]{11}$/.test(id||"")?id:null;
 }catch{
  return null;
 }
}

function normalizar(v,id){
 if(typeof v==="string")v={url:v};
 if(!v||typeof v!=="object")return null;

 const link=String(
  v.url||v.link||v.youtube||v.videoUrl||""
 );
 const youtube=ytId(link);
 if(!youtube)return null;

 return{
  id:String(id),
  titulo:String(v.titulo||v.title||v.nome||"Vídeo"),
  link,
  descricao:String(v.descricao||v.description||""),
  criadoEm:Number(v.criadoEm)||0,
  youtube
 };
}

function listaFS(){
 return dadosFS.map(x=>normalizar(x.valor,x.id)).filter(Boolean);
}

function listaRT(){
 return Object.entries(dadosRT)
  .map(([id,v])=>normalizar(v,id))
  .filter(Boolean);
}

function lerOrdem(){
 try{
  const x=JSON.parse(localStorage.getItem(CHAVE));
  return Array.isArray(x)?x:[];
 }catch{return[]}
}

function guardarOrdem(){
 try{
  localStorage.setItem(CHAVE,JSON.stringify(ordem));
 }catch{}
}

function atualizar(){
 const f=listaFS();
 const r=listaRT();

 if(f.length){
  fonte="firestore";
  videos=f;
 }else if(r.length){
  fonte="realtime";
  videos=r;
 }else{
  fonte="nenhuma";
  videos=[];
 }

 const ids=videos.map(v=>v.id);
 const anterior=ordem.length?ordem:lerOrdem();

 const base=fonte==="realtime"&&ordemOficial.length?
  [...ordemOficial.filter(id=>ids.includes(id)),...ids]:
  ids;

 ordem=[
  ...new Set([
   ...anterior.filter(id=>ids.includes(id)),
   ...base
  ])
 ];

 guardarOrdem();

 if(!ordemPendente)ordemADM=[...ordem];

 render();
 renderADM();
}

function render(){
 const grade=$("grade");
 const mapa=new Map(videos.map(v=>[v.id,v]));

 if(!videos.length){
  $("estado").textContent=prontoFS&&prontoRT?
   (erroFS||erroRT?
    "Não foi possível localizar vídeos. Verifique as permissões do Firebase.":
    "Nenhum vídeo cadastrado encontrado."):
   "Carregando vídeos...";
  grade.replaceChildren();
  return;
 }

 $("estado").textContent="";

 const fragmento=document.createDocumentFragment();

 for(const id of ordem){
  const v=mapa.get(id);
  if(!v)continue;

  const card=document.createElement("article");
  card.className="card";

  const h=document.createElement("h3");
  h.textContent=v.titulo;

  const player=document.createElement("div");
  player.className="player";

  const thumb=document.createElement("button");
  thumb.className="thumb";
  thumb.type="button";
  thumb.setAttribute("aria-label","Assistir "+v.titulo);

  const img=document.createElement("img");
  img.src="https://i.ytimg.com/vi/"+v.youtube+"/hqdefault.jpg";
  img.alt=v.titulo;
  img.loading="lazy";
  img.decoding="async";

  const play=document.createElement("span");
  play.className="play";
  play.textContent="▶";

  thumb.append(img,play);

  thumb.onclick=()=>{
   const iframe=document.createElement("iframe");
   iframe.src="https://www.youtube-nocookie.com/embed/"+
    v.youtube+"?autoplay=1&rel=0";
   iframe.title=v.titulo;
   iframe.allow="autoplay; encrypted-media; picture-in-picture; fullscreen";
   iframe.allowFullscreen=true;
   iframe.referrerPolicy="strict-origin-when-cross-origin";
   player.replaceChildren(iframe);
  };

  player.append(thumb);

  card.append(h,player);

  if(v.descricao){
   const p=document.createElement("div");
   p.className="descricao";
   p.textContent=v.descricao;
   card.append(p);
  }

  const acoes=document.createElement("div");
  acoes.className="acoes";

  const x=document.createElement("button");
  x.className="fim";
  x.textContent="X";
  x.title="Enviar vídeo ao final da fila";

  x.onclick=()=>{
   ordem=ordem.filter(item=>item!==id);
   ordem.push(id);
   guardarOrdem();
   render();
  };

  acoes.append(x);
  card.append(acoes);
  fragmento.append(card);
 }

 grade.replaceChildren(fragmento);
}

/* ADMINISTRADOR */

$("abrirADM").onclick=()=>{
 $("modal").classList.add("aberto");
};

$("fecharADM").onclick=()=>{
 $("modal").classList.remove("aberto");
};

$("modal").onclick=e=>{
 if(e.target===$("modal"))$("modal").classList.remove("aberto");
};

document.addEventListener("keydown",e=>{
 if(e.key==="Escape")$("modal").classList.remove("aberto");
});

$("entrar").onclick=async()=>{
 try{
  $("erroLogin").textContent="";
  await signInWithEmailAndPassword(
   auth,$("email").value.trim(),$("senha").value
  );
 }catch(e){
  $("erroLogin").textContent="Erro: "+e.code;
 }
};

$("sair").onclick=()=>signOut(auth);

onAuthStateChanged(auth,u=>{
 $("login").style.display=u?"none":"block";
 $("adm").style.display=u?"block":"none";
 $("usuario").textContent=u?"Conectado: "+u.email:"";

 if(u){
  $("nomeSite").value=config.titulo;
  $("numeroWhats").value=config.whatsapp;
  renderADM();
 }
});

function configurar(){
 $("tituloSite").textContent=config.titulo||"RESTAURAR";
 $("whatsapp").href="https://wa.me/"+
  String(config.whatsapp||"5547988233530").replace(/\D/g,"");
}

$("salvarConfig").onclick=async()=>{
 try{
  await update(configRef,{
   titulo:$("nomeSite").value.trim()||"RESTAURAR",
   whatsapp:$("numeroWhats").value.replace(/\D/g,"")
  });
  msg("mensagemADM","Configurações salvas.");
 }catch(e){
  msg("mensagemADM",e.message,true);
 }
};

function limpar(){
 ["videoID","videoTitulo","videoLink","videoDescricao"]
  .forEach(id=>$(id).value="");

 $("tituloFormulario").textContent="CADASTRAR VÍDEO";
 $("salvarVideo").textContent="SALVAR VÍDEO";
}

$("limpar").onclick=limpar;

function editar(id){
 const v=videos.find(x=>x.id===id);
 if(!v)return;

 $("videoID").value=id;
 $("videoTitulo").value=v.titulo;
 $("videoLink").value=v.link;
 $("videoDescricao").value=v.descricao;

 $("tituloFormulario").textContent="EDITAR VÍDEO";
 $("salvarVideo").textContent="SALVAR ALTERAÇÕES";

 $("videoTitulo").scrollIntoView({
  behavior:"smooth",block:"center"
 });
}

function reconstruirFS(itens){
 if(formatoFS==="objeto"){
  return Object.fromEntries(
   itens.map(item=>[item.id,item.valor])
  );
 }
 return itens.map(item=>item.valor);
}

async function salvarFirestore(itens){
 await updateDoc(documento,{
  videos:reconstruirFS(itens)
 });
}

$("salvarVideo").onclick=async()=>{
 if(!auth.currentUser){
  return msg("mensagemADM","Entre no administrador.",true);
 }

 const id=$("videoID").value;
 const titulo=$("videoTitulo").value.trim();
 const link=$("videoLink").value.trim();
 const descricao=$("videoDescricao").value.trim();

 if(!titulo||!ytId(link)){
  return msg("mensagemADM","Informe título e link válido.",true);
 }

 const b=$("salvarVideo");
 b.disabled=true;

 try{
  if(fonte==="firestore"){
   const itens=dadosFS.map(x=>({...x}));

   const novo={
    title:titulo,
    url:link,
    description:descricao
   };

   if(id!==""){
    const item=itens.find(x=>x.id===id);
    if(!item)throw Error("Vídeo não encontrado.");
    item.valor={...item.valor,...novo};
   }else{
    const novoId=formatoFS==="objeto"?
     "video_"+Date.now():""+itens.length;

    itens.push({id:novoId,valor:novo});
   }

   await salvarFirestore(itens);

  }else{
   const novo={
    titulo,link,descricao,atualizadoEm:Date.now()
   };

   if(id){
    await update(ref(db,"restaurar/videos/"+id),novo);
   }else{
    await set(push(videosRef),{
     ...novo,criadoEm:Date.now()
    });
   }
  }

  limpar();
  msg("mensagemADM","Vídeo salvo no Firebase.");

 }catch(e){
  msg("mensagemADM","Erro: "+e.message,true);
 }finally{
  b.disabled=false;
 }
};

function renderADM(){
 if(!auth.currentUser)return;

 const area=$("listaADM");
 area.replaceChildren();

 $("fonte").textContent=
  "Fonte ativa: "+fonte+
  "\nVídeos: "+videos.length+
  (erroFS?"\nFirestore: "+erroFS:"")+
  (erroRT?"\nRealtime: "+erroRT:"");

 const mapa=new Map(videos.map(v=>[v.id,v]));

 ordemADM=[
  ...new Set([
   ...ordemADM.filter(id=>mapa.has(id)),
   ...videos.map(v=>v.id)
  ])
 ];

 for(const [i,id] of ordemADM.entries()){
  const v=mapa.get(id);
  if(!v)continue;

  const linha=document.createElement("div");
  linha.className="linha";

  const info=document.createElement("div");
  info.className="linha-info";

  const strong=document.createElement("strong");
  strong.textContent=(i+1)+". "+v.titulo;

  const small=document.createElement("small");
  small.textContent=v.link;

  info.append(strong,small);

  const acoes=document.createElement("div");
  acoes.className="linha-acoes";

  function bot(texto,fn,classe=""){
   const b=document.createElement("button");
   b.textContent=texto;
   b.className=classe;
   b.onclick=fn;
   acoes.append(b);
  }

  bot("↑",()=>mover(id,-1));
  bot("↓",()=>mover(id,1));
  bot("EDITAR",()=>editar(id));

  bot("EXCLUIR",async()=>{
   if(!confirm("Excluir este vídeo?"))return;

   try{
    if(fonte==="firestore"){
     await salvarFirestore(
      dadosFS.filter(x=>x.id!==id)
     );
    }else{
     await remove(ref(db,"restaurar/videos/"+id));
    }

    msg("mensagemOrdem","Vídeo excluído.");
   }catch(e){
    msg("mensagemOrdem",e.message,true);
   }
  },"danger");

  linha.append(info,acoes);
  area.append(linha);
 }
}

function mover(id,direcao){
 const i=ordemADM.indexOf(id);
 const j=i+direcao;

 if(j<0||j>=ordemADM.length)return;

 [ordemADM[i],ordemADM[j]]=
 [ordemADM[j],ordemADM[i]];

 ordemPendente=true;
 renderADM();
 msg("mensagemOrdem","Clique em SALVAR ORDEM.");
}

$("salvarOrdem").onclick=async()=>{
 if(!auth.currentUser)return;

 try{
  if(fonte==="firestore"){
   const mapa=new Map(dadosFS.map(x=>[x.id,x]));
   await salvarFirestore(
    ordemADM.map(id=>mapa.get(id)).filter(Boolean)
   );
  }else if(fonte==="realtime"){
   await set(ordemRef,ordemADM);
  }else{
   throw Error("Nenhuma fonte de vídeos disponível.");
  }

  ordemPendente=false;
  ordem=[...ordemADM];
  guardarOrdem();
  render();

  msg("mensagemOrdem","Ordem salva.");
 }catch(e){
  msg("mensagemOrdem",e.message,true);
 }
};

/* FIREBASE — SOMENTE VÍDEOS */

onSnapshot(documento,s=>{
 const d=s.exists()?s.data():{};
 const valor=d.videos;

 formatoFS=Array.isArray(valor)?"array":"objeto";

 dadosFS=Array.isArray(valor)?
  valor.map((v,i)=>({id:String(i),valor:v})):
  (valor&&typeof valor==="object"?
   Object.entries(valor).map(([id,v])=>({id,valor:v})):
   []);

 prontoFS=true;
 erroFS="";
 atualizar();

},e=>{
 prontoFS=true;
 erroFS=e.message;
 dadosFS=[];
 atualizar();
});

onValue(videosRef,s=>{
 dadosRT=s.val()||{};
 prontoRT=true;
 erroRT="";
 atualizar();

},e=>{
 prontoRT=true;
 erroRT=e.message;
 dadosRT={};
 atualizar();
});

onValue(ordemRef,s=>{
