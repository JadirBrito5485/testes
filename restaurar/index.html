
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restaurar | Jadir Brito</title>
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font:16px/1.65 Arial,sans-serif}
main{max-width:950px;margin:auto;padding:20px 14px}
section{margin-bottom:55px}
h2{text-align:center;font-size:clamp(25px,4vw,36px)}
p{color:#bbb}
button{cursor:pointer}
button,input,textarea{font:inherit}
.carousel{position:relative}
.video-title{text-align:center;font-size:clamp(23px,4vw,38px)}
.player{aspect-ratio:16/9;background:#111;position:relative;overflow:hidden;border-radius:12px}
.player img,.player iframe{width:100%;height:100%;object-fit:cover;border:0}
.play{position:absolute;inset:0;background:transparent;border:0;color:white;font-size:60px;text-shadow:0 3px 15px #000}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;background:#000a;color:#fff;border:1px solid #777;border-radius:50%;width:44px;height:44px;font-size:26px}
.prev{left:8px}.next{right:8px}
.arrow:disabled{opacity:.25}
.counter{text-align:center;color:#aaa;font-size:13px;margin:10px}
.testimony{width:100%;height:min(70vh,600px);object-fit:contain;background:#111;border-radius:12px}
.channel{display:block;max-width:800px;margin:auto}
.channel img{width:100%;max-height:500px;object-fit:contain;border-radius:12px}
.studies{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.study{background:#111;border:1px solid #333;border-radius:12px;overflow:hidden}
.study img{width:100%;height:190px;object-fit:cover}
.study-body{padding:18px}
.study h3{margin:0}
.btn{background:#262626;color:white;border:1px solid #555;border-radius:9px;padding:10px 16px}
.primary{background:#37d39a;color:#00190f;font-weight:bold;border:0}
footer{text-align:center;border-top:1px solid #333;padding:30px}
.social{display:flex;justify-content:center;gap:20px}
.social a{color:white;font-size:16px;text-decoration:none;border:1px solid #555;padding:10px;border-radius:12px}
.admin-a{display:block;margin:25px auto 0;background:none;border:0;color:#fff;opacity:.12;font-size:11px}
.admin-a:hover{opacity:1}
.chat{position:fixed;right:14px;bottom:14px;z-index:10;text-decoration:none;text-align:center}
.chat-label{display:block;background:#151515;color:white;border:1px solid #444;border-radius:15px;padding:5px 10px;font-size:11px;font-weight:bold}
.chat-icon{display:grid;place-items:center;margin:5px auto;background:#25d366;color:white;width:58px;height:58px;border-radius:50%;font-size:31px}
.hidden{display:none!important}
.overlay{position:fixed;inset:0;background:#000d;z-index:30;display:flex;align-items:center;justify-content:center;padding:12px}
.modal{background:#101010;border:1px solid #444;border-radius:14px;padding:20px;width:min(900px,100%);max-height:94vh;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-head h2{text-align:left}
.field{display:grid;gap:5px;margin:12px 0}
input,textarea{background:#202020;color:white;border:1px solid #555;padding:11px;border-radius:8px;width:100%}
textarea{min-height:90px}
.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
.tabs button.active{background:#37d39a;color:black}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid #444;border-radius:9px;padding:12px;margin:10px 0}
.article{line-height:1.8;overflow-wrap:anywhere}
.article img{max-width:100%;height:auto}
.article a{color:#37d39a}
.ql-toolbar,.ql-container{background:white;color:#222}
.ql-editor{min-height:260px}
.empty{text-align:center;padding:40px;color:#aaa}
@media(max-width:600px){main{padding:12px}section{margin-bottom:40px}.modal{padding:12px}.arrow{width:36px;height:36px}.testimony{height:450px}}
</style>
</head>
<body>

<main>
<section>
<h2 id="videosHeading">Vídeos do YouTube</h2>
<h3 class="video-title" id="videoTitle"></h3>
<div class="carousel">
<div class="player" id="videoStage"></div>
<button class="arrow prev" id="videoPrev">❮</button>
<button class="arrow next" id="videoNext">❯</button>
</div>
<div class="counter" id="videoCount"></div>
</section>

<section>
<h2 id="testimoniesHeading">Testemunhos</h2>
<div class="carousel">
<div id="testimonyStage"></div>
<button class="arrow prev" id="testimonyPrev">❮</button>
<button class="arrow next" id="testimonyNext">❯</button>
</div>
<div class="counter" id="testimonyCount"></div>
</section>

<section>
<h2 id="channelHeading">Canal do WhatsApp</h2>
<p id="channelText" style="text-align:center"></p>
<a id="channelLink" class="channel hidden" target="_blank" rel="noopener noreferrer">
<img id="channelImage" alt="Clique para acessar nosso canal do WhatsApp">
</a>
</section>

<section>
<h2 id="studiesHeading">Estudos bíblicos</h2>
<div class="studies" id="studiesGrid"></div>
</section>
</main>

<footer>
<p id="footerText">Jadir Brito</p>
<div class="social">
<a id="youtubeSocial" class="hidden" target="_blank" rel="noopener noreferrer">▶ YouTube</a>
<a id="tiktokSocial" class="hidden" target="_blank" rel="noopener noreferrer">♪ TikTok</a>
</div>
<button id="openAdmin" class="admin-a">A</button>
</footer>

<a id="chat" class="chat hidden" target="_blank" rel="noopener noreferrer">
<span class="chat-label" id="chatLabel">FALE COM O PROFETA</span>
<span class="chat-icon">☎</span>
</a>

<div class="overlay hidden" id="adminOverlay">
<div class="modal">
<div class="modal-head">
<h2>ADM Restaurar</h2>
<button class="btn" id="closeAdmin">Fechar</button>
</div>

<div id="loginPanel">
<p>Entre com sua conta do Firebase Authentication.</p>
<div class="field"><label>E-mail</label><input id="loginEmail" type="email"></div>
<div class="field"><label>Senha</label><input id="loginPassword" type="password"></div>
<button class="btn primary" id="loginButton">Entrar</button>
</div>

<div id="adminPanel" class="hidden">
<div class="actions">
<span id="adminEmail"></span>
<button class="btn" id="logoutButton">Sair</button>
</div>
<div class="tabs" id="tabs">
<button class="btn active" data-tab="settings">Textos e links</button>
<button class="btn" data-tab="videos">Vídeos</button>
<button class="btn" data-tab="testimonies">Testemunhos</button>
<button class="btn" data-tab="studies">Estudos</button>
</div>
<div id="tabPanel"></div>
</div>
<p id="status"></p>
</div>
</div>

<div class="overlay hidden" id="articleOverlay">
<div class="modal">
<div class="modal-head">
<h2 id="articleTitle"></h2>
<button class="btn" id="closeArticle">Fechar</button>
</div>
<div class="article" id="articleContent"></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getDatabase,ref,onValue,set,push,remove} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const firebaseConfig={
apiKey:"AIzaSyAWs1MDxOQYjqZ5LlzC4IlXscyDs-N9xfM",
authDomain:"namoro-f18ac.firebaseapp.com",
databaseURL:"https://namoro-f18ac-default-rtdb.firebaseio.com",
projectId:"namoro-f18ac",
storageBucket:"namoro-f18ac.firebasestorage.app",
messagingSenderId:"336479537433",
appId:"1:336479537433:web:dd282c67e98ca196e05d88",
measurementId:"G-1YLR1JNZYY"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const auth=getAuth(app);
const BASE="restaurar";
const $=id=>document.getElementById(id);

const defaults={
videosHeading:"Vídeos do YouTube",
testimoniesHeading:"Testemunhos",
channelHeading:"Canal do WhatsApp",
channelText:"Clique na imagem para acessar nosso canal.",
channelUrl:"",
channelImageUrl:"",
studiesHeading:"Estudos bíblicos",
footerText:"Jadir Brito",
youtubeUrl:"",
tiktokUrl:"",
whatsappNumber:"",
whatsappMessage:"Olá! Gostaria de receber atendimento.",
chatLabel:"FALE COM O PROFETA"
};

let data={settings:{...defaults},videos:{},testimonies:{},studies:{}};
let videoIndex=0,testimonyIndex=0,tab="settings",editId=null,editor=null;

function escapeHTML(s){
return String(s??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}
function https(s){
try{return new URL(s).protocol==="https:"}catch{return false}
}
function host(s,hosts){
try{
const u=new URL(s);
return u.protocol==="https:"&&hosts.some(h=>u.hostname===h||u.hostname.endsWith("."+h));
}catch{return false}
}
function youtubeId(url){
try{
const u=new URL(url);
const h=u.hostname.replace(/^www\./,"");
let id=null;
if(h==="youtu.be")id=u.pathname.split("/")[1];
else if(["youtube.com","m.youtube.com","youtube-nocookie.com"].includes(h)){
id=u.searchParams.get("v");
if(!id&&/^\/(shorts|live|embed)\//.test(u.pathname))id=u.pathname.split("/")[2];
}
return /^[a-zA-Z0-9_-]{11}$/.test(id||"")?id:null;
}catch{return null}
}
function cleanHTML(html){
const doc=new DOMParser().parseFromString(html||"","text/html");
const allowed=new Set(["P","BR","H1","H2","H3","H4","B","STRONG","I","EM","U","S","UL","OL","LI","A","IMG","BLOCKQUOTE","DIV","SPAN","PRE","CODE"]);
for(const el of [...doc.body.querySelectorAll("*")].reverse()){
if(!allowed.has(el.tagName)){el.remove();continue}
for(const a of [...el.attributes]){
const n=a.name,v=a.value;
const ok=(n==="href"&&el.tagName==="A"&&https(v))||
(n==="src"&&el.tagName==="IMG"&&https(v))||
(n==="class"&&/^ql-(align-(center|right|justify)|indent-[1-8]|size-(small|large|huge))$/.test(v));
if(!ok)el.removeAttribute(n);
}
if(el.tagName==="A")el.setAttribute("rel","noopener noreferrer");
}
return doc.body.innerHTML;
}
function sorted(k){
return Object.entries(data[k]||{}).map(([id,x])=>({id,...x}))
.sort((a,b)=>(a.order||0)-(b.order||0));
}
function say(s){$("status").textContent=s}

function renderVideo(){
const arr=sorted("videos");
videoIndex=arr.length?(videoIndex+arr.length)%arr.length:0;
const v=arr[videoIndex];
const stage=$("videoStage");
stage.replaceChildren();
$("videoTitle").textContent=v?.title||"";
$("videoCount").textContent=arr.length?`${videoIndex+1} de ${arr.length}`:"";
$("videoPrev").disabled=$("videoNext").disabled=arr.length<2;
const id=v?youtubeId(v.url):null;
if(!id){stage.innerHTML='<div class="empty">Nenhum vídeo cadastrado.</div>';return}
const img=document.createElement("img");
img.src=`https://img.youtube.com/vi/${id}/hqdefault.jpg`;
img.alt=v.title||"Vídeo";
const play=document.createElement("button");
play.className="play";
play.textContent="▶";
play.setAttribute("aria-label","Assistir vídeo");
play.onclick=()=>{
const frame=document.createElement("iframe");
frame.src=`https://www.youtube-nocookie.com/embed/${id}?autoplay=1`;
frame.title=v.title||"Vídeo";
frame.allow="autoplay; encrypted-media; picture-in-picture; fullscreen";
frame.allowFullscreen=true;
stage.replaceChildren(frame);
if(document.fullscreenEnabled)stage.requestFullscreen?.().catch(()=>{});
};
stage.append(img,play);
}
function renderTestimony(){
const arr=sorted("testimonies");
testimonyIndex=arr.length?(testimonyIndex+arr.length)%arr.length:0;
const v=arr[testimonyIndex];
$("testimonyCount").textContent=arr.length?`${testimonyIndex+1} de ${arr.length}`:"";
$("testimonyPrev").disabled=$("testimonyNext").disabled=arr.length<2;
const stage=$("testimonyStage");
stage.replaceChildren();
if(v&&https(v.url)){
const img=document.createElement("img");
img.src=v.url;img.className="testimony";
img.alt=v.title||"Testemunho";
stage.append(img);
}else stage.innerHTML='<div class="empty">Nenhum testemunho cadastrado.</div>';
}
function renderSettings(){
const t={...defaults,...data.settings};
for(const k of ["videosHeading","testimoniesHeading","channelHeading","channelText","studiesHeading","footerText","chatLabel"])$(k).textContent=t[k]||"";
const channel=host(t.channelUrl,["whatsapp.com"])&&
new URL(t.channelUrl||"https://whatsapp.com").pathname.startsWith("/channel/")&&https(t.channelImageUrl);
$("channelLink").classList.toggle("hidden",!channel);
if(channel){
$("channelLink").href=t.channelUrl;
$("channelImage").src=t.channelImageUrl;
}else{
$("channelLink").removeAttribute("href");
$("channelImage").removeAttribute("src");
}
for(const [id,key,hosts] of [
["youtubeSocial","youtubeUrl",["youtube.com","youtu.be"]],
["tiktokSocial","tiktokUrl",["tiktok.com"]]
]){
const el=$(id),ok=host(t[key],hosts);
el.classList.toggle("hidden",!ok);
if(ok)el.href=t[key];
else el.removeAttribute("href");
}
const phone=String(t.whatsappNumber||"").replace(/\D/g,"");
$("chat").classList.toggle("hidden",phone.length<10);
if(phone.length>=10)$("chat").href=`https://wa.me/${phone}?text=${encodeURIComponent(t.whatsappMessage||"Olá!")}`;
}
function renderStudies(){
const arr=sorted("studies");
$("studiesGrid").innerHTML=arr.length?arr.map(v=>`
<article class="study">
${https(v.image)?`<img src="${escapeHTML(v.image)}" alt="${escapeHTML(v.title)}" loading="lazy">`:""}
<div class="study-body">
<h3>${escapeHTML(v.title)}</h3>
<p>${escapeHTML(v.summary||"")}</p>
<button class="btn primary" data-read="${escapeHTML(v.id)}">Ler estudo</button>
</div>
</article>`).join(""):'<div class="empty">Nenhum estudo cadastrado.</div>';
}

for(const k of ["settings","videos","testimonies","studies"]){
onValue(ref(db,`${BASE}/${k}`),snap=>{
data[k]=snap.val()||(k==="settings"?{...defaults}:{});
if(k==="settings")renderSettings();
if(k==="videos")renderVideo();
if(k==="testimonies")renderTestimony();
if(k==="studies")renderStudies();
},e=>say("Erro Firebase: "+e.message));
}
$("videoPrev").onclick=()=>{videoIndex--;renderVideo()};
$("videoNext").onclick=()=>{videoIndex++;renderVideo()};
$("testimonyPrev").onclick=()=>{testimonyIndex--;renderTestimony()};
$("testimonyNext").onclick=()=>{testimonyIndex++;renderTestimony()};

$("studiesGrid").onclick=e=>{
const b=e.target.closest("[data-read]");
if(!b)return;
const v=data.studies[b.dataset.read];
if(!v)return;
$("articleTitle").textContent=v.title;
$("articleContent").innerHTML=(https(v.image)?`<img src="${escapeHTML(v.image)}" alt="">`:"")+cleanHTML(v.html);
$("articleOverlay").classList.remove("hidden");
};
$("closeArticle").onclick=()=>$("articleOverlay").classList.add("hidden");

$("openAdmin").onclick=()=>$("adminOverlay").classList.remove("hidden");
$("closeAdmin").onclick=()=>$("adminOverlay").classList.add("hidden");
$("loginButton").onclick=async()=>{
try{
say("Autenticando...");
await signInWithEmailAndPassword(auth,$("loginEmail").value.trim(),$("loginPassword").value);
$("loginPassword").value="";
say("");
}catch(e){say("Não foi possível entrar. Confira sua conta Firebase.")}
};
$("logoutButton").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{
$("loginPanel").classList.toggle("hidden",!!u);
$("adminPanel").classList.toggle("hidden",!u);
if(u){$("adminEmail").textContent=u.email;renderTab()}
else{editId=null;say("")}
});
$("tabs").onclick=e=>{
const b=e.target.closest("[data-tab]");
if(!b)return;
tab=b.dataset.tab;editId=null;
document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("active",x===b));
renderTab();
};

const fields=[
["videosHeading","Título dos vídeos"],
["testimoniesHeading","Título dos testemunhos"],
["channelHeading","Título do canal"],
["channelText","Texto do canal"],
["channelUrl","Link do canal WhatsApp"],
["channelImageUrl","Link da imagem do canal"],
["studiesHeading","Título dos estudos"],
["footerText","Texto do rodapé"],
["youtubeUrl","Link do YouTube"],
["tiktokUrl","Link do TikTok"],
["whatsappNumber","Número WhatsApp (55 + DDD + número)"],
["whatsappMessage","Mensagem inicial do atendimento"],
["chatLabel","Texto acima do WhatsApp flutuante"]
];

function field(id,label,value="",multi=false){
return `<div class="field"><label for="${id}">${escapeHTML(label)}</label>${multi?`<textarea id="${id}">${escapeHTML(value)}</textarea>`:`<input id="${id}" value="${escapeHTML(value)}">`}</div>`;
}
async function save(p){
try{say("Salvando...");await p;say("Salvo com sucesso.");return true}
catch(e){say("Erro ao salvar: "+e.message);return false}
}
function renderTab(){
if(!auth.currentUser)return;
editor=null;
const box=$("tabPanel");
if(tab==="settings"){
box.innerHTML=`${fields.map(([k,l])=>field("cfg_"+k,l,data.settings[k]??defaults[k],k==="channelText")).join("")}
<button class="btn primary" id="saveSettings">Salvar textos e links</button>`;
$("saveSettings").onclick=async()=>{
const next={};
for(const [k] of fields)next[k]=$("cfg_"+k).value.trim();
if(next.channelUrl&&(!host(next.channelUrl,["whatsapp.com"])||!new URL(next.channelUrl).pathname.startsWith("/channel/")))return say("Informe o link correto do canal do WhatsApp.");
if(next.channelImageUrl&&!https(next.channelImageUrl))return say("A imagem precisa de URL HTTPS.");
if(next.youtubeUrl&&!host(next.youtubeUrl,["youtube.com","youtu.be"]))return say("Link YouTube inválido.");
if(next.tiktokUrl&&!host(next.tiktokUrl,["tiktok.com"]))return say("Link TikTok inválido.");
await save(set(ref(db,`${BASE}/settings`),next));
};
return;
}
const arr=sorted(tab);
const v=editId?data[tab][editId]:null;
box.innerHTML=`
<h3>${editId?"Editar":"Cadastrar"} conteúdo</h3>
${field("itemTitle","Título",v?.title)}
${field("itemUrl",tab==="videos"?"Link do vídeo YouTube":"Link da imagem",tab==="studies"?v?.image:v?.url)}
${tab==="studies"?field("itemSummary","Resumo",v?.summary,true):""}
${field("itemOrder","Ordem",v?.order??arr.length)}
${tab==="studies"?'<label>Texto completo do estudo</label><div id="editor"></div>':""}
<div class="actions">
<button class="btn primary" id="saveItem">Salvar</button>
<button class="btn" id="newItem">Novo cadastro</button>
</div>
<h3>Itens cadastrados</h3>
<div id="itemList">${arr.map(x=>`<div class="item"><span>${escapeHTML(x.title)}</span><div class="actions"><button class="btn" data-edit="${escapeHTML(x.id)}">Editar</button><button class="btn" data-delete="${escapeHTML(x.id)}">Excluir</button></div></div>`).join("")}</div>`;

if(tab==="studies"){
if(typeof Quill==="undefined"){say("Editor indisponível.");$("saveItem").disabled=true}
else{
editor=new Quill("#editor",{theme:"snow",modules:{toolbar:[
[{header:[1,2,3,false]}],
[{size:["small",false,"large","huge"]}],
["bold","italic","underline","strike"],
[{color:[]},{background:[]}],
[{align:[]}],
[{list:"ordered"},{list:"bullet"}],
["blockquote","link","image"],["clean"]
]}});
editor.clipboard.dangerouslyPasteHTML(cleanHTML(v?.html||""));
}
}
$("newItem").onclick=()=>{editId=null;renderTab()};
$("saveItem").onclick=async()=>{
const title=$("itemTitle").value.trim();
const url=$("itemUrl").value.trim();
const order=Number($("itemOrder").value)||0;
if(!title)return say("Informe o título.");
if(tab==="videos"&&!youtubeId(url))return say("Link YouTube inválido.");
if(tab!=="videos"&&url&&!https(url))return say("Link de imagem inválido.");
const record={title,order,...(tab==="studies"?{
image:url,summary:$("itemSummary").value.trim(),
html:cleanHTML(editor.root.innerHTML)
}:{url})};
const target=editId?ref(db,`${BASE}/${tab}/${editId}`):push(ref(db,`${BASE}/${tab}`));
if(await save(set(target,record))){editId=null;renderTab()}
};
$("itemList").onclick=async e=>{
const b=e.target.closest("button");
if(!b)return;
if(b.dataset.edit){editId=b.dataset.edit;renderTab()}
else if(b.dataset.delete&&confirm("Excluir este conteúdo?")){
if(await save(remove(ref(db,`${BASE}/${tab}/${b.dataset.delete}`))))renderTab();
}
};
}
</script>
</body>
</html>
