
<!DOCTYPE html>

<head>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  padding:30px 15px;
  text-align:center;
  border-bottom:1px solid #222;
}

header h1{
  margin:0 0 20px;
  font-size:30px;
}

nav{
  display:flex;
  justify-content:center;
  gap:25px;
  flex-wrap:wrap;
}

nav a{
  color:#ddd;
  text-decoration:none;
  font-weight:bold;
  font-size:14px;
}

nav a.active,
nav a:hover{color:#e4bd67}

main{
  max-width:1200px;
  margin:auto;
  padding:35px 18px;
  min-height:65vh;
}

h2{
  font-size:25px;
  margin-bottom:25px;
}

.grade{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:20px;
}

.card{
  background:#101010;
  border:1px solid #282828;
  border-radius:10px;
  overflow:hidden;
  position:relative;
  min-width:0;
}

.video-box{
  position:relative;
  aspect-ratio:16/9;
  background:#080808;
  overflow:hidden;
}

.video-box iframe{
  display:block;
  width:100%;
  height:100%;
  border:0;
}

.capa-video{
  position:absolute;
  inset:0;
  display:block;
  width:100%;
  height:100%;
  padding:0;
  border:0;
  background:#111;
  cursor:pointer;
  overflow:hidden;
}

.capa-video img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.capa-video:hover img{
  filter:brightness(.8);
}

.play{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:68px;
  height:48px;
  background:#e62117;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 3px 15px #0009;
  pointer-events:none;
}

.play:after{
  content:"";
  border-top:11px solid transparent;
  border-bottom:11px solid transparent;
  border-left:18px solid #fff;
  margin-left:4px;
}

.card h3{
  padding:15px;
  font-size:17px;
  margin:0;
  line-height:1.5;
  overflow-wrap:anywhere;
}

.card p{
  padding:0 15px 15px;
  color:#aaa;
  line-height:1.6;
  margin:0;
  overflow-wrap:anywhere;
}

.botao-x{
  position:absolute;
  top:8px;
  right:8px;
  z-index:5;
  width:34px;
  height:34px;
  border:1px solid #555;
  border-radius:50%;
  background:rgba(0,0,0,.85);
  color:#fff;
  font-size:22px;
  cursor:pointer;
}

.botao-x:hover{background:#a32323}

footer{
  padding:35px;
  text-align:center;
  border-top:1px solid #222;
  color:#777;
  position:relative;
}

.adm-btn{
  position:absolute;
  right:12px;
  bottom:10px;
  background:none;
  border:0;
  color:#393939;
  cursor:pointer;
  font-size:11px;
}

.whats{
  position:fixed;
  bottom:20px;
  left:20px;
  background:#168b49;
  color:#fff;
  padding:13px 17px;
  border-radius:35px;
  text-decoration:none;
  font-weight:bold;
  font-size:13px;
  z-index:10;
  display:flex;
  align-items:center;
  gap:8px;
}

.whats svg{
  width:22px;
  height:22px;
  fill:currentColor;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#000e;
  z-index:100;
  overflow:auto;
  padding:25px;
}

.modal.aberto{display:block}

.painel{
  max-width:750px;
  margin:25px auto;
  background:#111;
  border:1px solid #333;
  border-radius:12px;
  padding:25px;
}

input,textarea{
  display:block;
  width:100%;
  background:#050505;
  color:white;
  border:1px solid #444;
  padding:13px;
  margin:10px 0 16px;
  border-radius:5px;
  font:inherit;
}

textarea{min-height:100px}

button.acao{
  background:#d4aa55;
  color:#000;
  border:0;
  padding:12px 18px;
  border-radius:5px;
  font-weight:bold;
  cursor:pointer;
}

button.acao:disabled{
  opacity:.5;
  cursor:wait;
}

button.excluir{
  background:#a32323;
  color:#fff;
  border:0;
  padding:9px;
  border-radius:5px;
  cursor:pointer;
}

.linha{
  padding:14px 0;
  border-bottom:1px solid #333;
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
}

.fechar{
  float:right;
  background:transparent;
  color:#fff;
  border:0;
  font-size:25px;
  cursor:pointer;
}

.aviso{
  color:#aaa;
  line-height:1.5;
}

.erro{color:#ff8585}
.ok{color:#9be3ac}

@media(max-width:850px){
  .grade{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:550px){
  .grade{
    grid-template-columns:1fr;
  }

  header h1{font-size:25px}
  .whats{font-size:11px}
}
</style>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  push,
  set,
  remove,
  update
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

/*
  MESMO PROJETO FIREBASE DO SITE ANTERIOR.
  Os vídeos cadastrados continuam no caminho:
  restaurar/videos
*/

const firebaseConfig={
  apiKey:"AIzaSyAWs1MDxOQYjqZ5LlzC4IlXscyDs-N9xfM",
  authDomain:"namoro-f18ac.firebaseapp.com",
  databaseURL:"https://namoro-f18ac-default-rtdb.firebaseio.com",
  projectId:"namoro-f18ac",
  storageBucket:"namoro-f18ac.firebasestorage.app",
  messagingSenderId:"336479537433",
  appId:"1:336479537433:web:dd282c67e98ca196e05d88",
  measurementId:"G-1YLR1JNZYY"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const auth=getAuth(app);

const $=id=>document.getElementById(id);

const videosRef=ref(db,"restaurar/videos");
const configRef=ref(db,"restaurar/config");

const FILA_KEY="restaurar_fila_visitante_v1";

let videos={};
let ordem=[];
let cards=new Map();
let players=new Map();
let ytPromise=null;
let ytPronto=false;
let dadosCarregados=false;

let config={
  titulo:"RESTAURAR",
  whatsapp:"5547999999999"
};

function youtubeID(url){
  try{
    const u=new URL(url);
    const h=u.hostname.replace(/^www\./,"");
    let id="";

    if(h==="youtu.be"){
      id=u.pathname.slice(1).split("/")[0];
    }else if([
      "youtube.com",
      "m.youtube.com",
      "youtube-nocookie.com"
    ].includes(h)){
      if(u.pathname==="/watch"){
        id=u.searchParams.get("v")||"";
      }else if(/^\/(shorts|embed|live)\//.test(u.pathname)){
        id=u.pathname.split("/")[2];
      }
    }

    return /^[\w-]{11}$/.test(id)?id:null;
  }catch(e){
    return null;
  }
}

function mensagem(msg,erro=false){
  $("mensagemADM").textContent=msg;
  $("mensagemADM").className=erro?"erro":"ok";
}

function status(msg,erro=false){
  $("estado").textContent=msg;
  $("estado").className=erro?"erro":"aviso";
  $("estado").style.display=msg?"block":"none";
}

function salvarOrdem(){
  try{
    localStorage.setItem(
      FILA_KEY,
      JSON.stringify(ordem)
    );
  }catch(e){}
}

function recuperarOrdem(){
  try{
    const valor=JSON.parse(
      localStorage.getItem(FILA_KEY)
    );
    return Array.isArray(valor)?valor:[];
  }catch(e){
    return [];
  }
}

function atualizarOrdem(){
  const chaves=Object.keys(videos).sort((a,b)=>{
    const ta=Number(videos[a].criadoEm)||0;
    const tb=Number(videos[b].criadoEm)||0;
    return tb-ta;
  });

  const conjunto=new Set(chaves);
  const anterior=ordem.length?ordem:recuperarOrdem();

  ordem=anterior.filter(k=>conjunto.has(k));

  const existentes=new Set(ordem);
  const novos=chaves.filter(k=>!existentes.has(k));

  ordem=[...novos,...ordem];
  salvarOrdem();
}

/*
  MOVER O CARD NO DOM SEM RECRIAR OS OUTROS
*/

function moverParaFinal(key){
  if(!ordem.includes(key))return;

  ordem=ordem.filter(k=>k!==key);
  ordem.push(key);

  salvarOrdem();

  const card=cards.get(key);
  if(card){
    $("gradeVideos").appendChild(card);
  }
}

/*
  API DO YOUTUBE SOMENTE SOB DEMANDA
*/

function carregarYouTube(){
  if(window.YT&&window.YT.Player){
    ytPronto=true;
    return Promise.resolve(window.YT);
  }

  if(ytPromise)return ytPromise;

  ytPromise=new Promise((resolve,reject)=>{
    const anterior=window.onYouTubeIframeAPIReady;

    let timeout=setTimeout(()=>{
      reject(new Error("Tempo excedido ao carregar YouTube"));
    },20000);

    window.onYouTubeIframeAPIReady=()=>{
      clearTimeout(timeout);
      ytPronto=true;

      if(typeof anterior==="function"){
        try{anterior()}catch(e){}
      }

      resolve(window.YT);
    };

    const script=document.createElement("script");
    script.src="https://www.youtube.com/iframe_api";
    script.async=true;

    script.onerror=()=>{
      clearTimeout(timeout);
      reject(new Error("Falha ao carregar YouTube"));
    };

    document.head.appendChild(script);
  }).catch(e=>{
    ytPromise=null;
    throw e;
  });

  return ytPromise;
}

/*
  ENCERRAR UM PLAYER ESPECÍFICO
*/

function destruirPlayer(key){
  const registro=players.get(key);
  if(!registro)return;

  players.delete(key);

  try{
    if(registro.player &&
       typeof registro.player.destroy==="function"){
      registro.player.destroy();
    }
  }catch(e){}
}

/*
  CAPA LEVE DO YOUTUBE
*/

function criarCapa(key,id,titulo){
  const botao=document.createElement("button");
  botao.type="button";
  botao.className="capa-video";
  botao.setAttribute(
    "aria-label",
    "Assistir vídeo: "+titulo
  );

  const img=document.createElement("img");

  img.src=
    "https://i.ytimg.com/vi/"+id+"/hqdefault.jpg";

  img.alt="Capa do vídeo: "+titulo;
  img.loading="lazy";
  img.decoding="async";

  const play=document.createElement("span");
  play.className="play";

  botao.append(img,play);

  botao.onclick=()=>iniciarVideo(key,id);

  return botao;
}

/*
  PLAYER CRIADO APENAS APÓS O CLIQUE
*/

async function iniciarVideo(key,id){
  const card=cards.get(key);
  if(!card)return;

  const box=card.querySelector(".video-box");
  const capa=box.querySelector(".capa-video");

  if(!capa)return;

  capa.disabled=true;

  const play=capa.querySelector(".play");
  if(play)play.style.opacity=".45";

  try{
    await carregarYouTube();

    // Verifica se o card ainda existe.
    if(cards.get(key)!==card)return;
    if(!box.isConnected)return;

    // Evita iniciar novamente.
    if(players.has(key))return;

    const suporte=document.createElement("div");
    suporte.style.width="100%";
    suporte.style.height="100%";

    capa.replaceWith(suporte);

    const registro={
      player:null,
      card:card,
      videoId:id
    };

    players.set(key,registro);

    registro.player=new YT.Player(suporte,{
      videoId:id,
      playerVars:{
        autoplay:1,
        playsinline:1,
        rel:0,
        origin:location.origin
      },
      events:{
        onReady:function(event){
          event.target.playVideo();
        },
        onStateChange:function(event){
          if(event.data===YT.PlayerState.ENDED){
            // Retira o player finalizado.
            destruirPlayer(key);

            // Recria apenas a capa deste vídeo.
            restaurarCapa(key);

            // Envia para o final da fila.
            moverParaFinal(key);
          }
        },
        onError:function(event){
          console.warn(
            "Erro no vídeo:",
            key,
            event.data
          );

          destruirPlayer(key);
          restaurarCapa(key);
        }
      }
    });

  }catch(e){
    console.error(e);

    if(capa.isConnected){
      capa.disabled=false;
      if(play)play.style.opacity="1";
    }

    alert(
      "Não foi possível carregar o vídeo. "+
      "Verifique sua conexão e tente novamente."
    );
  }
}

/*
  RESTAURAR CAPA DE UM ÚNICO VÍDEO
*/

function restaurarCapa(key){
  const card=cards.get(key);
  const video=videos[key];

  if(!card||!video)return;

  const id=youtubeID(video.link);
  if(!id)return;

  const box=card.querySelector(".video-box");

  const x=box.querySelector(".botao-x");

  box.replaceChildren();

  box.appendChild(
    criarCapa(key,id,video.titulo||"Vídeo")
  );

  if(x)box.appendChild(x);
}

/*
  CRIAR CARD
*/

function criarCard(key,video){
  const id=youtubeID(video.link);
  if(!id)return null;

  const card=document.createElement("article");
  card.className="card";
  card.dataset.key=key;

  const box=document.createElement("div");
  box.className="video-box";

  const capa=criarCapa(
    key,
    id,
    video.titulo||"Vídeo"
  );

  const fechar=document.createElement("button");
  fechar.className="botao-x";
  fechar.textContent="×";
  fechar.title="Mover vídeo para o final da lista";
  fechar.setAttribute(
    "aria-label",
    "Mover vídeo para o final"
  );

  fechar.onclick=()=>moverParaFinal(key);

  box.append(capa,fechar);

  const titulo=document.createElement("h3");
  titulo.textContent=video.titulo||"Vídeo";

  const descricao=document.createElement("p");
  descricao.textContent=video.descricao||"";

  if(!video.descricao){
    descricao.style.display="none";
  }

  card.append(box,titulo,descricao);

  return card;
}

/*
  ATUALIZAÇÃO INTELIGENTE DA GRADE
  NÃO DESTRÓI PLAYERS SEM NECESSIDADE
*/

function render(){
  atualizarOrdem();

  const area=$("gradeVideos");
  const chavesValidas=ordem.filter(key=>
    videos[key]&&youtubeID(videos[key].link)
  );

  const validas=new Set(chavesValidas);

  for(const [key,card] of cards){
    if(!validas.has(key)){
      destruirPlayer(key);
      card.remove();
      cards.delete(key);
    }
  }

  for(const key of chavesValidas){
    const video=videos[key];
    const existente=cards.get(key);

    if(!existente){
      const card=criarCard(key,video);

      if(card){
        cards.set(key,card);
      }
    }else{
      const titulo=existente.querySelector("h3");
      const descricao=existente.querySelector("p");

      titulo.textContent=video.titulo||"Vídeo";
      descricao.textContent=video.descricao||"";

      descricao.style.display=
        video.descricao?"block":"none";

      const idAtual=existente.dataset.videoId;
      const novoId=youtubeID(video.link);

      if(idAtual!==novoId){
        destruirPlayer(key);
        restaurarCapa(key);
      }
    }

    const card=cards.get(key);

    if(card){
      card.dataset.videoId=youtubeID(video.link);
      area.appendChild(card);
    }
  }

  if(!chavesValidas.length){
    status(
      dadosCarregados
      ?"Nenhum vídeo cadastrado."
      :"Carregando vídeos..."
    );
  }else{
    status("");
  }

  listarADM();
}

/*
  CONFIGURAÇÕES
*/

function configurar(){
  $("tituloSite").textContent=
    config.titulo||"RESTAURAR";

  $("whatsapp").href=
    "https://wa.me/"+
    String(
      config.whatsapp||"5547999999999"
    ).replace(/\D/g,"");

  $("nomeSite").value=
    config.titulo||"RESTAURAR";

  $("numeroWhats").value=
    config.whatsapp||"";
}

/*
  LISTA DO ADMINISTRADOR
*/

function listarADM(){
  const area=$("listaADM");
  area.replaceChildren();

  if(!auth.currentUser)return;

  const entradas=Object.entries(videos)
    .sort((a,b)=>
      (Number(b[1].criadoEm)||0)-
      (Number(a[1].criadoEm)||0)
    );

  const fragmento=document.createDocumentFragment();

  for(const [key,v] of entradas){
    const div=document.createElement("div");
    div.className="linha";

    const span=document.createElement("span");
    span.textContent=v.titulo||"Vídeo";

    const btn=document.createElement("button");
    btn.className="excluir";
    btn.textContent="EXCLUIR";

    btn.onclick=async()=>{
      if(!confirm(
        "Excluir este vídeo do Firebase?"
      ))return;

      try{
        btn.disabled=true;

        await remove(
          ref(db,"restaurar/videos/"+key)
        );

        mensagem(
          "Vídeo excluído do Firebase."
        );

      }catch(e){
        btn.disabled=false;

        mensagem(
          "Erro ao excluir: "+e.message,
          true
        );
      }
    };

    div.append(span,btn);
    fragmento.appendChild(div);
  }

  area.appendChild(fragmento);
}

/*
  ADMINISTRADOR
*/

$("abrirADM").onclick=()=>{
  $("modal").classList.add("aberto");
};

$("fecharADM").onclick=()=>{
  $("modal").classList.remove("aberto");
};

$("modal").addEventListener("click",e=>{
  if(e.target===$("modal")){
    $("modal").classList.remove("aberto");
  }
});

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    $("modal").classList.remove("aberto");
  }
});

$("entrar").onclick=async()=>{
  const email=$("email").value.trim();
  const senha=$("senha").value;

  $("erro").textContent="";

  try{
    await signInWithEmailAndPassword(
      auth,email,senha
    );
  }catch(e){
    $("erro").textContent=
      "Não foi possível entrar: "+e.code;
  }
};

$("sair").onclick=()=>signOut(auth);

onAuthStateChanged(auth,user=>{
  $("login").style.display=
    user?"none":"block";

  $("conteudoADM").style.display=
    user?"block":"none";

  $("usuarioAtual").textContent=
    user?"Conectado: "+user.email:"";

  if(user){
    configurar();
    listarADM();
  }
});

/*
  SALVAR CONFIGURAÇÕES
*/

$("salvarConfig").onclick=async()=>{
  const titulo=
    $("nomeSite").value.trim()||"RESTAURAR";

  const whatsapp=
    $("numeroWhats").value.replace(/\D/g,"");

  try{
    await update(configRef,{
      titulo,
      whatsapp
    });

    mensagem(
      "Configurações salvas no Firebase."
    );
  }catch(e){
    mensagem(
      "Erro ao salvar: "+e.message,
      true
    );
  }
};

/*
  CADASTRAR VÍDEO
*/

$("adicionarVideo").onclick=async()=>{
  const titulo=$("videoTitulo").value.trim();
  const link=$("videoLink").value.trim();
  const descricao=$("videoDescricao").value.trim();

  if(!titulo||!youtubeID(link)){
    mensagem(
      "Informe título e link válido do YouTube.",
      true
    );
    return;
  }

  const btn=$("adicionarVideo");
  btn.disabled=true;

  mensagem("Salvando no Firebase...");

  try{
    await set(push(videosRef),{
      titulo,
      link,
      descricao,
      criadoEm:Date.now()
    });

    $("videoTitulo").value="";
    $("videoLink").value="";
    $("videoDescricao").value="";

    mensagem(
      "Vídeo salvo no Firebase com sucesso!"
    );

  }catch(e){
    mensagem(
      "Erro ao salvar: "+e.message,
      true
    );
  }finally{
    btn.disabled=false;
  }
};

/*
  RECEBER VÍDEOS DO FIREBASE
*/

onValue(videosRef,s=>{
  videos=s.val()||{};
  dadosCarregados=true;
  render();

},e=>{
  status(
    "Não foi possível carregar vídeos: "+
    e.message,
    true
  );
});

/*
  RECEBER CONFIGURAÇÕES
*/

onValue(configRef,s=>{
  config={
    titulo:"RESTAURAR",
    whatsapp:"5547999999999",
    ...(s.val()||{})
  };

  configurar();

},e=>{
  console.error(
    "Erro ao carregar configurações:",
    e
  );
});

</script>
</body>
</html>
