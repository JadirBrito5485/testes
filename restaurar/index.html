<style>
:root {
  --bg: #000;

  --border: #333;
  --text: #fff;
  --muted: #aaa;
  --accent: #39d49c;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.7 Arial, sans-serif;
}

button, input, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .4; cursor: not-allowed; }

main {
  max-width: 980px;
  margin: auto;
  padding: 25px 15px;
}

section { margin: 0 0 65px; }

h2 {
  text-align: center;
  font-size: clamp(26px, 4vw, 38px);
}

h3 { font-size: clamp(21px, 3vw, 30px); }
p { color: var(--muted); }
.hidden { display: none !important; }

.btn {
  background: #222;
  border: 1px solid #555;
  color: #fff;
  padding: 10px 16px;
  border-radius: 9px;
}

.primary {
  background: var(--accent);
  color: #001b10;

}

.empty {
  text-align: center;
  padding: 40px;
  color: #888;
}

/* VÍDEOS */
.video-title {
  text-align: center;
  font-size: clamp(24px, 4vw, 39px);
  line-height: 1.25;
  margin: 20px 0;
}

.carousel { position: relative; }

.player {
  width: 100%;
  aspect-ratio: 16/9;
  position: relative;
  background: #111;
  border-radius: 13px;
  overflow: hidden;
}

.player img, .player iframe {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border: 0;
}

.play {
  position: absolute;
  inset: 0;
  border: 0;
  background: transparent;
  color: #fff;
  font-size: 65px;
  text-shadow: 0 3px 18px #000;
}

.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  z-index: 3;
  background: #000b;
  border: 1px solid #777;
  color: #fff;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  font-size: 25px;
}

.prev { left: 8px; }
.next { right: 8px; }

.counter {
  text-align: center;
  color: #888;
  font-size: 13px;
  margin: 12px;
}

/* TESTEMUNHOS */
.testimony {
  display: block;
  width: 100%;
  height: min(70vh, 610px);
  object-fit: contain;
  background: #101010;
  border-radius: 12px;
  cursor: zoom-in;
  transition: opacity .25s;
}

.testimony:hover { opacity: .94; }

/* IMAGEM AMPLIADA */
.testimony-zoom {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,.96);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 15px;
  cursor: zoom-out;
}

.testimony-zoom img {
  max-width: 96vw;
  max-height: 94vh;
  width: auto;
  height: auto;
  object-fit: contain;
  cursor: zoom-out;
}

.zoom-hint {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  background: #222b;
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 12px;
  pointer-events: none;
}

/* CANAL WHATSAPP */
.channel {
  display: block;
  max-width: 800px;
  margin: 25px auto;
}

.channel img {
  display: block;
  width: 100%;
  max-height: 500px;

.channel-description { text-align: center; }

/* ESTUDOS */
.studies {

.study {

.social {

/* ADM */

input, textarea {

textarea { min-height: 95px; }

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getDatabase,ref,onValue,set,push,remove} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

/* FIREBASE */
const firebaseConfig={
  apiKey:"AIzaSyAWs1MDxOQYjqZ5LlzC4IlXscyDs-N9xfM",
  authDomain:"namoro-f18ac.firebaseapp.com",
  databaseURL:"https://namoro-f18ac-default-rtdb.firebaseio.com",
  projectId:"namoro-f18ac",

  messagingSenderId:"336479537433",
  appId:"1:336479537433:web:dd282c67e98ca196e05d88",
  measurementId:"G-1YLR1JNZYY"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const auth=getAuth(app);
const BASE="restaurar";
const $=id=>document.getElementById(id);

const defaults={
  videosHeading:"Vídeos do YouTube",
  testimoniesHeading:"Testemunhos",
  channelHeading:"Canal do WhatsApp",
  channelText:"Clique na imagem para acessar nosso canal.",
  channelUrl:"",
  channelImageUrl:"",
  studiesHeading:"Estudos bíblicos",
  footerText:"Jadir Brito",
  youtubeUrl:"",
  tiktokUrl:"",
  whatsappNumber:"",
  whatsappMessage:"Olá! Gostaria de receber atendimento.",
  chatLabel:"FALE COM O PROFETA"
};

let data={
  settings:{...defaults},
  videos:{},
  testimonies:{},
  studies:{}
};

let videoIndex=0;
let testimonyIndex=0;
let testimonyTimer=null;
const TESTIMONY_INTERVAL=60000;

let currentTab="settings";
let editingId=null;
let editor=null;
let formDirty=false;
let saving=false;

const fieldDefinitions=[
  ["videosHeading","Título da seção de vídeos"],
  ["testimoniesHeading","Título dos testemunhos"],
  ["channelHeading","Título do canal"],
  ["channelText","Texto do canal"],
  ["channelUrl","Link do canal do WhatsApp"],

  ["studiesHeading","Título dos estudos"],
  ["footerText","Texto do rodapé"],
  ["youtubeUrl","Link do YouTube"],
  ["tiktokUrl","Link do TikTok"],
  ["whatsappNumber","Número WhatsApp (55 + DDD + número)"],
  ["whatsappMessage","Mensagem inicial do atendimento"],
  ["chatLabel","Texto do WhatsApp flutuante"]
];

function escapeHTML(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function isHttps(value){
  try{return new URL(value).protocol==="https:"}
  catch{return false}
}

function allowedHost(value,hosts){
  try{
    const u=new URL(value);
    return u.protocol==="https:"&&hosts.some(h=>
      u.hostname===h||u.hostname.endsWith("."+h)
    );
  }catch{return false}
}

function validChannel(value){
  try{
    const u=new URL(value);
    return u.protocol==="https:"&&
      ["whatsapp.com","www.whatsapp.com"].includes(u.hostname)&&
      u.pathname.startsWith("/channel/");
  }catch{return false}
}

function youtubeId(value){
  try{
    const u=new URL(value);
    const h=u.hostname.replace(/^www\./,"");
    let id=null;
    if(h==="youtu.be")id=u.pathname.split("/")[1];
    else if(["youtube.com","m.youtube.com","youtube-nocookie.com"].includes(h)){
      id=u.searchParams.get("v");
      if(!id&&/^\/(shorts|live|embed)\//.test(u.pathname))
        id=u.pathname.split("/")[2];
    }
    return /^[a-zA-Z0-9_-]{11}$/.test(id||"")?id:null;
  }catch{return null}
}

function cleanHTML(html){
  const doc=new DOMParser().parseFromString(html||"","text/html");
  const allowed=new Set([
    "P","BR","H1","H2","H3","H4","B","STRONG","I","EM","U","S",
    "UL","OL","LI","A","IMG","BLOCKQUOTE","DIV","SPAN","PRE","CODE"
  ]);

  for(const el of [...doc.body.querySelectorAll("*")].reverse()){
    if(!allowed.has(el.tagName)){el.remove();continue}
    for(const attr of [...el.attributes]){
      const n=attr.name,v=attr.value;
      const ok=
        (n==="href"&&el.tagName==="A"&&isHttps(v))||
        (n==="src"&&el.tagName==="IMG"&&isHttps(v))||
        (n==="class"&&/^ql-(align-(center|right|justify)|indent-[1-8]|size-(small|large|huge))$/.test(v));
      if(!ok)el.removeAttribute(n);
    }
    if(el.tagName==="A")el.setAttribute("rel","noopener noreferrer");
  }
  return doc.body.innerHTML;
}

function sorted(type){
  return Object.entries(data[type]||{})
    .filter(([,v])=>v&&typeof v==="object")
    .map(([id,v])=>({id,...v}))
    .sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0));
}

function showStatus(message,type=""){
  $("status").textContent=message;
  $("status").className="status "+type;
}

function firebaseError(error){
  const code=error?.code||"";
  if(code.includes("permission-denied"))
    return "Permissão negada. Verifique as regras do Firebase e o UID do administrador.";
  if(code.includes("network"))
    return "Erro de conexão. Verifique sua internet.";
  return error?.message||"Erro desconhecido.";
}

async function saveToFirebase(path,value){
  if(!auth.currentUser){
    showStatus("Faça login para salvar.","error");
    return false;
  }
  if(saving)return false;
  saving=true;
  showStatus("Salvando no Firebase...");
  try{
    await set(ref(db,path),value);
    showStatus("Alterações salvas com sucesso!","ok");
    formDirty=false;
    return true;
  }catch(error){
    showStatus(firebaseError(error),"error");
    return false;
  }finally{
    saving=false;
  }
}

/* VÍDEOS — SEM EXPANSÃO AUTOMÁTICA */
function renderVideo(){
  const arr=sorted("videos");
  videoIndex=arr.length?(videoIndex+arr.length)%arr.length:0;
  const v=arr[videoIndex],stage=$("videoStage");
  stage.replaceChildren();
  $("videoTitle").textContent=v?.title||"";
  $("videoCount").textContent=arr.length?`${videoIndex+1} de ${arr.length}`:"";
  $("videoPrev").disabled=$("videoNext").disabled=arr.length<2;

  const id=v?youtubeId(v.url):null;
  if(!id){
    stage.innerHTML='<div class="empty">Nenhum vídeo cadastrado.</div>';
    return;
  }

  const img=document.createElement("img");
  img.src=`https://img.youtube.com/vi/${id}/hqdefault.jpg`;
  img.alt=v.title||"Vídeo";

  const play=document.createElement("button");
  play.className="play";
  play.textContent="▶";
  play.setAttribute("aria-label","Assistir vídeo");

  play.onclick=()=>{
    const frame=document.createElement("iframe");
    frame.src=`https://www.youtube-nocookie.com/embed/${id}?autoplay=1`;
    frame.title=v.title||"Vídeo";
    frame.allow="autoplay; encrypted-media; picture-in-picture";
    stage.replaceChildren(frame);
  };
  stage.append(img,play);
}

/* TESTEMUNHOS — SLIDE AUTOMÁTICO A CADA 60 SEGUNDOS */
function renderTestimony(){
  const arr=sorted("testimonies");
  testimonyIndex=arr.length?(testimonyIndex+arr.length)%arr.length:0;
  const v=arr[testimonyIndex];

  $("testimonyCount").textContent=arr.length
    ?`${testimonyIndex+1} de ${arr.length}`:"";

  $("testimonyPrev").disabled=$("testimonyNext").disabled=arr.length<2;

  const stage=$("testimonyStage");
  stage.replaceChildren();

  if(v&&isHttps(v.url)){
    const img=document.createElement("img");
    img.src=v.url;
    img.className="testimony";
    img.alt=v.title||"Testemunho";
    img.loading="lazy";
    img.title="Clique para ampliar";
    img.onclick=()=>openTestimonyZoom(v.url,v.title);
    stage.append(img);
  }else{
    stage.innerHTML='<div class="empty">Nenhum testemunho cadastrado.</div>';
  }
}

function startTestimonySlide(){
  clearInterval(testimonyTimer);
  testimonyTimer=null;
  if(sorted("testimonies").length<2)return;

  testimonyTimer=setInterval(()=>{
    if(document.hidden||!$("testimonyZoom").classList.contains("hidden"))return;
    testimonyIndex++;
    renderTestimony();
  },TESTIMONY_INTERVAL);
}

function changeTestimony(direction){
  testimonyIndex+=direction;
  renderTestimony();
  startTestimonySlide();
}

/* AMPLIAR E REDUZIR IMAGEM */
function openTestimonyZoom(url,title){
  if(!isHttps(url))return;
  $("zoomImage").src=url;
  $("zoomImage").alt=title||"Testemunho ampliado";
  $("testimonyZoom").classList.remove("hidden");
  $("testimonyZoom").focus();
}

function closeTestimonyZoom(){
  $("testimonyZoom").classList.add("hidden");
  $("zoomImage").removeAttribute("src");
  startTestimonySlide();
}

$("testimonyZoom").onclick=closeTestimonyZoom;

document.addEventListener("keydown",event=>{
  if(event.key==="Escape"&&!$("testimonyZoom").classList.contains("hidden")){
    closeTestimonyZoom();
  }
});

/* CONFIGURAÇÕES */
function renderSettings(){
  const t={...defaults,...data.settings};
  for(const k of [
    "videosHeading","testimoniesHeading","channelHeading",
    "channelText","studiesHeading","footerText","chatLabel"
  ])$(k).textContent=t[k]||"";

  const valid=validChannel(t.channelUrl)&&isHttps(t.channelImageUrl);
  $("channelLink").classList.toggle("hidden",!valid);
  if(valid){
    $("channelLink").href=t.channelUrl;
    $("channelImage").src=t.channelImageUrl;
  }else{
    $("channelLink").removeAttribute("href");
    $("channelImage").removeAttribute("src");
  }

  for(const [id,key,hosts] of [
    ["youtubeSocial","youtubeUrl",["youtube.com","youtu.be"]],
    ["tiktokSocial","tiktokUrl",["tiktok.com"]]
  ]){
    const el=$(id),ok=allowedHost(t[key],hosts);
    el.classList.toggle("hidden",!ok);
    if(ok)el.href=t[key];
    else el.removeAttribute("href");
  }

  const phone=String(t.whatsappNumber||"").replace(/\D/g,"");
  $("chat").classList.toggle("hidden",phone.length<10);
  if(phone.length>=10){
    $("chat").href=`https://wa.me/${phone}?text=${encodeURIComponent(t.whatsappMessage||"Olá!")}`;
  }else $("chat").removeAttribute("href");
}

/* ESTUDOS */
function renderStudies(){
  const arr=sorted("studies");
  $("studiesGrid").innerHTML=arr.length?arr.map(v=>`
    <article class="study">
      ${isHttps(v.image)?`<img src="${escapeHTML(v.image)}" alt="${escapeHTML(v.title)}" loading="lazy">`:""}
      <div class="study-body">
        <h3>${escapeHTML(v.title)}</h3>
        <p>${escapeHTML(v.summary||"")}</p>
        <button class="btn primary" data-read="${escapeHTML(v.id)}">Ler estudo</button>
      </div>
    </article>
  `).join(""):'<div class="empty">Nenhum estudo cadastrado.</div>';
}

/* FIREBASE — ATUALIZAÇÕES EM TEMPO REAL */
for(const type of ["settings","videos","testimonies","studies"]){
  onValue(ref(db,`${BASE}/${type}`),snapshot=>{
    data[type]=snapshot.val()||(type==="settings"?{...defaults}:{});
    if(type==="settings")renderSettings();
    if(type==="videos")renderVideo();
    if(type==="testimonies"){
      renderTestimony();
      startTestimonySlide();
    }
    if(type==="studies")renderStudies();
  },error=>{
    showStatus("Erro Firebase: "+firebaseError(error),"error");
  });
}

/* SETAS */
$("videoPrev").onclick=()=>{videoIndex--;renderVideo()};
$("videoNext").onclick=()=>{videoIndex++;renderVideo()};
$("testimonyPrev").onclick=()=>changeTestimony(-1);
$("testimonyNext").onclick=()=>changeTestimony(1);

/* ABRIR ESTUDOS */
$("studiesGrid").onclick=e=>{
  const b=e.target.closest("[data-read]");
  if(!b)return;
  const v=data.studies?.[b.dataset.read];
  if(!v)return;
  $("articleTitle").textContent=v.title;
  $("articleContent").innerHTML=
    (isHttps(v.image)?`<img src="${escapeHTML(v.image)}" alt="">`:"")+
    cleanHTML(v.html);
  $("articleOverlay").classList.remove("hidden");
};
$("closeArticle").onclick=()=>$("articleOverlay").classList.add("hidden");

/* LOGIN */
$("openAdmin").onclick=()=>$("adminOverlay").classList.remove("hidden");
$("closeAdmin").onclick=()=>$("adminOverlay").classList.add("hidden");

$("loginButton").onclick=async()=>{
  const email=$("loginEmail").value.trim();
  const password=$("loginPassword").value;
  if(!email||!password)return showStatus("Informe e-mail e senha.","error");
  try{
    showStatus("Autenticando...");
    await signInWithEmailAndPassword(auth,email,password);
    $("loginPassword").value="";
    showStatus("Login realizado.","ok");
  }catch{
    showStatus("Erro de login. Confira sua conta Firebase.","error");
  }
};

$("logoutButton").onclick=()=>signOut(auth);

onAuthStateChanged(auth,user=>{
  $("loginPanel").classList.toggle("hidden",!!user);
  $("adminPanel").classList.toggle("hidden",!user);
  if(user){
    $("adminEmail").textContent=user.email||"Administrador";
    renderTab();
  }else{
    editingId=null;
    formDirty=false;
  }
});

/* ABAS */
$("tabs").onclick=e=>{
  const b=e.target.closest("[data-tab]");
  if(!b)return;
  if(formDirty&&!confirm("Descartar alterações não salvas?"))return;
  currentTab=b.dataset.tab;
  editingId=null;
  formDirty=false;
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("active",x===b));
  renderTab();
};

function field(id,label,value="",multi=false){
  return `<div class="field"><label for="${id}">${escapeHTML(label)}</label>
    ${multi?`<textarea id="${id}">${escapeHTML(value)}</textarea>`:
    `<input id="${id}" value="${escapeHTML(value)}">`}
  </div>`;
}

function trackChanges(){
  $("tabPanel").addEventListener("input",()=>{formDirty=true},{once:true});
}

/* ADMINISTRAÇÃO COMPLETA */
function renderTab(){
  if(!auth.currentUser)return;
  editor=null;
  formDirty=false;
  const panel=$("tabPanel");

  if(currentTab==="settings"){
    panel.innerHTML=`
      ${fieldDefinitions.map(([k,l])=>field(
        "cfg_"+k,l,data.settings?.[k]??defaults[k],
        ["channelText","whatsappMessage"].includes(k)
      )).join("")}
      <button class="btn primary" id="saveSettings">Salvar todas as alterações</button>
    `;
    trackChanges();

    $("saveSettings").onclick=async()=>{
      const next={};
      for(const [k] of fieldDefinitions)next[k]=$("cfg_"+k).value.trim();

      if(next.channelUrl&&!validChannel(next.channelUrl))
        return showStatus("Link do canal inválido. Use whatsapp.com/channel/...","error");
      if(next.channelImageUrl&&!isHttps(next.channelImageUrl))
        return showStatus("Imagem precisa de link HTTPS.","error");
      if(next.youtubeUrl&&!allowedHost(next.youtubeUrl,["youtube.com","youtu.be"]))
        return showStatus("Link YouTube inválido.","error");
      if(next.tiktokUrl&&!allowedHost(next.tiktokUrl,["tiktok.com"]))
        return showStatus("Link TikTok inválido.","error");

      if(await saveToFirebase(`${BASE}/settings`,next)){
        data.settings=next;
        renderSettings();
      }
    };
    return;
  }

  const arr=sorted(currentTab);
  const record=editingId?data[currentTab]?.[editingId]:null;
  const isStudy=currentTab==="studies";
  const isVideo=currentTab==="videos";

  panel.innerHTML=`
    <h3>${editingId?"Editar":"Cadastrar"} conteúdo</h3>
    ${field("itemTitle","Título",record?.title)}
    ${field("itemUrl",isVideo?"Link do vídeo YouTube":"Link da imagem",isStudy?record?.image:record?.url)}
    ${isStudy?field("itemSummary","Resumo do estudo",record?.summary,true):""}
    ${field("itemOrder","Ordem de exibição",record?.order??arr.length)}
    ${isStudy?'<div class="field"><label>Texto completo do estudo</label><div id="editor"></div></div>':""}
    <div class="actions">
      <button class="btn primary" id="saveItem">Salvar conteúdo</button>
      <button class="btn" id="newItem">Novo cadastro</button>
    </div>
    <h3>Conteúdos cadastrados</h3>
    <div id="itemList">
      ${arr.length?arr.map(x=>`
        <div class="item">
          <strong>${escapeHTML(x.title)}</strong>
          <div class="actions">
            <button class="btn" data-edit="${escapeHTML(x.id)}">Editar</button>
            <button class="btn" data-delete="${escapeHTML(x.id)}">Excluir</button>
          </div>
        </div>`).join(""):"<p>Nenhum conteúdo cadastrado.</p>"}
    </div>
  `;
  trackChanges();

  if(isStudy){
    if(typeof Quill==="undefined"){
      showStatus("Editor indisponível.","error");
      $("saveItem").disabled=true;
    }else{
      editor=new Quill("#editor",{
        theme:"snow",
        modules:{toolbar:[
          [{header:[1,2,3,false]}],
          [{size:["small",false,"large","huge"]}],
          ["bold","italic","underline","strike"],
          [{color:[]},{background:[]}],
          [{align:[]}],
          [{list:"ordered"},{list:"bullet"}],
          ["blockquote","link","image"],["clean"]
        ]}
      });
      editor.clipboard.dangerouslyPasteHTML(cleanHTML(record?.html||""));
      editor.on("text-change",()=>{formDirty=true});
    }
  }

  $("newItem").onclick=()=>{
    if(formDirty&&!confirm("Descartar alterações não salvas?"))return;
    editingId=null;renderTab();
  };

  $("saveItem").onclick=async()=>{
    const title=$("itemTitle").value.trim();
    const url=$("itemUrl").value.trim();
    const order=Number($("itemOrder").value)||0;
    if(!title)return showStatus("Informe o título.","error");
    if(isVideo&&!youtubeId(url))return showStatus("Link YouTube inválido.","error");
    if(!isVideo&&url&&!isHttps(url))return showStatus("Link de imagem inválido.","error");

    const next={title,order,...(isStudy?{
      image:url,
      summary:$("itemSummary").value.trim(),
      html:cleanHTML(editor?.root.innerHTML||"")
    }:{url})};

    const target=editingId
      ?ref(db,`${BASE}/${currentTab}/${editingId}`)
      :push(ref(db,`${BASE}/${currentTab}`));

    if(await saveToFirebase(`${BASE}/${currentTab}/${target.key}`,next)){
      editingId=null;
      renderTab();
    }
  };

  $("itemList").onclick=async e=>{
    const b=e.target.closest("button");
    if(!b)return;

    if(b.dataset.edit){
      if(formDirty&&!confirm("Descartar alterações não salvas?"))return;
      editingId=b.dataset.edit;
      renderTab();
    }

    if(b.dataset.delete&&confirm("Excluir este conteúdo?")){
      try{
        showStatus("Excluindo...");
        await remove(ref(db,`${BASE}/${currentTab}/${b.dataset.delete}`));
        showStatus("Conteúdo excluído.","ok");
        editingId=null;
        renderTab();
      }catch(error){
        showStatus(firebaseError(error),"error");
      }
    }
  };
}
</script>
</body>
</html>
