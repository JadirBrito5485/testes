<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#fff7ed,#fdf2f8,#eff6ff);color:#2b1b12}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.wrap{max-width:1150px;margin:auto;width:94%}.top{background:#fff;border-bottom:1px solid #eadfd5;position:sticky;top:0;z-index:10}.topin{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0}.brand{font-size:22px;font-weight:900;color:#7c2d12}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{background:#7c2d12;color:#fff;padding:10px 14px;border-radius:12px;font-weight:800}.btn2{background:#fff;color:#7c2d12;border:1px solid #eadfd5}.red{background:#b91c1c}.green{background:#15803d}.gold{background:#b45309}.hero{padding:35px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:rgba(255,255,255,.94);border:1px solid #eadfd5;border-radius:22px;padding:20px;box-shadow:0 14px 35px #0001}.card h1{font-size:42px;line-height:1.05;margin:0 0 12px}.muted{color:#7c6a5f}.tabs{display:flex;background:#f5e9df;padding:5px;border-radius:14px;margin-bottom:12px}.tabs button{flex:1;background:transparent;padding:10px;border-radius:11px;font-weight:900;color:#7c6a5f}.tabs .active{background:#fff;color:#7c2d12}.form{display:grid;gap:9px}label{font-weight:800;font-size:14px;margin-top:6px}input,select,textarea{width:100%;padding:11px;border-radius:12px;border:1px solid #e7d7ca;background:#fff}textarea{min-height:90px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.app{padding:22px 0 60px}.profile{display:grid;grid-template-columns:230px 1fr;gap:18px}.avatar{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:24px;background:#eee;border:4px solid #fff}.album{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:12px}.album img,.pick img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;border:2px solid #fff}.pick{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.pick img.sel{border:4px solid #15803d}.pill{display:inline-block;background:#ffedd5;color:#7c2d12;font-weight:800;border-radius:999px;padding:7px 10px;margin:3px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.person{background:#fff;border:1px solid #eadfd5;border-radius:20px;overflow:hidden;box-shadow:0 10px 25px #0001}.person img{width:100%;aspect-ratio:1/1;object-fit:cover}.person div{padding:12px}.person h3{margin:0 0 5px}.chat{display:grid;grid-template-columns:280px 1fr;gap:14px}.chatUser{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #eadfd5;border-radius:14px;padding:9px;margin-bottom:8px}.chatUser img{width:45px;height:45px;border-radius:50%;object-fit:cover}.msgs{height:400px;overflow:auto;background:#fff;border:1px solid #eadfd5;border-radius:18px;padding:12px}.msg{display:flex;gap:8px;align-items:flex-start;max-width:80%;background:#f5e9df;margin:8px 0;padding:9px;border-radius:14px}.msg.me{margin-left:auto;background:#dcfce7}.msg img{width:34px;height:34px;border-radius:50%;object-fit:cover}.adminA{position:fixed;right:10px;bottom:5px;color:rgba(0,0,0,.10);font-weight:900;text-decoration:none;z-index:20}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:50}.box{width:min(1050px,96vw);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:18px}.x{float:right;background:#eee;color:#111;width:35px;height:35px;border-radius:10px;font-weight:900}.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid #eee;padding:9px;text-align:left;font-size:13px}.dot{display:inline-block;width:11px;height:11px;background:red;border-radius:50%}.footer{text-align:center;color:#8a7a70;padding:25px}@media(max-width:850px){.grid,.profile,.chat{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.album,.pick{grid-template-columns:repeat(4,1fr)}.card h1{font-size:32px}.topin{display:block}.nav{margin-top:10px}}@media(max-width:500px){.cards{grid-template-columns:1fr}.album,.pick{grid-template-columns:repeat(3,1fr)}}

<body>
<header id="topBar" class="top hidden"><div class="wrap topin"><div class="brand" id="brand">Relacionamento Cristão</div><div class="nav"><button class="btn btn2" onclick="showPage('perfil')">Perfil</button><button class="btn btn2" onclick="showPage('conexoes')">Conexões</button><button class="btn btn2" onclick="showPage('chat')">Chat <span id="notify"></span></button><button class="btn btn2" onclick="openEdit()">Editar Perfil</button><button class="btn red" onclick="logout()">Sair</button></div></div></header>
<main id="authPage" class="hero"><div class="wrap grid"><section class="card"><h1 id="homeTitle">Relacionamento Cristão</h1><p id="homeText" class="muted">Encontre pessoas cristãs com propósito, fé e respeito.</p><button class="btn gold" onclick="tab('cadastro')">Criar cadastro</button></section><section class="card"><div class="tabs"><button id="tLogin" class="active" onclick="tab('login')">Login</button><button id="tCadastro" onclick="tab('cadastro')">Cadastro</button></div><div id="loginBox" class="form"><label>Email</label><input id="loginEmail" type="email"><label>Senha</label><input id="loginSenha" type="password"><button class="btn" onclick="loginUser()">Entrar</button></div><div id="cadastroBox" class="form hidden"><div class="grid2"><div><label>Nome *</label><input id="nome"></div><div><label>Sobrenome *</label><input id="sobrenome"></div></div><div class="grid2"><div><label>Data de nascimento *</label><input id="nascimento" type="date"></div><div><label>CPF *</label><input id="cpf"></div></div><div class="grid2"><div><label>Gênero *</label><select id="genero"><option value="">Selecione</option><option>Homem</option><option>Mulher</option></select></div><div><label>Whatsapp *</label><input id="whatsapp"></div></div><div class="grid2"><div><label>Email *</label><input id="email" type="email"></div><div><label>Senha *</label><input id="senha" type="password"></div></div><div class="grid2"><div><label>Cidade</label><input id="cidade"></div><div><label>Estado</label><input id="estado" value="SC"></div></div><div class="grid2"><div><label>Religião</label><input id="religiao" value="Cristã"></div><div><label>Denominação</label><input id="denominacao"></div></div><div class="grid2"><div><label>Estado civil</label><select id="estadoCivil"><option>Solteiro(a)</option><option>Viúvo(a)</option><option>Divorciado(a)</option></select></div><div><label>Há quanto tempo?</label><input id="tempoEstadoCivil"></div></div><label>Número de filhos e idade deles</label><input id="filhos"><label>7 fotos *</label><input id="fotos" type="file" multiple accept="image/*" onchange="previewFotos()"><div id="previewBox" class="pick"></div><label>Quem sou eu</label><textarea id="about"></textarea><div id="perguntasCadastro"></div><button class="btn green" onclick="registerUser()">Finalizar cadastro</button></div></section></div></main>
<main id="appPage" class="app hidden"><div class="wrap"><section id="perfil" class="page"></section><section id="conexoes" class="page hidden"></section><section id="chat" class="page hidden"></section></div></main>

<script>
const firebaseConfig={apiKey:'AIzaSyAWs1MDxOQYjqZ5LlzC4IlXscyDs-N9xfM',authDomain:'namoro-f18ac.firebaseapp.com',databaseURL:'https://namoro-f18ac-default-rtdb.firebaseio.com',projectId:'namoro-f18ac',storageBucket:'namoro-f18ac.firebasestorage.app',messagingSenderId:'336479537433',appId:'1:336479537433:web:dd282c67e98ca196e05d88',measurementId:'G-1YLR1JNZYY'};
firebase.initializeApp(firebaseConfig);const fbAuth=firebase.auth(),db=firebase.database(),storage=firebase.storage();
let me=null,uid=null,users={},files=[],perfilEscolhido=0,chatWith=null,config={};const ADM='848218';
let perguntas=['Batizado em águas há quanto tempo?','Qual o horário que você costuma orar no dia?','Lê a Bíblia diariamente?','Jejua durante a semana?','Qual a sua religião?','Frequenta a igreja quantas vezes na semana?','Está afastado(a) da igreja há quanto tempo?','Exerce algum cargo na igreja e qual?','Que tipo de música ouve?'];
function esc(v){return String(v||'').replace(/[&<>'"]/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[a]))}
function idade(d){if(!d)return'';let n=new Date(),b=new Date(d),a=n.getFullYear()-b.getFullYear();if(n.getMonth()<b.getMonth()||(n.getMonth()==b.getMonth()&&n.getDate()<b.getDate()))a--;return a}
function avatar(nome,g){let c=g==='Homem'?'#2563eb':'#db2777',ini=nome.split(' ').map(x=>x[0]).join('').slice(0,2);let svg='<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500"><rect width="500" height="500" rx="60" fill="'+c+'"/><circle cx="250" cy="180" r="85" fill="white" opacity=".9"/><path d="M90 440c35-130 285-130 320 0" fill="white" opacity=".9"/><text x="250" y="285" font-family="Arial" font-size="62" font-weight="900" text-anchor="middle" fill="#2b1b12">'+ini+'</text></svg>';return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function fake(nome,g,i){let foto=avatar(nome,g);let qs={};perguntas.forEach(p=>qs[p]='Resposta cristã sobre '+p.toLowerCase());return{fake:true,nome:nome.split(' ')[0],sobrenome:nome.split(' ').slice(1).join(' '),nomeCompleto:nome,genero:g,nascimento:(1982+i%18)+'-0'+((i%9)+1)+'-15',idade:25+i%18,cpf:'000.000.000-00',whatsapp:'4799999'+(1000+i),email:nome.toLowerCase().replaceAll(' ','.')+'@fake.com',cidade:['Rio Negrinho','São Bento do Sul','Joinville','Mafra'][i%4],estado:'SC',religiao:'Cristã',denominacao:['Batista','Assembleia de Deus','Presbiteriana','Quadrangular'][i%4],estadoCivil:['Solteiro(a)','Divorciado(a)','Viúvo(a)'][i%3],tempoEstadoCivil:'',filhos:i%5===0?'1 filho':'Não tenho filhos',about:'Sou uma pessoa cristã, sincera, de família, gosto de conversar e busco uma relação com respeito e propósito.',questions:qs,photos:[foto,foto,foto,foto,foto,foto,foto],profilePhoto:foto,createdAt:Date.now()-i*10000}}
async function init(){try{let c=await db.ref('config').get();config=c.val()||{};if(config.perguntas)perguntas=config.perguntas;applyText();renderPerguntas();await seed();fbAuth.onAuthStateChanged(async u=>{if(u){uid=u.uid;await loadAll();openApp()}else openAuth()})}catch(e){document.body.innerHTML='<div style="padding:30px;font-family:Arial"><h2>Erro ao carregar</h2><p>'+e.message+'</p></div>'}}
function applyText(){brand.textContent=config.brand||'Relacionamento Cristão';homeTitle.textContent=config.homeTitle||'Relacionamento Cristão';homeText.textContent=config.homeText||'Encontre pessoas cristãs com propósito, fé e respeito.';footer.textContent=config.footer||'Relacionamento Cristão'}
function renderPerguntas(){perguntasCadastro.innerHTML=perguntas.map((p,i)=>'<label>'+esc(p)+'</label><textarea id="q'+i+'"></textarea>').join('')}
async function seed(){let s=await db.ref('seed30').get();if(s.exists())return;let homens=['Lucas Almeida','Rafael Santos','Mateus Oliveira','Gabriel Souza','Daniel Pereira','Felipe Martins','André Costa','Tiago Rodrigues','Samuel Lima','Bruno Ferreira','Marcos Ribeiro','João Henrique','Pedro Carvalho','Davi Fernandes','Elias Moreira'];let mulheres=['Ana Clara','Mariana Silva','Juliana Costa','Camila Rodrigues','Larissa Almeida','Fernanda Lima','Patrícia Souza','Débora Martins','Isabela Ribeiro','Priscila Oliveira','Aline Ferreira','Natália Santos','Beatriz Carvalho','Renata Pereira','Sara Moreira'];let up={seed30:true};homens.forEach((n,i)=>up['users/fakeH'+i]=fake(n,'Homem',i));mulheres.forEach((n,i)=>up['users/fakeM'+i]=fake(n,'Mulher',i+20));await db.ref().update(up)}
function tab(t){tLogin.classList.toggle('active',t==='login');tCadastro.classList.toggle('active',t==='cadastro');loginBox.classList.toggle('hidden',t!=='login');cadastroBox.classList.toggle('hidden',t!=='cadastro')}
function previewFotos(){files=[...fotos.files].slice(0,7);perfilEscolhido=0;previewBox.innerHTML='';files.forEach((f,i)=>{let img=document.createElement('img');img.src=URL.createObjectURL(f);img.onclick=()=>{perfilEscolhido=i;document.querySelectorAll('#previewBox img').forEach(x=>x.classList.remove('sel'));img.classList.add('sel')};if(i===0)img.classList.add('sel');previewBox.appendChild(img)})}
async function uploadFotos(id){let arr=[];for(let i=0;i<files.length;i++){let r=storage.ref('usuarios/'+id+'/'+Date.now()+'_'+i);await r.put(files[i]);arr.push(await r.getDownloadURL())}return arr}
async function registerUser(){let obrig=[nome,sobrenome,nascimento,cpf,genero,whatsapp,email,senha];for(let el of obrig){if(!el.value.trim())return alert('Preencha todos os campos obrigatórios.')}if(files.length!==7)return alert('Envie exatamente 7 fotos.');try{let cr=await fbAuth.createUserWithEmailAndPassword(email.value.trim(),senha.value);let urls=await uploadFotos(cr.user.uid);let qs={};perguntas.forEach((p,i)=>qs[p]=(document.getElementById('q'+i).value||'').trim());let data={nome:nome.value,sobrenome:sobrenome.value,nomeCompleto:nome.value+' '+sobrenome.value,nascimento:nascimento.value,idade:idade(nascimento.value),cpf:cpf.value,genero:genero.value,whatsapp:whatsapp.value,email:email.value,cidade:cidade.value,estado:estado.value,religiao:religiao.value,denominacao:denominacao.value,estadoCivil:estadoCivil.value,tempoEstadoCivil:tempoEstadoCivil.value,filhos:filhos.value,about:about.value,questions:qs,photos:urls,profilePhoto:urls[perfilEscolhido]||urls[0],createdAt:Date.now(),blocked:{}};await db.ref('users/'+cr.user.uid).set(data);await db.ref('adminBackup/'+cr.user.uid).set(data);alert('Cadastro feito com sucesso!')}catch(e){alert('Erro: '+e.message)}}
async function loginUser(){try{await fbAuth.signInWithEmailAndPassword(loginEmail.value.trim(),loginSenha.value)}catch(e){alert('Erro no login: '+e.message)}}
function logout(){fbAuth.signOut()}async function loadAll(){users=(await db.ref('users').get()).val()||{};me=users[uid]||{}}
function openAuth(){authPage.classList.remove('hidden');appPage.classList.add('hidden');topBar.classList.add('hidden')}function openApp(){authPage.classList.add('hidden');appPage.classList.remove('hidden');topBar.classList.remove('hidden');renderPerfil();renderConexoes();renderChat();watchNotify();showPage('perfil')}
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
function renderPerfil(u=me,id=uid){let own=id===uid;let privado=own?'<h2>Meus dados privados</h2><div class="card grid2"><div><b>CPF</b><br>'+esc(u.cpf)+'</div><div><b>Whatsapp</b><br>'+esc(u.whatsapp)+'</div><div><b>Email</b><br>'+esc(u.email)+'</div><div><b>Filhos</b><br>'+esc(u.filhos)+'</div></div>':'';let perguntasHtml=own?Object.entries(u.questions||{}).map(([k,v])=>'<div><b>'+esc(k)+'</b><br><span class="muted">'+esc(v)+'</span></div>').join(''):'<div><b>Perfil público</b><br><span class="muted">Visitantes veem somente nome, idade, fotos, cidade, estado e religião.</span></div>';let html='<div class="card profile"><div><img class="avatar" src="'+esc(u.profilePhoto)+'"><div class="album">'+(u.photos||[]).map(f=>'<img src="'+esc(f)+'">').join('')+'</div></div><div><h2>Perfil</h2><h1>'+esc(u.nomeCompleto)+'</h1><span class="pill">'+esc(u.idade||idade(u.nascimento))+' anos</span><span class="pill">'+esc(u.religiao)+'</span><span class="pill">'+esc(u.cidade)+' - '+esc(u.estado)+'</span><p>'+esc(u.about)+'</p>'+(own?'<button class="btn" onclick="openEdit()">Editar Perfil</button> <button class="btn red" onclick="deleteAccount()">Excluir conta</button>':'<button class="btn" onclick="startChat(\''+id+'\')">Enviar mensagem</button> <button class="btn red" onclick="reportUser(\''+id+'\')">Banir/Bloquear</button>')+'</div></div><h2>Quem sou eu</h2><div class="card">'+esc(u.about)+'</div><h2>Dados públicos</h2><div class="card grid2"><div><b>Nome completo</b><br>'+esc(u.nomeCompleto)+'</div><div><b>Idade</b><br>'+esc(u.idade||idade(u.nascimento))+'</div><div><b>Cidade</b><br>'+esc(u.cidade)+'</div><div><b>Estado</b><br>'+esc(u.estado)+'</div><div><b>Religião</b><br>'+esc(u.religiao)+'</div></div>'+privado+'<h2>Perguntas</h2><div class="card grid2">'+perguntasHtml+'</div>';if(own)perfil.innerHTML=html;else{modalContent.innerHTML=html;modal.classList.remove('hidden')}};
function palavras(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>3)}
function score(u){let total=0,hit=0;['religiao','denominacao','estadoCivil'].forEach(f=>{total++;if(String(me[f]||'').toLowerCase()===String(u[f]||'').toLowerCase())hit++});Object.keys(me.questions||{}).forEach(q=>{total++;let a=palavras(me.questions[q]),b=palavras((u.questions||{})[q]);if(a.length&&b.length&&a.filter(x=>b.includes(x)).length>0)hit++});if(u.fake)hit=Math.max(hit,Math.ceil(total*.60));return total?Math.round(hit/total*100):0}
function listaConexoes(){let alvo=me.genero==='Homem'?'Mulher':'Homem';return Object.entries(users).filter(([id,u])=>id!==uid&&u.genero===alvo&&!(me.blocked&&me.blocked[id])&&score(u)>=50).sort((a,b)=>score(b[1])-score(a[1]))}
function renderConexoes(){let arr=listaConexoes();conexoes.innerHTML='<h2>Conexões</h2><div class="cards">'+arr.map(([id,u])=>'<div class="person"><img src="'+esc(u.profilePhoto)+'"><div><h3>'+esc(u.nomeCompleto)+'</h3><p class="muted">'+esc(u.idade||idade(u.nascimento))+' anos • '+esc(u.religiao)+'</p><p class="muted">Conexão '+score(u)+'%</p><button class="btn btn2" onclick="renderPerfil(users[\''+id+'\'],\''+id+'\')">Visitar perfil</button></div></div>').join('')+'</div>'}
function cid(a,b){return [a,b].sort().join('_')}function startChat(id){chatWith=id;closeModal();showPage('chat');renderChat();loadMsgs()}
function renderChat(){let contatos=Object.entries(users).filter(([id])=>id!==uid);chat.innerHTML='<h2>Chat</h2><div class="chat"><div>'+contatos.map(([id,u])=>'<div class="chatUser" onclick="startChat(\''+id+'\')"><img src="'+esc(u.profilePhoto)+'"><div><b>'+esc(u.nomeCompleto)+'</b><br><span class="muted">'+esc(u.religiao)+'</span></div></div>').join('')+'</div><div><div class="card"><b>'+(chatWith&&users[chatWith]?esc(users[chatWith].nomeCompleto):'Escolha uma conversa')+'</b></div><div id="msgs" class="msgs"></div><div class="grid2" style="margin-top:10px"><input id="msgText" placeholder="Digite sua mensagem"><button class="btn" onclick="sendMsg()">Enviar</button></div></div></div>';if(chatWith)loadMsgs()}
function loadMsgs(){if(!chatWith)return;db.ref('chats/'+cid(uid,chatWith)).off();db.ref('chats/'+cid(uid,chatWith)).on('value',s=>{let m=s.val()||{};let area=document.getElementById('msgs');if(!area)return;area.innerHTML=Object.values(m).sort((a,b)=>a.time-b.time).map(x=>{let u=users[x.from]||me;return '<div class="msg '+(x.from===uid?'me':'')+'"><img src="'+esc(u.profilePhoto)+'"><div><b>'+(x.from===uid?'Você':esc(u.nome))+'</b><br>'+esc(x.text)+'</div></div>'}).join('');area.scrollTop=area.scrollHeight})}
async function sendMsg(){let input=document.getElementById('msgText');if(!input||!input.value.trim()||!chatWith)return;await db.ref('chats/'+cid(uid,chatWith)).push({from:uid,to:chatWith,text:input.value.trim(),time:Date.now()});await db.ref('notifications/'+chatWith).push({from:uid,time:Date.now()});input.value=''}
function watchNotify(){db.ref('notifications/'+uid).on('value',s=>{notify.innerHTML=s.exists()?'<span class="dot"></span>':''})}
async function reportUser(id){let motivo=prompt('Digite o motivo para bloquear/banir:');if(!motivo)return;await db.ref('users/'+uid+'/blocked/'+id).set(true);await db.ref('reports').push({from:uid,against:id,fromName:me.nomeCompleto,againstName:users[id].nomeCompleto,motivo,time:Date.now()});alert('Bloqueado e enviado ao ADM.');await loadAll();renderConexoes();closeModal()}
function openEdit(){modalContent.innerHTML='<h2>Editar Perfil</h2><label>Cidade</label><input id="edCidade" value="'+esc(me.cidade)+'"><label>Estado</label><input id="edEstado" value="'+esc(me.estado)+'"><label>Religião</label><input id="edRel" value="'+esc(me.religiao)+'"><label>Quem sou eu</label><textarea id="edAbout">'+esc(me.about)+'</textarea><button class="btn green" onclick="saveEdit()">Salvar alterações</button> <button class="btn btn2" onclick="closeModal()">Sair sem salvar</button>';modal.classList.remove('hidden')}
async function saveEdit(){await db.ref('users/'+uid).update({cidade:edCidade.value,estado:edEstado.value,religiao:edRel.value,about:edAbout.value});await db.ref('adminBackup/'+uid).update({cidade:edCidade.value,estado:edEstado.value,religiao:edRel.value,about:edAbout.value});closeModal();await loadAll();openApp()}
async function deleteAccount(){let s=prompt('Digite sua senha para excluir a conta:');if(!s)return;try{let u=fbAuth.currentUser;await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,s));await db.ref('deletedUsers/'+uid).set({...me,deletedAt:Date.now()});await db.ref('users/'+uid).remove();await u.delete();alert('Conta excluída. Dados preservados no ADM.')}catch(e){alert(e.message)}}
function adminLogin(){let p=prompt('Senha ADM:');if(p===ADM)openAdmin();else if(p)alert('Senha errada')}
async function openAdmin(){await loadAll();modalContent.innerHTML='<h2>Painel ADM</h2><div class="nav"><button class="btn btn2" onclick="admTexts()">Textos</button><button class="btn btn2" onclick="admQuestions()">Perguntas</button><button class="btn btn2" onclick="admUsers()">Usuários/Fakes</button><button class="btn btn2" onclick="admReports()">Banimentos</button><button class="btn green" onclick="downloadTxt()">Baixar TXT Google</button></div><div id="admBody" style="margin-top:15px"></div>';modal.classList.remove('hidden');admUsers()}
function admTexts(){admBody.innerHTML='<label>Nome do site</label><input id="aBrand" value="'+esc(config.brand||'Relacionamento Cristão')+'"><label>Título inicial</label><input id="aTitle" value="'+esc(config.homeTitle||'Relacionamento Cristão')+'"><label>Texto inicial</label><textarea id="aText">'+esc(config.homeText||'')+'</textarea><label>Rodapé</label><input id="aFoot" value="'+esc(config.footer||'Relacionamento Cristão')+'"><button class="btn green" onclick="saveTexts()">Salvar</button>'}
async function saveTexts(){await db.ref('config').update({brand:aBrand.value,homeTitle:aTitle.value,homeText:aText.value,footer:aFoot.value});config=(await db.ref('config').get()).val()||{};applyText();alert('Salvo')}
function admQuestions(){admBody.innerHTML='<h3>Perguntas do cadastro</h3><div id="qAdm">'+perguntas.map(p=>'<div class="grid2"><input value="'+esc(p)+'"><button class="btn red" onclick="this.parentElement.remove()">Excluir</button></div>').join('')+'</div><button class="btn btn2" onclick="addPerguntaAdm()">Adicionar</button> <button class="btn green" onclick="saveQuestions()">Salvar</button>'}
function addPerguntaAdm(){let d=document.createElement('div');d.className='grid2';d.innerHTML='<input placeholder="Nova pergunta"><button class="btn red" onclick="this.parentElement.remove()">Excluir</button>';qAdm.appendChild(d)}
async function saveQuestions(){perguntas=[...qAdm.querySelectorAll('input')].map(i=>i.value.trim()).filter(Boolean);await db.ref('config/perguntas').set(perguntas);renderPerguntas();alert('Perguntas salvas')}
function admUsers(){admBody.innerHTML='<h3>Usuários e perfis fake</h3><table class="table"><tr><th>Foto</th><th>Nome</th><th>Gênero</th><th>Email</th><th>Ações</th></tr>'+Object.entries(users).map(([id,u])=>'<tr><td><img src="'+esc(u.profilePhoto)+'" width="42" height="42" style="border-radius:50%;object-fit:cover"></td><td>'+esc(u.nomeCompleto)+'</td><td>'+esc(u.genero)+'</td><td>'+esc(u.email)+'</td><td><button class="btn btn2" onclick="editAdm(\''+id+'\')">Editar</button> <button class="btn red" onclick="delAdm(\''+id+'\')">Excluir</button></td></tr>').join('')+'</table>'}
function editAdm(id){let u=users[id];admBody.innerHTML='<h3>Editar usuário</h3><label>Nome completo</label><input id="euNome" value="'+esc(u.nomeCompleto)+'"><label>Idade</label><input id="euIdade" value="'+esc(u.idade)+'"><label>Gênero</label><select id="euGen"><option '+(u.genero==='Homem'?'selected':'')+'>Homem</option><option '+(u.genero==='Mulher'?'selected':'')+'>Mulher</option></select><label>Religião</label><input id="euRel" value="'+esc(u.religiao)+'"><label>Cidade</label><input id="euCid" value="'+esc(u.cidade)+'"><label>Foto principal URL</label><input id="euFoto" value="'+esc(u.profilePhoto)+'"><label>Quem sou eu</label><textarea id="euAbout">'+esc(u.about)+'</textarea><button class="btn green" onclick="saveAdm(\''+id+'\')">Salvar</button> <button class="btn btn2" onclick="admUsers()">Voltar</button>'}
async function saveAdm(id){await db.ref('users/'+id).update({nomeCompleto:euNome.value,idade:euIdade.value,genero:euGen.value,religiao:euRel.value,cidade:euCid.value,profilePhoto:euFoto.value,about:euAbout.value});await loadAll();admUsers()}
async function delAdm(id){if(confirm('Excluir?')){await db.ref('users/'+id).remove();await loadAll();admUsers()}}
async function admReports(){let r=(await db.ref('reports').get()).val()||{};admBody.innerHTML='<h3>Banimentos</h3><table class="table"><tr><th>Usuário</th><th>Denunciado</th><th>Motivo</th></tr>'+Object.values(r).map(x=>'<tr><td>'+esc(x.fromName)+'</td><td>'+esc(x.againstName)+'</td><td>'+esc(x.motivo)+'</td></tr>').join('')+'</table>'}
async function downloadTxt(){let u=(await db.ref('adminBackup').get()).val()||{};let linhas=['Name,Family Name,E-mail 1 - Value,Phone 1 - Value,Notes'];Object.values(u).forEach(x=>linhas.push('"'+(x.nome||'')+'","'+(x.sobrenome||'')+'","'+(x.email||'')+'","'+(x.whatsapp||'')+'","CPF '+(x.cpf||'')+' | '+(x.cidade||'')+' | '+(x.religiao||'')+'"'));let blob=new Blob([linhas.join('\n')],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='usuarios_google.txt';a.click()}
function closeModal(){modal.classList.add('hidden');modalContent.innerHTML=''}
document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('keydown',e=>{if(e.key==='F12'||(e.ctrlKey&&e.key.toLowerCase()==='u'))e.preventDefault()});init();
</script>
</body>
</html>
