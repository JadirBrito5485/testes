
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Jadir Brito | Estudos Bíblicos</title>

<style>
:root {
  --fundo:#ffffff;
  --texto:#172033;
  --secundario:#667085;
  --cartao:#ffffff;
  --borda:#e5e7eb;
  --destaque:#20365f;
}

* {
  box-sizing:border-box;
}

html {
  scroll-behavior:smooth;
}

body {
  margin:0;
  background:var(--fundo);
  color:var(--texto);
  font-family:Arial,sans-serif;
  line-height:1.65;
}

body.escuro {
  --fundo:#111418;
  --texto:#f5f5f5;
  --secundario:#b7c0cc;
  --cartao:#1b2027;
  --borda:#333b46;
  --destaque:#89b5f5;
}

header {
  background:var(--cartao);
  border-bottom:1px solid var(--borda);
  padding:23px 15px;
  text-align:center;
}

header h1 {
  font-size:30px;
  letter-spacing:2px;
  margin:0;
  font-weight:800;
}

header p {
  color:var(--secundario);
  margin:8px 0 0;
  font-size:15px;
}

main {
  width:min(1160px,94%);
  margin:auto;
  min-height:70vh;
}

.apresentacao {
  text-align:center;
  padding:48px 0 28px;
}

.apresentacao h2 {
  font-size:clamp(30px,5vw,48px);
  line-height:1.2;
  margin:0 0 15px;
  font-family:Georgia,serif;
}

.apresentacao p {
  max-width:750px;
  margin:auto;
  color:var(--secundario);
  font-size:17px;
}

.grade {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:22px;
  padding:20px 0 65px;
}

.card {
  background:var(--cartao);
  border:1px solid var(--borda);
  border-radius:13px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  min-width:0;
  transition:transform .2s,box-shadow .2s;
}

.card:hover {
  transform:translateY(-3px);
  box-shadow:0 10px 25px #00000015;
}

.card img {
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  display:block;
}

.card-corpo {
  padding:20px;
  display:flex;
  flex-direction:column;
  flex:1;
}

.card h3 {
  font-family:Georgia,serif;
  font-size:22px;
  line-height:1.3;
  margin:0 0 12px;
}

.card p {
  color:var(--secundario);
  font-size:15px;
  line-height:1.7;
  flex:1;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.botao {
  display:inline-block;
  background:#20365f;
  color:#ffffff;
  border:0;
  border-radius:7px;
  padding:11px 17px;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  text-decoration:none;
  text-align:center;
}

.botao:hover {
  background:#304d80;
}

.aviso {
  color:var(--secundario);
  text-align:center;
  padding:20px;
}

.artigo {
  display:none;
  max-width:850px;
  margin:35px auto 75px;
}

.artigo h1 {
  font-family:Georgia,serif;
  font-size:clamp(30px,5vw,48px);
  line-height:1.18;
  margin:22px 0;
}

.artigo-imagem {
  display:block;
  width:100%;
  max-height:520px;
  object-fit:contain;
  margin:25px auto;
  border-radius:9px;
}

.artigo-texto {
  font-family:Georgia,serif;
  font-size:19px;
  line-height:1.85;
  overflow-wrap:anywhere;
}

.artigo-texto p {
  margin:0 0 24px;
  white-space:pre-wrap;
}

.artigo-texto h2 {
  font-size:28px;
  line-height:1.3;
  margin:35px 0 16px;
}

.artigo-texto img {
  max-width:100%;
  height:auto;
}

.voltar {
  background:transparent;
  color:var(--destaque);
  border:0;
  padding:10px 0;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

footer {
  border-top:1px solid var(--borda);
  text-align:center;
  padding:30px 15px;
  color:var(--secundario);
  font-size:14px;
}

.tema {
  position:fixed;
  top:15px;
  right:15px;
  z-index:50;
  width:43px;
  height:43px;
  border:1px solid var(--borda);
  border-radius:50%;
  background:var(--cartao);
  color:var(--texto);
  cursor:pointer;
  font-size:21px;
}

@media(max-width:900px) {
  .grade {
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:600px) {
  header h1 {
    font-size:24px;
  }

  .apresentacao {
    padding:35px 0 20px;
  }

  .grade {
    grid-template-columns:1fr;
    gap:16px;
  }

  .card h3 {
    font-size:20px;
  }

  .artigo {
    margin:22px auto 55px;
  }

  .artigo-texto {
    font-size:17px;
    line-height:1.75;
  }

  .artigo-texto h2 {
    font-size:24px;
  }
}
</style>
</head>

<body>

<button class="tema" id="botaoTema"
        onclick="alternarTema()"
        aria-label="Alternar tema">
  ☾
</button>

<header>
  <h1>JADIR BRITO</h1>
  <p>Estudos Bíblicos e Conhecimento da Palavra de Deus</p>
</header>

<main>

<section id="paginaInicial">

  <div class="apresentacao">
    <h2>Estudos Bíblicos</h2>
    <p>
      Conheça a Palavra de Deus por meio de estudos
      com explicações, referências bíblicas e
      ensinamentos para a vida cristã.
    </p>
  </div>

  <p id="estado" class="aviso">
    Carregando estudos...
  </p>

  <div id="gradeEstudos" class="grade"></div>

</section>

<article id="paginaArtigo" class="artigo">

  <button class="voltar" onclick="voltarEstudos()">
    ← VOLTAR AOS ESTUDOS
  </button>

  <h1 id="artigoTitulo"></h1>

  <div id="artigoConteudo"></div>

  <button class="botao"
          onclick="voltarEstudos()"
          style="margin-top:30px">
    VER OUTROS ESTUDOS
  </button>

</article>

</main>

<footer>
  © JADIR BRITO — Estudos Bíblicos
</footer>

<script>
function alternarTema() {
  const escuro=document.body.classList.toggle("escuro");

  localStorage.setItem(
    "jadir_tema",
    escuro?"escuro":"claro"
  );

  document.getElementById("botaoTema").textContent=
    escuro?"☀":"☾";
}

if(localStorage.getItem("jadir_tema")==="escuro") {
  document.body.classList.add("escuro");
}

document.addEventListener("DOMContentLoaded",()=>{
  document.getElementById("botaoTema").textContent=
    document.body.classList.contains("escuro")?"☀":"☾";
});
</script>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {getDatabase,ref,onValue}
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyAWs1MDxOQYjqZ5LlzC4IlXscyDs-N9xfM",
  authDomain:"namoro-f18ac.firebaseapp.com",
  databaseURL:"https://namoro-f18ac-default-rtdb.firebaseio.com",
  projectId:"namoro-f18ac",
  storageBucket:"namoro-f18ac.firebasestorage.app",
  messagingSenderId:"336479537433",
  appId:"1:336479537433:web:dd282c67e98ca196e05d88",
  measurementId:"G-1YLR1JNZYY"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const $=id=>document.getElementById(id);

const estudosRef=ref(db,"restaurar/estudos");
const ordemRef=ref(db,"restaurar/ordemEstudos");

let estudos={};
let ordem=[];
let carregado=false;
let estudoAberto=null;

function titulo(e) {
  return e.titulo||"Estudo bíblico";
}

function capa(e) {
  return e.capa||e.imagem||"";
}

function resumo(e) {
  return e.resumo||e.descricao||"";
}

function conteudo(e) {
  return e.texto||e.conteudo||"";
}

function imagens(e) {
  if(Array.isArray(e.imagens)) {
    return e.imagens;
  }

  if(typeof e.imagens==="string") {
    return e.imagens.split("\n")
      .map(x=>x.trim())
      .filter(Boolean);
  }

  return [];
}

function urlValida(url) {
  try {
    const u=new URL(url);
    return ["https:","http:"].includes(u.protocol);
  } catch {
    return false;
  }
}

function obterOrdem() {
  const ids=Object.keys(estudos).sort((a,b)=>
    (Number(estudos[b].criadoEm)||0)-
    (Number(estudos[a].criadoEm)||0)
  );

  const validos=new Set(ids);
  const vistos=new Set();
  const resultado=[];

  if(Array.isArray(ordem)) {
    for(const id of ordem) {
      if(validos.has(id)&&!vistos.has(id)) {
        resultado.push(id);
        vistos.add(id);
      }
    }
  }

  for(const id of ids) {
    if(!vistos.has(id))resultado.push(id);
  }

  return resultado;
}

function renderizar() {
  if(!carregado)return;

  const grade=$("gradeEstudos");
  grade.replaceChildren();

  const lista=obterOrdem();

  $("estado").textContent=
    lista.length?"":"Nenhum estudo cadastrado.";

  for(const id of lista) {
    const e=estudos[id];
    if(!e)continue;

    const card=document.createElement("article");
    card.className="card";

    const imagem=capa(e);

    if(imagem&&urlValida(imagem)) {
      const img=document.createElement("img");
      img.src=imagem;
      img.alt=titulo(e);
      img.loading="lazy";
      card.appendChild(img);
    }

    const corpo=document.createElement("div");
    corpo.className="card-corpo";

    const h3=document.createElement("h3");
    h3.textContent=titulo(e);

    const p=document.createElement("p");
    p.textContent=resumo(e);

    const botao=document.createElement("button");
    botao.className="botao";
    botao.textContent="LER ESTUDO COMPLETO";
    botao.onclick=()=>abrirEstudo(id);

    corpo.append(h3,p,botao);
    card.appendChild(corpo);
    grade.appendChild(card);
  }

  const parametro=new URLSearchParams(
    window.location.search
  ).get("estudo");

  if(parametro&&estudos[parametro]) {
    mostrarEstudo(parametro);
  }
}

function adicionarImagem(area,url,alt) {
  if(!urlValida(url))return;

  const img=document.createElement("img");
  img.src=url;
  img.alt=alt;
  img.className="artigo-imagem";
  img.loading="lazy";

  area.appendChild(img);
}

function adicionarTexto(area,texto) {
  const div=document.createElement("div");
  div.className="artigo-texto";

  const partes=String(texto||"").split(/\n\s*\n/);

  for(const parte of partes) {
    if(!parte.trim())continue;

    const p=document.createElement("p");
    p.textContent=parte.trim();

    div.appendChild(p);
  }

  area.appendChild(div);
}

function mostrarEstudo(id) {
  const e=estudos[id];
  if(!e)return;

  estudoAberto=id;

  $("paginaInicial").style.display="none";
  $("paginaArtigo").style.display="block";

  $("artigoTitulo").textContent=titulo(e);

  const area=$("artigoConteudo");
  area.replaceChildren();

  adicionarImagem(area,capa(e),titulo(e));
  adicionarTexto(area,conteudo(e));

  for(const url of imagens(e)) {
    adicionarImagem(area,url,titulo(e));
  }

  document.title=titulo(e)+" | Jadir Brito";
  window.scrollTo(0,0);
}

function abrirEstudo(id) {
  const url=new URL(window.location.href);
  url.searchParams.set("estudo",id);

  history.pushState({estudo:id},"",url);

  mostrarEstudo(id);
}

function voltarEstudos() {
  estudoAberto=null;

  const url=new URL(window.location.href);
  url.searchParams.delete("estudo");

  history.pushState({},"",url);

  $("paginaArtigo").style.display="none";
  $("paginaInicial").style.display="block";

  document.title="Jadir Brito | Estudos Bíblicos";
  window.scrollTo(0,0);
}

window.voltarEstudos=voltarEstudos;

window.addEventListener("popstate",()=>{
  const id=new URLSearchParams(
    window.location.search
  ).get("estudo");

  if(id&&estudos[id]) {
    mostrarEstudo(id);
  } else {
    estudoAberto=null;

    $("paginaArtigo").style.display="none";
    $("paginaInicial").style.display="block";

    document.title="Jadir Brito | Estudos Bíblicos";
  }
});

onValue(estudosRef,snapshot=>{
  estudos=snapshot.val()||{};
  carregado=true;
  renderizar();
},erro=>{
  $("estado").textContent=
    "Não foi possível carregar os estudos: "+erro.message;
});

onValue(ordemRef,snapshot=>{
  ordem=snapshot.val()||[];
  renderizar();
},erro=>{
  console.warn("Não foi possível carregar a ordem:",erro);
  ordem=[];
  renderizar();
});

</script>

</body>
</html>
