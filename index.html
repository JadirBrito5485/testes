<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fala Brito | Rio Negrinho</title>
    
    <!-- Meta tags para prévia nas Redes Sociais -->
    <meta property="og:title" content="Portal de Notícias - Jadir Brito">
    <meta property="og:description" content="Informação e opinião direto de Rio Negrinho.">
    <meta property="og:image" id="og-image-meta" content="https://via.placeholder.com/1200x630">
    <meta property="og:type" content="website">

    <style>
        :root { --bg: #ffffff; --text: #000000; --accent: #eeeeee; }
        body { font-family: 'Helvetica', Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        
        /* Layout */
        header { border-bottom: 4px solid #000; padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; background: #fff; position: sticky; top: 0; z-index: 100; }
        #logo-display { max-height: 70px; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }

        /* Estilo Blogger */
        .post { border-bottom: 2px solid #000; padding: 50px 0; display: flex; flex-direction: column; }
        .post-date { font-size: 0.75rem; font-weight: bold; margin-bottom: 10px; }
        .post-title { font-size: 2.5rem; margin: 0 0 15px 0; line-height: 1.1; letter-spacing: -1px; }
        .post-content img, .post-content video { width: 100%; border: 1px solid #000; margin: 20px 0; }
        .post-desc { font-size: 1.15rem; line-height: 1.7; }
        .post-author { margin-top: 25px; font-size: 0.9rem; font-weight: bold; text-decoration: underline; }

        /* Painel ADM Blindado */
        #admin-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 1000; padding: 40px; overflow-y: auto; }
        .adm-box { max-width: 500px; margin: auto; border: 5px solid #000; padding: 30px; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #000; font-size: 1rem; }
        button { background: #000; color: #fff; border: none; padding: 15px; cursor: pointer; font-weight: bold; width: 100%; }

        /* Rodapé */
        footer { background: #000; color: #fff; text-align: center; padding: 80px 20px; position: relative; }
        .adm-trigger { position: absolute; right: 20px; bottom: 20px; font-size: 10px; color: #222; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <img id="logo-display" src="https://via.placeholder.com/200x80?text=LOGO" alt="Logo">
</header>

<div class="container" id="feed-postagens">
    <!-- Postagens descem conforme novas entram -->
</div>

<div id="admin-panel">
    <div class="adm-box">
        <h2 style="text-align:center">PAINEL ADM</h2>
        <input type="text" id="adm-logo-url" placeholder="URL da Logo (Topo do Site)">
        <hr>
        <input type="text" id="post-titulo" placeholder="Título da Postagem">
        <textarea id="post-descricao" rows="5" placeholder="Texto da Matéria"></textarea>
        <input type="text" id="post-media-url" placeholder="URL da Imagem ou Vídeo (.mp4)">
        <button onclick="publicar()">PUBLICAR AGORA</button>
        <button onclick="fecharPainel()" style="background:#555; margin-top:10px;">SAIR</button>
    </div>
</div>

<footer>
    <p>© Todos os direitos reservados Jadir Brito 2026</p>
    <span class="adm-trigger" onclick="entrarPainel()">adm</span>
</footer>

<script>
    const CODIGO_ACESSO = "84821821";
    let db = JSON.parse(localStorage.getItem('fala_brito_v3')) || {
        logo: "https://via.placeholder.com/200x80?text=LOGO",
        posts: []
    };

    function atualizarFeed() {
        const feed = document.getElementById('feed-postagens');
        document.getElementById('logo-display').src = db.logo;
        feed.innerHTML = '';

        // Estilo Blogger: As mais recentes em cima
        [...db.posts].reverse().forEach(post => {
            const isVideo = post.media.includes('.mp4');
            const mediaHtml = post.media ? (isVideo ? `<video controls src="${post.media}"></video>` : `<img src="${post.media}">`) : '';
            
            feed.innerHTML += `
                <div class="post">
                    <div class="post-date">${post.data}</div>
                    <h2 class="post-title">${post.titulo}</h2>
                    <div class="post-content">
                        ${mediaHtml}
                        <div class="post-desc">${post.descricao.replace(/\n/g, '<br>')}</div>
                    </div>
                    <div class="post-author">Postado por Jadir Brito</div>
                </div>
            `;
        });
        localStorage.setItem('fala_brito_v3', JSON.stringify(db));
    }

    function entrarPainel() {
        if (prompt("Código de Segurança:") === CODIGO_ACESSO) {
            document.getElementById('admin-panel').style.display = 'block';
        }
    }

    function fecharPainel() { document.getElementById('admin-panel').style.display = 'none'; }

    function publicar() {
        const t = document.getElementById('post-titulo').value;
        const d = document.getElementById('post-descricao').value;
        const m = document.getElementById('post-media-url').value;
        const l = document.getElementById('adm-logo-url').value;

        if (l) db.logo = l;
        if (t && d) {
            db.posts.push({ titulo: t, descricao: d, media: m, data: new Date().toLocaleString('pt-BR') });
            atualizarFeed();
            fecharPainel();
        }
    }

    atualizarFeed();
</script>

</body>
</html>
