<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relacionamento Cristão</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f4f0ea;color:#2b2b2b}
header{background:linear-gradient(135deg,#6b3fa0,#c48bff);color:white;padding:25px;text-align:center}
.container{max-width:1200px;margin:auto;padding:20px}
.card{background:white;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 8px 25px #0002}
input,select,textarea,button{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #ccc;font-size:15px}
textarea{min-height:75px}
button{background:#6b3fa0;color:white;font-weight:bold;border:none;cursor:pointer}
button:hover{opacity:.9}
.hidden{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.profile{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 18px #0002}
.profile img{width:100%;height:260px;object-fit:cover;border-radius:16px}
.nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:15px}
.badge{display:inline-block;background:#efe4ff;color:#6b3fa0;padding:6px 10px;border-radius:20px;margin:3px;font-size:13px}
.match{font-size:28px;font-weight:bold;color:#6b3fa0}
.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.photoBox img{width:100%;height:120px;object-fit:cover;border-radius:12px;border:3px solid transparent}
.photoBox input[type=radio]{width:auto}
.activePhoto{border-color:#6b3fa0!important}
.chatBox{height:300px;overflow:auto;background:#f8f5fb;padding:12px;border-radius:14px;margin-bottom:10px}
.msg{padding:10px;border-radius:12px;margin:8px 0;max-width:80%}
.me{background:#6b3fa0;color:white;margin-left:auto}
.other{background:#e8ddf7}
.notice{background:#fff3cd;color:#7a5a00;padding:10px;border-radius:10px;margin:8px 0}
.red{background:#d93025}
</style>
</head>

<body>

<header>
  <h1>❤️ Relacionamento Cristão</h1>
  <p>Conectando pessoas pela fé, propósito e valores</p>
</header>

<div class="container">

<div id="auth" class="card">
  <h2>Login ou Cadastro</h2>
  <input id="loginEmail" placeholder="E-mail">
  <input id="loginSenha" type="password" placeholder="Senha">
  <button onclick="login()">Entrar</button>
  <button onclick="abrirCadastro()">Criar Cadastro</button>
</div>

<div id="cadastro" class="card hidden">
  <h2>Cadastro Cristão</h2>

  <input id="nome" placeholder="Nome">
  <input id="sobrenome" placeholder="Sobrenome">
  <input id="nascimento" type="date">
  <input id="cpf" placeholder="CPF">
  <select id="genero">
    <option value="">Gênero</option>
    <option>Homem</option>
    <option>Mulher</option>
  </select>
  <input id="email" placeholder="E-mail">
  <input id="senha" type="password" placeholder="Senha">
  <input id="whatsapp" placeholder="WhatsApp">
  <input id="cidade" placeholder="Cidade">
  <input id="estado" placeholder="Estado">

  <select id="religiao">
    <option value="">Religião</option>
    <option>Evangélica</option>
    <option>Católica</option>
    <option>Cristã</option>
    <option>Outra</option>
  </select>

  <input id="denominacao" placeholder="Denominação">
  <input id="localCulto" placeholder="Nome da igreja / local físico onde cultua">

  <select id="estadoCivil">
    <option value="">Estado civil</option>
    <option>Solteiro(a)</option>
    <option>Viúvo(a)</option>
    <option>Divorciado(a)</option>
  </select>

  <input id="tempoEstadoCivil" placeholder="Se viúvo/divorciado, há quanto tempo?">
  <input id="filhos" type="number" placeholder="Número de filhos">

  <h3>Vida com Deus</h3>
  <input id="oraDia" placeholder="Ora quantas vezes por dia?">
  <input id="horariosOracao" placeholder="Ora em quais horários?">
  <input id="tempoOracao" placeholder="Quanto tempo de oração?">
  <input id="bibliaDia" placeholder="Lê a Bíblia quantas vezes por dia?">
  <input id="jejumSemana" placeholder="Jejua quantas vezes na semana?">
  <input id="igrejaSemana" placeholder="Frequenta a igreja quantas vezes na semana?">
  <input id="cargoIgreja" placeholder="Tem cargo na igreja? Qual?">

  <h3>Quem você busca?</h3>
  <select id="buscaGenero">
    <option value="">Busca homem ou mulher?</option>
    <option>Homem</option>
    <option>Mulher</option>
  </select>
  <input id="buscaReligiao" placeholder="Religião que busca">
  <input id="buscaDenominacao" placeholder="Denominação que busca">
  <input id="buscaEstadoCivil" placeholder="Estado civil que aceita">
  <textarea id="sobre" placeholder="Fale sobre você"></textarea>
  <textarea id="procura" placeholder="Descreva a pessoa que você procura"></textarea>

  <h3>Enviar 7 fotos</h3>
  <input id="fotos" type="file" accept="image/*" multiple onchange="carregarFotos()">
  <div id="previewFotos" class="photos"></div>

  <button onclick="salvarCadastro()">Finalizar Cadastro</button>
</div>

<div id="app" class="hidden">

  <div class="nav">
    <button onclick="mostrar('painel')">Meu Painel</button>
    <button onclick="mostrar('perfis')">Compatíveis 50%+</button>
    <button onclick="mostrar('mensagens')">Mensagens <span id="noti"></span></button>
    <button class="red" onclick="sair()">Sair</button>
  </div>

  <div id="painel" class="card">
    <h2>Meu Perfil</h2>
    <div id="meuPerfil"></div>
  </div>

  <div id="perfis" class="card hidden">
    <h2>Pessoas compatíveis com você</h2>
    <div id="listaPerfis" class="grid"></div>
  </div>

  <div id="mensagens" class="card hidden">
    <h2>Mensagens</h2>
    <div id="listaConversas"></div>
    <div id="chatAberto" class="hidden">
      <h3 id="chatTitulo"></h3>
      <div id="chatBox" class="chatBox"></div>
      <textarea id="textoMensagem" placeholder="Digite sua mensagem"></textarea>
      <button onclick="enviarResposta()">Enviar</button>
    </div>
  </div>

</div>

</div>

<script>
let usuarioAtual = localStorage.getItem("cristaoAtual");
let fotosTemp = [];
let fotoPrincipal = 0;
let conversaAtual = null;

function usuarios(){
  return JSON.parse(localStorage.getItem("usuariosCristaos")) || [];
}

function salvarUsuarios(lista){
  localStorage.setItem("usuariosCristaos", JSON.stringify(lista));
}

function mensagens(){
  return JSON.parse(localStorage.getItem("mensagensCristaos")) || [];
}

function salvarMensagens(lista){
  localStorage.setItem("mensagensCristaos", JSON.stringify(lista));
}

function abrirCadastro(){
  auth.classList.add("hidden");
  cadastro.classList.remove("hidden");
}

function calcularIdade(data){
  let nasc = new Date(data);
  let hoje = new Date();
  let idade = hoje.getFullYear() - nasc.getFullYear();
  let m = hoje.getMonth() - nasc.getMonth();
  if(m < 0 || (m === 0 && hoje.getDate() < nasc.getDate())) idade--;
  return idade;
}

function carregarFotos(){
  const arquivos = Array.from(fotos.files).slice(0,7);
  fotosTemp = [];
  previewFotos.innerHTML = "";

  arquivos.forEach((file, index)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      fotosTemp[index] = e.target.result;
      renderFotos();
    };
    reader.readAsDataURL(file);
  });
}

function renderFotos(){
  previewFotos.innerHTML = fotosTemp.map((foto,i)=>`
    <div class="photoBox">
      <img src="${foto}" class="${i===fotoPrincipal?'activePhoto':''}">
      <label>
        <input type="radio" name="principal" ${i===fotoPrincipal?'checked':''} onclick="fotoPrincipal=${i};renderFotos()">
        Foto principal
      </label>
    </div>
  `).join("");
}

function salvarCadastro(){
  if(fotosTemp.length < 1){
    alert("Envie pelo menos 1 foto.");
    return;
  }

  let idade = calcularIdade(nascimento.value);
  if(!idade || idade < 18){
    alert("Cadastro permitido somente para maiores de 18 anos.");
    return;
  }

  let lista = usuarios();

  if(lista.find(u=>u.email === email.value)){
    alert("Esse e-mail já existe.");
    return;
  }

  let novo = {
    id:Date.now(),
    nome:nome.value,
    sobrenome:sobrenome.value,
    nascimento:nascimento.value,
    idade,
    cpf:cpf.value,
    genero:genero.value,
    email:email.value,
    senha:senha.value,
    whatsapp:whatsapp.value,
    cidade:cidade.value,
    estado:estado.value,
    religiao:religiao.value,
    denominacao:denominacao.value,
    localCulto:localCulto.value,
    estadoCivil:estadoCivil.value,
    tempoEstadoCivil:tempoEstadoCivil.value,
    filhos:filhos.value,
    oraDia:oraDia.value,
    horariosOracao:horariosOracao.value,
    tempoOracao:tempoOracao.value,
    bibliaDia:bibliaDia.value,
    jejumSemana:jejumSemana.value,
    igrejaSemana:igrejaSemana.value,
    cargoIgreja:cargoIgreja.value,
    buscaGenero:buscaGenero.value,
    buscaReligiao:buscaReligiao.value,
    buscaDenominacao:buscaDenominacao.value,
    buscaEstadoCivil:buscaEstadoCivil.value,
    sobre:sobre.value,
    procura:procura.value,
    fotos:fotosTemp,
    fotoPrincipal
  };

  lista.push(novo);
  salvarUsuarios(lista);
  localStorage.setItem("cristaoAtual", novo.email);
  usuarioAtual = novo.email;
  abrirApp();
}

function login(){
  let lista = usuarios();
  let user = lista.find(u=>u.email === loginEmail.value && u.senha === loginSenha.value);

  if(!user){
    alert("Login ou senha incorretos.");
    return;
  }

  localStorage.setItem("cristaoAtual", user.email);
  usuarioAtual = user.email;
  abrirApp();
}

function abrirApp(){
  if(!usuarioAtual) return;
  auth.classList.add("hidden");
  cadastro.classList.add("hidden");
  app.classList.remove("hidden");
  carregarPainel();
  carregarPerfis();
  atualizarNotificacao();
}

function eu(){
  return usuarios().find(u=>u.email === usuarioAtual);
}

function carregarPainel(){
  let u = eu();
  meuPerfil.innerHTML = `
    <div class="profile">
      <img src="${u.fotos[u.fotoPrincipal]}">
      <h2>${u.nome} ${u.sobrenome}</h2>
      <p><b>${u.cidade} - ${u.estado}</b></p>
      <p>Idade: ${u.idade}</p>
      <p>Religião: ${u.religiao}</p>
      <p>Denominação: ${u.denominacao}</p>
      <p>${u.sobre}</p>
      <span class="badge">${u.estadoCivil}</span>
      <span class="badge">${u.igrejaSemana}x igreja/semana</span>
      <span class="badge">${u.jejumSemana}x jejum/semana</span>
    </div>
  `;
}

function compatibilidade(a,b){
  let pontos = 0;
  let total = 0;

  function comparar(c1,c2,peso){
    total += peso;
    if(String(c1).toLowerCase().trim() === String(c2).toLowerCase().trim()) pontos += peso;
  }

  comparar(a.buscaGenero,b.genero,20);
  comparar(a.buscaReligiao,b.religiao,15);
  comparar(a.buscaDenominacao,b.denominacao,15);
  comparar(a.buscaEstadoCivil,b.estadoCivil,10);
  comparar(a.cidade,b.cidade,10);
  comparar(a.igrejaSemana,b.igrejaSemana,10);
  comparar(a.jejumSemana,b.jejumSemana,10);
  comparar(a.bibliaDia,b.bibliaDia,10);

  return Math.round((pontos/total)*100);
}

function carregarPerfis(){
  let atual = eu();
  let lista = usuarios().filter(u=>u.email !== usuarioAtual);

  let compativeis = lista.map(u=>{
    return {...u, match:compatibilidade(atual,u)}
  }).filter(u=>u.match >= 50)
  .sort((a,b)=>b.match-a.match);

  if(compativeis.length === 0){
    listaPerfis.innerHTML = "<p>Nenhum perfil chegou a 50% ainda.</p>";
    return;
  }

  listaPerfis.innerHTML = compativeis.map(u=>`
    <div class="profile">
      <img src="${u.fotos[u.fotoPrincipal]}">
      <div class="match">${u.match}%</div>
      <h3>${u.nome}</h3>
      <p><b>${u.cidade} - ${u.estado}</b></p>
      <p>Idade: ${u.idade}</p>
      <p>Religião: ${u.religiao}</p>
      <p>Denominação: ${u.denominacao}</p>
      <p>${u.sobre}</p>
      <button onclick="abrirConversa('${u.email}')">Enviar mensagem</button>
    </div>
  `).join("");
}

function abrirConversa(emailDestino){
  conversaAtual = emailDestino;
  mostrar("mensagens");
  renderChat();

  let lista = mensagens();
  lista.forEach(m=>{
    if(m.para === usuarioAtual && m.de === conversaAtual) m.lida = true;
  });
  salvarMensagens(lista);
  atualizarNotificacao();
}

function enviarResposta(){
  if(!textoMensagem.value.trim()) return;

  let lista = mensagens();
  lista.push({
    id:Date.now(),
    de:usuarioAtual,
    para:conversaAtual,
    texto:textoMensagem.value,
    data:new Date().toLocaleString("pt-BR"),
    lida:false
  });

  salvarMensagens(lista);
  textoMensagem.value="";
  renderChat();
  atualizarNotificacao();
}

function renderChat(){
  let user = usuarios().find(u=>u.email === conversaAtual);
  chatAberto.classList.remove("hidden");
  chatTitulo.innerText = "Conversa com " + user.nome;

  let lista = mensagens().filter(m =>
    (m.de === usuarioAtual && m.para === conversaAtual) ||
    (m.de === conversaAtual && m.para === usuarioAtual)
  );

  chatBox.innerHTML = lista.map(m=>`
    <div class="msg ${m.de===usuarioAtual?'me':'other'}">
      ${m.texto}<br><small>${m.data}</small>
    </div>
  `).join("");

  carregarConversas();
}

function carregarConversas(){
  let lista = mensagens().filter(m=>m.de === usuarioAtual || m.para === usuarioAtual);
  let emails = [...new Set(lista.map(m=>m.de === usuarioAtual ? m.para : m.de))];

  if(emails.length === 0){
    listaConversas.innerHTML = "<p>Nenhuma mensagem ainda.</p>";
    return;
  }

  listaConversas.innerHTML = emails.map(email=>{
    let user = usuarios().find(u=>u.email === email);
    let novas = mensagens().filter(m=>m.de===email && m.para===usuarioAtual && !m.lida).length;
    return `
      <div class="notice">
        <b>${user ? user.nome : email}</b>
        ${novas>0 ? ` - ${novas} nova(s)` : ""}
        <button onclick="abrirConversa('${email}')">Abrir conversa</button>
      </div>
    `;
  }).join("");
}

function atualizarNotificacao(){
  let novas = mensagens().filter(m=>m.para === usuarioAtual && !m.lida).length;
  noti.innerText = novas > 0 ? `(${novas})` : "";
}

function mostrar(id){
  painel.classList.add("hidden");
  perfis.classList.add("hidden");
  mensagens.classList.add("hidden");
  document.getElementById(id).classList.remove("hidden");

  if(id==="mensagens") carregarConversas();
  if(id==="perfis") carregarPerfis();
}

function sair(){
  localStorage.removeItem("cristaoAtual");
  location.reload();
}

abrirApp();
</script>

</body>
</html>
