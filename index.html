<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jadir Brito | Estudos e Notícias</title>
<meta name="description" content="Plataforma gratuita de estudos e notícias Jadir Brito.">
<meta name="robots" content="index,follow,max-image-preview:large"><meta property="og:type" content="website"><meta property="og:locale" content="pt_BR"><link id="canonical" rel="canonical" href="">
<style>
:root{--ink:#121826;--muted:#667085;--line:#e5e7eb;--soft:#f7f8fa;--navy:#20365f;--red:#a52a2a;--green:#176b45}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font:16px/1.65 Arial,sans-serif;background:#fff}button,input,textarea,select{font:inherit}.wrap{width:min(1160px,92%);margin:auto}.hide{display:none!important}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}.top{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:22px;cursor:pointer}.muted{color:var(--muted)}
.hero{text-align:center;padding:66px 0 42px}.hero h1{font-size:clamp(48px,8vw,82px);letter-spacing:-3px;line-height:1;margin:0 0 15px}.hero p{font-size:20px;color:var(--muted)}
.section{padding:28px 0 65px}.sectionHead{display:flex;justify-content:space-between;align-items:end;border-bottom:3px solid var(--ink);padding-bottom:10px;margin-bottom:22px}.sectionHead h2{font-size:28px;margin:0}
.courseGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.courseCard{border:1px solid var(--line);border-radius:16px;padding:24px;min-height:190px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 7px 24px #1118270a}
.newsGrid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:22px}.newsCard{cursor:pointer;border-bottom:1px solid var(--line);padding-bottom:18px}.newsCard img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:5px}.newsCard h3{font-family:Georgia,serif;font-size:22px;line-height:1.2;margin:8px 0}.newsCard.featured h3{font-size:34px}.kicker{font-size:12px;text-transform:uppercase;letter-spacing:1px;font-weight:800;color:var(--red)}.summary{color:var(--muted)}.date{font-size:13px;color:var(--muted)}
.page{padding:30px 0 75px}.title{font:700 clamp(36px,5vw,60px)/1.08 Georgia,serif;margin:20px 0 10px}.back{color:var(--navy);font-weight:700;cursor:pointer}.cover{width:100%;max-height:480px;object-fit:cover;margin:22px 0;border-radius:8px}.lessons{display:grid;gap:12px;margin-top:30px}.lesson{border:1px solid var(--line);border-radius:10px;padding:18px;cursor:pointer}.article{max-width:820px;margin:auto}.articleBody{font:19px/1.8 Georgia,serif}.articleBody p{white-space:pre-wrap;margin:0 0 22px}.articleBody h2{font:700 29px/1.25 Georgia,serif;margin-top:38px}.articleBody img{width:100%;height:auto;margin:18px 0;border-radius:5px}.articleBody figcaption{font:13px Arial;color:var(--muted);text-align:center}.video{position:relative;padding-top:56.25%;background:#000;margin:28px 0}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.btn{border:0;background:var(--navy);color:#fff;padding:10px 15px;border-radius:8px;font-weight:700;cursor:pointer}.btn.light{background:#edf0f4;color:var(--ink)}.btn.danger{background:var(--red)}.btn.green{background:var(--green)}.btn.small{font-size:13px;padding:6px 9px}.row,.actions,.tabs{display:flex;gap:8px;flex-wrap:wrap}.actions{margin-top:16px}
.quiz{border-top:1px solid var(--line);margin-top:35px;padding-top:20px}.q{border-bottom:1px solid var(--line);padding:15px 0}.q label{display:block}
footer{border-top:1px solid var(--line);padding:30px;text-align:center;color:var(--muted)}.adminA{border:0;background:none;color:#a8afb9;font-weight:bold;cursor:pointer}
.overlay{position:fixed;inset:0;background:#101828a8;z-index:60;display:none;align-items:center;justify-content:center;padding:15px}.overlay.show{display:flex}.modal{width:min(1050px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:15px;padding:22px}.modal.sm{max-width:480px}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:4px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #cdd3dc;border-radius:7px}.field textarea{min-height:115px}.field textarea.editor{min-height:330px}.panel{border:1px solid var(--line);padding:15px;border-radius:10px;margin:12px 0}.note{padding:11px;background:var(--soft);border-radius:7px;color:var(--muted);font-size:13px}.tabs{margin:15px 0}.tab{border:0;padding:9px 11px;border-radius:7px;font-weight:700;cursor:pointer}.tab.on{background:var(--ink);color:#fff}.imgrow{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;margin:8px 0}.quizEditor{background:var(--soft);padding:14px;border-radius:10px;margin:10px 0}.status{font-size:13px;font-weight:bold;color:var(--green)}
@media(max-width:800px){.courseGrid,.newsGrid{grid-template-columns:1fr}.newsCard.featured h3{font-size:27px}.hero h1{letter-spacing:-1px}.imgrow{grid-template-columns:1fr}}
</style></head><body>
<header><div class="wrap top"><div class="brand" onclick="home()">JADIR BRITO</div><div id="hello" class="muted"></div></div></header>
<main id="homeView"><section class="hero"><div class="wrap"><h1 id="siteTitle">JADIR BRITO</h1><p id="siteSub">A curiosidade é a base do conhecimento.</p></div></section>
<section class="section"><div class="wrap"><div class="sectionHead"><h2>Áreas de estudo</h2></div><div id="courseGrid" class="courseGrid"></div></div></section>
<section class="section"><div class="wrap"><div class="sectionHead"><h2>Notícias</h2><span class="muted">Informação e conhecimento</span></div><div id="newsGrid" class="newsGrid"></div></div></section></main>
<main id="courseView" class="hide"><div class="wrap page"><span class="back" onclick="home()">← Início</span><img id="courseCover" class="cover hide"><h1 id="courseName" class="title"></h1><p id="courseDesc" class="summary"></p><div id="lessonList" class="lessons"></div></div></main>
<main id="articleView" class="hide"><div class="wrap page"><article class="article"><span id="articleBack" class="back">← Voltar</span><div id="articleKicker" class="kicker" style="margin-top:28px"></div><h1 id="articleTitle" class="title"></h1><p id="articleSummary" class="summary"></p><div id="articleDate" class="date"></div><img id="articleCover" class="cover hide"><div id="articleBody" class="articleBody"></div><div id="youtube"></div><button id="pdfButton" class="btn" onclick="makePDF()">Baixar aula em PDF</button><section id="quiz" class="quiz"><h2>Perguntas para fixação</h2><div id="quizPublic"></div><button class="btn" onclick="grade()">Corrigir</button><div id="quizResult" class="status"></div></section></article></div></main>
<footer><div id="footerText">Jadir Brito — Conhecimento gratuito.</div><button class="adminA" onclick="openAdmin()">A</button></footer>

<div id="firstAccess" class="overlay"><div class="modal sm"><h2>Primeiro acesso</h2><p>Preencha uma única vez para acessar gratuitamente.</p><div class="field"><label>Nome completo</label><input id="fn"></div><div class="field"><label>WhatsApp</label><input id="fw"></div><div class="field"><label>E-mail</label><input id="fe" type="email"></div><div class="field"><label>Cidade</label><input id="fc"></div><div class="field"><label>Estado</label><input id="fs" maxlength="2" placeholder="SC"></div><button class="btn" onclick="registerVisitor()">Acessar gratuitamente</button></div></div>

<div id="adminModal" class="overlay"><div class="modal"><div class="row" style="justify-content:space-between"><h2>ADM</h2><button class="btn light" onclick="closeAdmin()">Fechar</button></div><div id="adminGate"><div class="field"><label>Senha</label><input id="adminPass" type="password"></div><button class="btn" onclick="adminLogin()">Entrar</button></div><div id="adminPanel" class="hide"><div class="tabs"><button class="tab on" onclick="showTab('site',this)">Site/SEO</button><button class="tab" onclick="showTab('courses',this)">Cursos</button><button class="tab" onclick="showTab('lessons',this)">Aulas</button><button class="tab" onclick="showTab('news',this)">Notícias</button><button class="tab" onclick="showTab('leads',this)">Cadastros</button><button class="tab" onclick="showTab('security',this)">Senha ADM</button></div><div id="tab-site"></div><div id="tab-courses" class="hide"></div><div id="tab-lessons" class="hide"></div><div id="tab-news" class="hide"></div><div id="tab-leads" class="hide"></div><div id="tab-security" class="hide"></div></div></div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";import{getDatabase,ref,get,set,update,remove,onValue,push}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";
const cfg={apiKey:"AIzaSyAWs1MDxOQYjqZ5LlzC4IlXscyDs-N9xfM",authDomain:"namoro-f18ac.firebaseapp.com",databaseURL:"https://namoro-f18ac-default-rtdb.firebaseio.com",projectId:"namoro-f18ac",storageBucket:"namoro-f18ac.firebasestorage.app",messagingSenderId:"336479537433",appId:"1:336479537433:web:dd282c67e98ca196e05d88"},db=getDatabase(initializeApp(cfg)),$=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let state={settings:{title:"JADIR BRITO",subtitle:"A curiosidade é a base do conhecimento.",footer:"Jadir Brito — Conhecimento gratuito.",seoTitle:"Jadir Brito | Estudos e Notícias",seoDescription:"Plataforma gratuita de estudos e notícias."},courses:{},news:{}},admin=false,current={type:null,cid:null,id:null},dirty=false;
function h(s){let x=2166136261;for(let i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619)}return(x>>>0).toString(16)}const initialHash=h("22061992");
function views(v){["homeView","courseView","articleView"].forEach(x=>$(x).classList.add("hide"));$(v).classList.remove("hide");scrollTo(0,0)}window.home=()=>views("homeView");
function bodyHTML(a){let out="";(a.content||"").split(/\n{2,}/).filter(Boolean).forEach(p=>out+=p.startsWith("## ")?`<h2>${esc(p.slice(3))}</h2>`:`<p>${esc(p)}</p>`);Object.values(a.images||{}).forEach(im=>{if(/^https:\/\//.test(im.url||""))out+=`<figure><img src="${esc(im.url)}" alt="${esc(im.alt||a.title)}">${im.caption?`<figcaption>${esc(im.caption)}</figcaption>`:""}</figure>`});return out}
function youtube(u){try{let x=new URL(u),id=x.hostname==="youtu.be"?x.pathname.slice(1):x.searchParams.get("v")||x.pathname.split("/embed/")[1];return id?"https://www.youtube-nocookie.com/embed/"+id:""}catch{return""}}
function render(){let s=state.settings;$("siteTitle").textContent=s.title;$("siteSub").textContent=s.subtitle;$("footerText").textContent=s.footer;document.title=s.seoTitle||s.title;let v=JSON.parse(localStorage.getItem("jb_access")||"null");$("hello").textContent=v?"Olá, "+v.name.split(" ")[0]:"";$("courseGrid").innerHTML=Object.entries(state.courses||{}).map(([id,c])=>`<article class="courseCard" onclick="course('${id}')"><div><div class="kicker">Curso gratuito</div><h2>${esc(c.name)}</h2><p class="summary">${esc(c.desc||"")}</p></div><b>Ver aulas →</b></article>`).join("");let ns=Object.entries(state.news||{}).filter(([_,n])=>n.status!=="draft").sort((a,b)=>(b[1].date||0)-(a[1].date||0));$("newsGrid").innerHTML=ns.length?ns.slice(0,9).map(([id,n],i)=>`<article class="newsCard ${i===0?"featured":""}" onclick="openNews('${id}')">${n.cover?`<img src="${esc(n.cover)}" alt="${esc(n.title)}">`:""}<div class="kicker">${esc(n.category||"Notícias")}</div><h3>${esc(n.title)}</h3><p class="summary">${esc(n.summary||"")}</p><span class="date">${n.date?new Date(n.date).toLocaleDateString("pt-BR"):""}</span></article>`).join(""):'<p class="muted">Nenhuma notícia publicada.</p>'}
window.course=cid=>{let c=state.courses[cid];if(!c)return;$("courseName").textContent=c.name;$("courseDesc").textContent=c.desc||"";if(c.image){$("courseCover").src=c.image;$("courseCover").classList.remove("hide")}else $("courseCover").classList.add("hide");$("lessonList").innerHTML=Object.entries(c.lessons||{}).map(([id,a],i)=>`<div class="lesson" onclick="openLesson('${cid}','${id}')"><span class="kicker">Aula ${i+1}</span><br><b>${esc(a.title)}</b></div>`).join("")||'<p class="muted">Nenhuma aula cadastrada.</p>';views("courseView")};
window.openLesson=(cid,id)=>{let c=state.courses[cid],a=c.lessons[id];current={type:"lesson",cid,id};openArticle(a,c.name,false);$("articleBack").onclick=()=>course(cid)};
window.openNews=id=>{let n=state.news[id];current={type:"news",id};openArticle(n,n.category||"Notícias",true);$("articleBack").onclick=home};
function openArticle(a,kicker,isNews){$("articleKicker").textContent=kicker;$("articleTitle").textContent=a.title;$("articleSummary").textContent=a.summary||"";$("articleDate").textContent=a.date?new Date(a.date).toLocaleDateString("pt-BR"):"";if(a.cover){$("articleCover").src=a.cover;$("articleCover").classList.remove("hide")}else $("articleCover").classList.add("hide");$("articleBody").innerHTML=bodyHTML(a);let y=youtube(a.youtube);$("youtube").innerHTML=y?`<div class="video"><iframe src="${y}" allowfullscreen></iframe></div>`:"";$("pdfButton").classList.toggle("hide",isNews);let q=Object.values(a.quiz||{});$("quiz").classList.toggle("hide",isNews||!q.length);$("quizPublic").innerHTML=q.map((z,i)=>`<div class="q"><b>${i+1}. ${esc(z.q)}</b>${(z.options||[]).map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${esc(o)}</label>`).join("")}</div>`).join("");$("quizResult").textContent="";views("articleView")}
window.grade=()=>{let a=state.courses[current.cid].lessons[current.id],q=Object.values(a.quiz||{}),n=0,details=[];q.forEach((z,i)=>{let r=document.querySelector(`input[name=q${i}]:checked`),ok=r&&+r.value===+z.correct;if(ok)n++;let letter=String.fromCharCode(65+(+z.correct||0)),answer=(z.options||[])[+z.correct]||"";details.push(`<div class="panel" style="margin-top:12px"><b>Questão ${i+1}: ${ok?"Você acertou.":"Você errou."}</b><br><strong>Resposta Correta:</strong> ${letter}) ${esc(answer)}<br><strong>Explicação:</strong> ${esc(z.explanation||"Sem explicação cadastrada.")}</div>`)});$("quizResult").innerHTML=`<h3>Você acertou ${n} de ${q.length}.</h3>`+details.join("")};
window.makePDF=()=>{let a=state.courses[current.cid].lessons[current.id],w=open("","_blank");w.document.write(`<style>body{font:17px/1.7 Arial;max-width:800px;margin:40px auto}img{max-width:100%}@media print{button{display:none}}</style><h1>${esc(a.title)}</h1>${bodyHTML(a)}<button onclick="print()">Salvar como PDF</button>`);w.document.close()};
window.registerVisitor=async()=>{let d={name:$("fn").value.trim(),whatsapp:$("fw").value.trim(),email:$("fe").value.trim(),city:$("fc").value.trim(),state:$("fs").value.trim().toUpperCase(),createdAt:Date.now()};if(d.name.split(/\s+/).length<2||!d.whatsapp||!d.email.includes("@")||!d.city||d.state.length!==2)return alert("Preencha todos os campos.");try{await set(push(ref(db,"visitors")),d);localStorage.setItem("jb_access",JSON.stringify(d));$("firstAccess").classList.remove("show");render()}catch{alert("Não foi possível concluir o cadastro.")}};
window.openAdmin=()=>{$("adminModal").classList.add("show");$("adminGate").classList.toggle("hide",admin);$("adminPanel").classList.toggle("hide",!admin);if(admin)adminHome()};window.closeAdmin=()=>{if(dirty&&!confirm("Há alterações não salvas. Deseja sair mesmo assim?"))return;$("adminModal").classList.remove("show");dirty=false};
async function passHash(){let s=await get(ref(db,"adminConfig/passwordHash"));return s.exists()?s.val():initialHash}window.adminLogin=async()=>{if(h($("adminPass").value)!==await passHash())return alert("Senha incorreta.");admin=true;$("adminGate").classList.add("hide");$("adminPanel").classList.remove("hide");adminHome()};
window.showTab=(n,b)=>{if(dirty&&!confirm("Existem alterações não salvas. Continuar sem salvar?"))return;dirty=false;["site","courses","lessons","news","leads","security"].forEach(x=>$("tab-"+x).classList.add("hide"));$("tab-"+n).classList.remove("hide");b.parentNode.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));b.classList.add("on")};
function adminHome(){$("tab-site").innerHTML=`<div class="field"><label>Nome do site</label><input id="st" value="${esc(state.settings.title)}"></div><div class="field"><label>Frase</label><input id="ss" value="${esc(state.settings.subtitle)}"></div><div class="field"><label>Rodapé</label><input id="sf" value="${esc(state.settings.footer)}"></div><div class="field"><label>Título SEO</label><input id="seoT" value="${esc(state.settings.seoTitle||"")}"></div><div class="field"><label>Descrição SEO</label><textarea id="seoD">${esc(state.settings.seoDescription||"")}</textarea></div><div class="actions"><button class="btn" onclick="saveSite(false)">Salvar</button><button class="btn green" onclick="saveSite(true)">Salvar e sair</button></div>`;
$("tab-courses").innerHTML=`<button class="btn" onclick="editCourse()">+ Novo curso</button>`+Object.entries(state.courses||{}).map(([id,c])=>`<div class="panel"><b>${esc(c.name)}</b><div class="actions"><button class="btn small" onclick="editCourse('${id}')">Editar</button><button class="btn danger small" onclick="deleteCourse('${id}')">Excluir</button></div></div>`).join("");
$("tab-lessons").innerHTML=`<button class="btn" onclick="editLesson()">+ Nova aula</button>`+Object.entries(state.courses||{}).flatMap(([cid,c])=>Object.entries(c.lessons||{}).map(([id,a])=>`<div class="panel"><span class="kicker">${esc(c.name)}</span><br><b>${esc(a.title)}</b><div class="actions"><button class="btn small" onclick="editLesson('${cid}','${id}')">Editar</button><button class="btn danger small" onclick="deleteLesson('${cid}','${id}')">Excluir</button></div></div>`)).join("");
$("tab-news").innerHTML=`<button class="btn" onclick="editNews()">+ Nova notícia</button>`+Object.entries(state.news||{}).sort((a,b)=>(b[1].date||0)-(a[1].date||0)).map(([id,n])=>`<div class="panel"><span class="kicker">${esc(n.status==="draft"?"Rascunho":n.category||"Notícia")}</span><br><b>${esc(n.title)}</b><div class="actions"><button class="btn small" onclick="editNews('${id}')">Editar</button><button class="btn danger small" onclick="deleteNews('${id}')">Excluir</button></div></div>`).join("");
$("tab-security").innerHTML=`<div class="panel"><h3>Alterar senha do ADM</h3><div class="field"><label>Senha atual</label><input id="oldP" type="password"></div><div class="field"><label>Nova senha</label><input id="newP" type="password"></div><div class="field"><label>Confirmar</label><input id="newP2" type="password"></div><div class="actions"><button class="btn" onclick="changePassword(false)">Salvar</button><button class="btn green" onclick="changePassword(true)">Salvar e sair</button></div></div>`;get(ref(db,"visitors")).then(s=>$("tab-leads").innerHTML=Object.values(s.val()||{}).map(x=>`<div class="panel"><b>${esc(x.name)}</b><div>${esc(x.whatsapp)} · ${esc(x.email)}</div><div>${esc(x.city)} / ${esc(x.state)}</div></div>`).join("")||'<p>Nenhum cadastro.</p>')}
function done(exit){dirty=false;alert("Salvo com sucesso.");if(exit)adminHome()}
window.saveSite=async exit=>{await set(ref(db,"settings"),{title:$("st").value,subtitle:$("ss").value,footer:$("sf").value,seoTitle:$("seoT").value,seoDescription:$("seoD").value});done(exit)};
window.editCourse=id=>{let c=id?state.courses[id]:{name:"",desc:"",image:""};$("tab-courses").innerHTML=`<button class="btn light" onclick="adminHome()">← Voltar</button><h3>${id?"Editar":"Novo"} curso</h3><div class="field"><label>Nome</label><input id="cName" value="${esc(c.name)}"></div><div class="field"><label>Descrição</label><textarea id="cDesc">${esc(c.desc)}</textarea></div><div class="field"><label>Imagem de capa por URL</label><input id="cImage" value="${esc(c.image||"")}"></div><div class="actions"><button class="btn" onclick="saveCourse('${id||""}',false)">Salvar</button><button class="btn green" onclick="saveCourse('${id||""}',true)">Salvar e sair</button></div>`;dirty=true};window.saveCourse=async(id,exit)=>{let d={name:$("cName").value,desc:$("cDesc").value,image:$("cImage").value};if(id)await update(ref(db,"courses/"+id),d);else await set(push(ref(db,"courses")),d);dirty=false;if(exit)adminHome();else alert("Curso salvo.")};window.deleteCourse=id=>confirm("Excluir curso?")&&remove(ref(db,"courses/"+id));
window.editLesson=(cid,id)=>{let a=id?state.courses[cid].lessons[id]:{title:"",content:"",youtube:"",seoTitle:"",seoDescription:"",images:{},quiz:{}},opts=Object.entries(state.courses||{}).map(([x,c])=>`<option value="${x}" ${x===cid?"selected":""}>${esc(c.name)}</option>`).join("");sessionStorage.setItem("jb_lesson_draft",JSON.stringify(a));$("tab-lessons").innerHTML=`<button class="btn light" onclick="adminHome()">← Voltar</button><h3>${id?"Editar":"Nova"} aula</h3><div class="field"><label>Curso</label><select id="lCourse">${opts}</select></div><div class="field"><label>Título</label><input id="lTitle" value="${esc(a.title)}"></div><div class="field"><label>Conteúdo da aula</label><textarea id="lContent" class="editor">${esc(a.content||"")}</textarea></div><div class="field"><label>URL YouTube</label><input id="lYoutube" value="${esc(a.youtube||"")}"></div><div class="field"><label>Título SEO</label><input id="lSeoT" value="${esc(a.seoTitle||"")}"></div><div class="field"><label>Descrição SEO</label><textarea id="lSeoD">${esc(a.seoDescription||"")}</textarea></div><h3>Perguntas da aula</h3><div id="quizEdit">${quizEditor(a.quiz||{})}</div><button class="btn light" onclick="addQuestion()">+ Nova pergunta</button><div class="actions"><button class="btn" onclick="saveLesson('${cid||""}','${id||""}',false)">Salvar</button><button class="btn green" onclick="saveLesson('${cid||""}','${id||""}',true)">Salvar e sair</button></div>`;dirty=true};
function quizEditor(q){return Object.entries(q).map(([id,z],i)=>`<div class="quizEditor" data-qid="${id}"><b>Pergunta ${i+1}</b><div class="field"><input class="qq" value="${esc(z.q)}" placeholder="Pergunta"></div>${[0,1,2,3].map(j=>`<div class="field"><input class="qo" value="${esc((z.options||[])[j]||"")}" placeholder="Alternativa ${String.fromCharCode(65+j)}"></div>`).join("")}<div class="field"><label>Resposta correta</label><select class="qc">${[0,1,2,3].map(j=>`<option value="${j}" ${+z.correct===j?"selected":""}>${String.fromCharCode(65+j)}</option>`).join("")}</select></div><div class="field"><label>Explicação da resposta correta</label><textarea class="qe" placeholder="Explique por que esta é a resposta correta">${esc(z.explanation||"")}</textarea></div><button class="btn danger small" onclick="this.closest('.quizEditor').remove()">Excluir pergunta</button></div>`).join("")}
window.addQuestion=()=>{$("quizEdit").insertAdjacentHTML("beforeend",quizEditor({["new"+Date.now()]:{q:"",options:["","","",""],correct:0,explanation:""}}));dirty=true};
function collectQuiz(){let q={};document.querySelectorAll(".quizEditor").forEach((e,i)=>q["q"+Date.now()+i]={q:e.querySelector(".qq").value,options:[...e.querySelectorAll(".qo")].map(x=>x.value),correct:+e.querySelector(".qc").value,explanation:e.querySelector(".qe").value});return q}
window.saveLesson=async(oldCid,id,exit)=>{let cid=$("lCourse").value,d={title:$("lTitle").value,content:$("lContent").value,youtube:$("lYoutube").value,seoTitle:$("lSeoT").value,seoDescription:$("lSeoD").value,quiz:collectQuiz()};if(id&&oldCid===cid)await update(ref(db,`courses/${cid}/lessons/${id}`),d);else{await set(push(ref(db,`courses/${cid}/lessons`)),d);if(id)await remove(ref(db,`courses/${oldCid}/lessons/${id}`))}sessionStorage.removeItem("jb_lesson_draft");dirty=false;if(exit)adminHome();else alert("Aula salva.")};window.deleteLesson=(c,id)=>confirm("Excluir aula?")&&remove(ref(db,`courses/${c}/lessons/${id}`));
window.editNews=id=>{let n=id?state.news[id]:{title:"",category:"Notícias",summary:"",cover:"",content:"",status:"draft",date:Date.now(),seoTitle:"",seoDescription:""};$("tab-news").innerHTML=`<button class="btn light" onclick="adminHome()">← Voltar</button><h3>${id?"Editar":"Nova"} notícia</h3><div class="field"><label>Título</label><input id="nTitle" value="${esc(n.title)}"></div><div class="field"><label>Categoria</label><input id="nCat" value="${esc(n.category||"Notícias")}"></div><div class="field"><label>Resumo</label><textarea id="nSummary">${esc(n.summary||"")}</textarea></div><div class="field"><label>Imagem de capa por URL</label><input id="nCover" value="${esc(n.cover||"")}"></div><div class="field"><label>Notícia completa</label><textarea id="nContent" class="editor">${esc(n.content||"")}</textarea></div><div class="field"><label>Publicação</label><select id="nStatus"><option value="draft" ${n.status==="draft"?"selected":""}>Rascunho</option><option value="published" ${n.status!=="draft"?"selected":""}>Publicada</option></select></div><div class="field"><label>Título SEO</label><input id="nSeoT" value="${esc(n.seoTitle||"")}"></div><div class="field"><label>Descrição SEO</label><textarea id="nSeoD">${esc(n.seoDescription||"")}</textarea></div><div class="actions"><button class="btn" onclick="saveNews('${id||""}',false)">Salvar</button><button class="btn green" onclick="saveNews('${id||""}',true)">Salvar e sair</button></div>`;dirty=true};window.saveNews=async(id,exit)=>{let d={title:$("nTitle").value,category:$("nCat").value,summary:$("nSummary").value,cover:$("nCover").value,content:$("nContent").value,status:$("nStatus").value,seoTitle:$("nSeoT").value,seoDescription:$("nSeoD").value,date:id?(state.news[id].date||Date.now()):Date.now()};if(id)await set(ref(db,"news/"+id),d);else await set(push(ref(db,"news")),d);dirty=false;if(exit)adminHome();else alert("Notícia salva.")};window.deleteNews=id=>confirm("Excluir notícia?")&&remove(ref(db,"news/"+id));
window.changePassword=async exit=>{let old=$("oldP").value,n=$("newP").value,n2=$("newP2").value;if(h(old)!==await passHash())return alert("Senha atual incorreta.");if(n.length<8||n!==n2)return alert("Confira a nova senha. Mínimo 8 caracteres.");await set(ref(db,"adminConfig/passwordHash"),h(n));alert("Senha alterada.");if(exit)adminHome()};
onValue(ref(db,"settings"),s=>{if(s.exists())state.settings=s.val();render()});onValue(ref(db,"courses"),s=>{state.courses=s.val()||{};render()});onValue(ref(db,"news"),s=>{state.news=s.val()||{};render()});render();home();if(!localStorage.getItem("jb_access"))$("firstAccess").classList.add("show");
</script></body></html>
