<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Namoro Cristão</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:#d9e6f7;color:#222}
header{background:#3b5998;color:white;padding:16px 25px}
.container{max-width:1200px;margin:auto;padding:16px}
.card{background:white;border:1px solid #b9cbe3;border-radius:8px;padding:18px;margin-bottom:15px;box-shadow:0 2px 8px #0002}
input,select,textarea,button{width:100%;padding:12px;margin:6px 0;border:1px solid #b8c7dc;border-radius:6px;font-size:15px}
textarea{min-height:85px}
button{background:#3b5998;color:white;border:none;font-weight:bold;cursor:pointer}
button:hover{opacity:.9}
.hidden{display:none!important}
.loginBox{max-width:430px;margin:35px auto}
.nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin-bottom:15px}
.nav button{background:#5278bd}
.red{background:#c0392b!important}.dark{background:#222!important}.green{background:#16803c!important}
.layout{display:grid;grid-template-columns:260px 1fr 280px;gap:15px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.container{padding:10px}header{text-align:center}}
.mainPhoto{width:100%;height:280px;object-fit:cover;border-radius:8px;border:1px solid #b8c7dc}
.nome{color:#214478;margin:10px 0;font-size:24px}
.album{display:grid;grid-template-columns:repeat(auto-fit,minmax(85px,1fr));gap:8px;margin-top:10px}
.album img{width:100%;height:90px;object-fit:cover;border-radius:6px;border:2px solid #c8d6e8}
.preview{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.preview img{width:100%;height:110px;object-fit:cover;border-radius:8px}
.title{background:#edf4ff;color:#214478;padding:9px;border-radius:6px;margin-bottom:10px;font-weight:bold}
.badge{display:inline-block;background:#e8f0ff;color:#214478;padding:6px 9px;border-radius:20px;margin:3px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px}
.perfil{border:1px solid #c8d6e8;border-radius:8px;padding:12px;background:white}
.perfilTop{display:flex;gap:10px;align-items:center}
.perfilTop img{width:95px;height:95px;object-fit:cover;border-radius:8px}
.match{color:#3b5998;font-size:26px;font-weight:bold}
.notice{background:#fff8d8;border:1px solid #eadb8c;border-radius:8px;padding:10px;margin:8px 0}
.chatBox{height:320px;overflow:auto;background:#edf4ff;border-radius:8px;padding:12px}
.msg{max-width:80%;padding:10px;border-radius:10px;margin:8px 0}
.me{background:#3b5998;color:white;margin-left:auto}.other{background:white;border:1px solid #c8d6e8}
.adminBtn{position:fixed;right:18px;bottom:18px;width:48px;height:48px;border-radius:50%;background:#222;color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;cursor:pointer;z-index:99}
</style>
</head>
<body>

<header>
<h1 id="txtTituloSite">Namoro Cristão</h1>
<p id="txtSubtituloSite">Relacionamento cristão com perfil, chat VIP e conexões</p>
</header>

<div class="container">

<div id="authBox" class="card loginBox">
<h2 id="txtEntrar">Entrar</h2>
<input id="loginEmail" placeholder="E-mail">
<input id="loginSenha" type="password" placeholder="Senha">
<button onclick="login()" id="txtBtnEntrar">Entrar</button>
<button onclick="abrirCadastro()" id="txtBtnCadastro">Criar cadastro</button>
<p id="txtMaioridade">Somente maiores de 18 anos.</p>
</div>

<div id="cadastroBox" class="card hidden">
<h2 id="tituloCadastro">Cadastro Cristão</h2>

<label id="lblNome">Nome</label><input id="nome">
<label id="lblSobrenome">Sobrenome</label><input id="sobrenome">
<label id="lblNascimento">Data de nascimento</label><input id="nascimento" type="date">
<label id="lblCpf">CPF</label><input id="cpf">
<label id="lblGenero">Gênero</label>
<select id="genero"><option value="">Selecione</option><option>Homem</option><option>Mulher</option></select>

<label id="lblEmail">E-mail</label><input id="email">
<label id="lblSenha">Senha</label><input id="senha" type="password">
<label id="lblWhatsapp">WhatsApp</label><input id="whatsapp">
<label id="lblCidade">Cidade</label><input id="cidade">
<label id="lblEstado">Estado</label><input id="estado">

<label id="lblReligiao">Qual a sua religião?</label><input id="religiao">
<label id="lblDenominacao">Denominação</label><input id="denominacao">
<label id="lblLocalCulto">Nome da denominação / local físico onde cultua</label><input id="localCulto">

<label id="lblEstadoCivil">Estado civil</label>
<select id="estadoCivil"><option value="">Selecione</option><option>Solteiro(a)</option><option>Viúvo(a)</option><option>Divorciado(a)</option></select>

<label id="lblTempoEstadoCivil">Se viúvo(a) ou divorciado(a), há quanto tempo?</label><input id="tempoEstadoCivil">
<label id="lblFilhos">Número de filhos, se tiver</label><input id="filhos">
<label id="lblIdadeFilhos">Idade dos filhos</label><input id="idadeFilhos">

<h3>Vida espiritual</h3>
<label id="lblBatizadoTempo">Batizado em águas há quanto tempo?</label><input id="batizadoTempo">
<label id="lblHorariosOracao">Qual horário você costuma orar no dia?</label><input id="horariosOracao">
<label id="lblBibliaDia">Lê a Bíblia diariamente?</label><input id="bibliaDia">
<label id="lblJejumSemana">Jejua durante a semana?</label><input id="jejumSemana">
<label id="lblIgrejaSemana">Frequenta a igreja quantas vezes na semana?</label><input id="igrejaSemana">
<label id="lblAfastado">Está afastado(a) da igreja há quanto tempo?</label><input id="afastado">
<label id="lblCargoIgreja">Exerce algum cargo na igreja? Qual?</label><input id="cargoIgreja">
<label id="lblMusica">Que tipo de música ouve?</label><input id="musica">

<h3>Quem você busca?</h3>
<label id="lblBuscaReligiao">Religião que busca</label><input id="buscaReligiao">
<label id="lblBuscaDenominacao">Denominação que busca</label><input id="buscaDenominacao">
<label id="lblBuscaEstadoCivil">Estado civil que aceita</label><input id="buscaEstadoCivil">
<label id="lblBuscaIgrejaSemana">Frequência na igreja que busca</label><input id="buscaIgrejaSemana">
<label id="lblBuscaJejumSemana">Jejum semanal que busca</label><input id="buscaJejumSemana">
<label id="lblBuscaBibliaDia">Leitura bíblica que busca</label><input id="buscaBibliaDia">

<div id="camposExtrasCadastro"></div>

<label id="lblQuemSou">Quem sou eu?</label>
<textarea id="quemSou" placeholder="Escreva com suas palavras"></textarea>

<label id="lblProcura">Descreva a pessoa que você procura</label>
<textarea id="procura"></textarea>

<h3>Enviar até 7 fotos</h3>
<input id="fotos" type="file" accept="image/*" multiple onchange="carregarFotos()">
<div id="previewFotos" class="preview"></div>

<button onclick="salvarCadastro()" id="btnSalvarCadastro">Finalizar cadastro</button>
<button class="dark hidden" id="btnSairSemSalvar" onclick="sairSemSalvar()">Sair sem salvar</button>
</div>

<div id="appBox" class="hidden">
<div class="nav">
<button onclick="mostrar('painel')">Meu perfil</button>
<button onclick="abrirEdicaoPerfil()">Editar perfil</button>
<button onclick="mostrar('conexoes')">Conexões <span id="totalConexoes"></span></
