<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JADIR BRITO — Estudos</title>
<style>
:root{--ink:#172033;--muted:#667085;--line:#e5e7eb;--soft:#f7f8fb;--accent:#243b67;--danger:#a52626}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Arial,sans-serif;line-height:1.65}button,input,textarea,select{font:inherit}.wrap{width:min(1120px,92%);margin:auto}.hidden{display:none!important}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}.top{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;font-size:1.2rem;cursor:pointer}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}.btn.light{background:#eef1f6;color:var(--ink)}.btn.danger{background:var(--danger)}.btn.small{padding:7px 10px;font-size:.88rem}
.hero{text-align:center;padding:75px 0 42px}.hero h1{font-size:clamp(2.7rem,8vw,5.7rem);line-height:.98;letter-spacing:-3px;margin:0 0 20px}.hero p{font-size:clamp(1.05rem,2vw,1.35rem);color:var(--muted);margin:auto;max-width:720px}.section{padding:30px 0 85px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}.card{min-height:210px;border:1px solid var(--line);border-radius:18px;padding:27px;background:#fff;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 25px rgba(15,23,42,.05);cursor:pointer;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 15px 35px rgba(15,23,42,.1)}.card h2{font-size:1.6rem;margin:8px 0}.card p{color:var(--muted);margin:0}.tag{font-size:.76rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);font-weight:850}
.page{padding:42px 0 80px}.back{font-weight:850;color:var(--accent);cursor:pointer;display:inline-block;margin-bottom:20px}.cover{width:100%;max-height:380px;object-fit:cover;border:1px solid var(--line);border-radius:18px}.title{font-size:clamp(2rem,5vw,3.8rem);line-height:1.08;margin:20px 0 8px}.desc{color:var(--muted);max-width:780px}.lessons{display:grid;gap:12px;margin-top:30px}.lesson{border:1px solid var(--line);border-radius:13px;padding:19px;cursor:pointer}.lesson:hover{background:var(--soft)}
.article{max-width:820px;margin:auto}.article p{font-size:1.08rem;white-space:pre-wrap}.article img{width:100%;border-radius:14px;margin:14px 0}.video{position:relative;padding-top:56.25%;background:#000;border-radius:14px;overflow:hidden;margin:20px 0}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.download{display:inline-block;background:var(--accent);color:#fff;padding:11px 15px;border-radius:9px;text-decoration:none;font-weight:800;margin:15px 0}.quiz{border-top:1px solid var(--line);margin-top:35px;padding-top:22px}.q{border-bottom:1px solid var(--line);padding:15px 0}.q label{display:block;margin:6px 0}.result{font-weight:900;margin-top:15px}
footer{border-top:1px solid var(--line);text-align:center;color:var(--muted);padding:30px}.overlay{position:fixed;inset:0;background:rgba(10,15,25,.55);z-index:50;display:none;align-items:center;justify-content:center;padding:18px}.overlay.show{display:flex}.modal{width:min(980px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:24px}.modal.sm{max-width:440px}.modalTop{display:flex;justify-content:space-between;align-items:center}.modalTop h2{margin:0}.x{border:0;background:#eef1f5;border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer}.field{margin:13px 0}.field label{display:block;font-weight:800;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #cfd5df;border-radius:9px}.field textarea{min-height:90px}.row{display:flex;gap:8px;flex-wrap:wrap}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.tab{border:0;border-radius:9px;background:#eef1f5;padding:9px 12px;font-weight:800;cursor:pointer}.tab.active{background:var(--ink);color:#fff}.panel{border:1px solid var(--line);border-radius:13px;padding:15px;margin:12px 0}.note{background:var(--soft);padding:11px;border-radius:9px;color:var(--muted);font-size:.9rem}.status{font-size:.85rem;color:var(--muted)}
@media(max-width:700px){.grid{grid-template-columns:1fr}.hero{padding-top:52px}.hero h1{letter-spacing:-1.5px}.card{min-height:170px}.top{padding:10px 0;flex-wrap:wrap}.modal{padding:17px}}
</style></head>
<body>
<header><div class="wrap top"><div class="brand" onclick="showHome()">JADIR BRITO</div><div class="actions"><span class="status" id="who"></span><button id="studentBtn" class="btn light small" onclick="openStudent()">Entrar / Cadastrar</button><button id="logoutBtn" class="btn light small hidden" onclick="logoutUser()">Sair</button></div></div></header>

<main id="homeView"><section class="hero"><div class="wrap"><h1 id="siteTitle">JADIR BRITO</h1><p id="siteSub">A curiosidade é a base do conhecimento.</p></div></section><section class="section"><div class="wrap"><div id="courseGrid" class="grid"></div></div></section></main>
<main id="courseView" class="hidden"><div class="wrap page"><span class="back" onclick="showHome()">← Início</span><img id="cover" class="cover hidden"><h1 id="courseTitle" class="title"></h1><p id="courseDesc" class="desc"></p><div id="lessonList" class="lessons"></div></div></main>
<main id="lessonView" class="hidden"><div class="wrap page"><span id="lessonBack" class="back">← Voltar</span><article class="article"><div id="lessonCat" class="tag"></div><h1 id="lessonTitle" class="title"></h1><div id="content"></div><a id="pdf" class="download hidden" target="_blank">Baixar PDF</a><section id="quiz" class="quiz"><h2>Perguntas para fixação</h2><div id="questions"></div><button class="btn" onclick="grade()">Corrigir respostas</button><div id="result" class="result"></div></section></article></div></main>
<footer><div id="footer">Jadir Brito — Conhecimento gratuito.</div>
<div style="margin-top:12px"><button onclick="openAdmin()" aria-label="Administração" title="Administração" style="border:0;background:transparent;color:#98a2b3;font-weight:900;font-size:14px;cursor:pointer;padding:5px 9px">A</button></div></footer>

<div class="overlay" id="studentModal"><div class="modal sm"><div class="modalTop"><h2>Área do aluno</h2><button class="x" onclick="closeM('studentModal')">×</button></div><div class="tabs"><button class="tab active" onclick="authTab('loginForm',this)">Entrar</button><button class="tab" onclick="authTab('registerForm',this)">Cadastrar</button></div>
<div id="loginForm"><div class="field"><label>E-mail</label><input id="loginEmail" type="email"></div><div class="field"><label>Senha</label><input id="loginPass" type="password"></div><button class="btn" onclick="studentLogin()">Entrar</button></div>
<div id="registerForm" class="hidden"><div class="field"><label>Nome</label><input id="regName"></div><div class="field"><label>E-mail</label><input id="regEmail" type="email"></div><div class="field"><label>Senha</label><input id="regPass" type="password" minlength="6"></div><button class="btn" onclick="registerStudent()">Criar cadastro</button></div>
<p class="note">Cadastro gratuito. O login é feito pelo Firebase Authentication.</p></div></div>

<div class="overlay" id="adminModal"><div class="modal"><div class="modalTop"><h2>Painel ADM</h2><button class="x" onclick="closeM('adminModal')">×</button></div>
<div id="adminGate"><div class="field"><label>Senha ADM</label><input id="admPass" type="password" inputmode="numeric" autocomplete="off"></div><button class="btn" onclick="adminLogin()">Entrar</button></div>
<div id="adminPanel" class="hidden"><div class="tabs"><button class="tab active" onclick="admTab('site',this)">Site</button><button class="tab" onclick="admTab('courses',this)">Cursos</button><button class="tab" onclick="admTab('lessons',this)">Aulas</button><button class="tab" onclick="admTab('students',this)">Alunos</button></div><div id="a-site"></div><div id="a-courses" class="hidden"></div><div id="a-lessons" class="hidden"></div><div id="a-students" class="hidden"></div></div>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import { getDatabase, ref, get, set, update, remove, onValue, push } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyAWs1MDxOQYjqZ5LlzC4IlXscyDs-N9xfM",
 authDomain:"namoro-f18ac.firebaseapp.com",
 databaseURL:"https://namoro-f18ac-default-rtdb.firebaseio.com",
 projectId:"namoro-f18ac",
 storageBucket:"namoro-f18ac.firebasestorage.app",
 messagingSenderId:"336479537433",
 appId:"1:336479537433:web:dd282c67e98ca196e05d88",
 measurementId:"G-1YLR1JNZYY"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
let state={settings:{title:"JADIR BRITO",subtitle:"A curiosidade é a base do conhecimento.",footer:"Jadir Brito — Conhecimento gratuito."},courses:{}},currentUser=null,isAdmin=false,cc=null,cl=null;

function errorMsg(e){console.error(e);alert("Não foi possível concluir. "+(e?.message||""))}
function views(id){["homeView","courseView","lessonView"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden");scrollTo(0,0)}
window.showHome=()=>views("homeView"); window.closeM=id=>$(id).classList.remove("show");
window.openStudent=()=>$("studentModal").classList.add("show");
window.authTab=(id,b)=>{["loginForm","registerForm"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden");b.parentNode.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active")};

async function ensureSeed(){
 const s=await get(ref(db,"settings"));
 if(!s.exists() && isAdmin) await set(ref(db,"settings"),state.settings);
 const c=await get(ref(db,"courses"));
 if(!c.exists() && isAdmin){
   const base=[["Estudo Bíblico","Bíblia, contexto histórico, teologia e estudos das Escrituras."],["Música","Teoria musical, prática, leitura e instrumentos."],["História","História antiga, mundial, do Brasil e da Igreja."],["Novos Estudos","Novas áreas de conhecimento cadastradas pelo administrador."]];
   for(const x of base){const r=push(ref(db,"courses"));await set(r,{name:x[0],desc:x[1],image:""});}
 }
}
function render(){
 $("siteTitle").textContent=state.settings?.title||"JADIR BRITO";$("siteSub").textContent=state.settings?.subtitle||"";$("footer").textContent=state.settings?.footer||"";
 $("who").textContent=currentUser?`${currentUser.displayName||currentUser.email}${isAdmin?" • ADM":""}`:"";$("studentBtn").classList.toggle("hidden",!!currentUser);$("logoutBtn").classList.toggle("hidden",!currentUser);
 const g=$("courseGrid");g.innerHTML="";Object.entries(state.courses||{}).forEach(([id,c],i)=>{let e=document.createElement("article");e.className="card";e.onclick=()=>showCourse(id);e.innerHTML=`<div><div class="tag">Área ${i+1}</div><h2>${esc(c.name)}</h2><p>${esc(c.desc||"")}</p></div><b>Acessar →</b>`;g.appendChild(e)})
}
function showCourse(id){let c=state.courses[id];if(!c)return;cc=id;$("courseTitle").textContent=c.name;$("courseDesc").textContent=c.desc||"";if(c.image){$("cover").src=c.image;$("cover").classList.remove("hidden")}else $("cover").classList.add("hidden");let l=$("lessonList");l.innerHTML="";let lessons=c.lessons||{};let arr=Object.entries(lessons);if(!arr.length)l.innerHTML='<div class="panel">Nenhuma aula cadastrada.</div>';arr.forEach(([lid,a],i)=>{let x=document.createElement("div");x.className="lesson";x.onclick=()=>openLesson(id,lid);x.innerHTML=`<div class="tag">Aula ${i+1}</div><b>${esc(a.title)}</b>`;l.appendChild(x)});views("courseView")} window.showCourse=showCourse;
function embed(u){if(!u)return"";let m=u.match(/(?:youtu\.be\/|v=|embed\/)([^?&/]+)/);return m?`https://www.youtube.com/embed/${m[1]}`:""}
function openLesson(cid,lid){if(!currentUser){openStudent();return}let c=state.courses[cid],a=c?.lessons?.[lid];if(!a)return;cc=cid;cl=lid;$("lessonCat").textContent=c.name;$("lessonTitle").textContent=a.title;$("lessonBack").onclick=()=>showCourse(cid);let ct=$("content");ct.innerHTML="";Object.values(a.blocks||{}).forEach(b=>{if(b.type==="text")ct.insertAdjacentHTML("beforeend",`<p>${esc(b.value)}</p>`);else if(b.value)ct.insertAdjacentHTML("beforeend",`<img src="${esc(b.value)}" alt="Imagem da aula">`)});let em=embed(a.video);if(em)ct.insertAdjacentHTML("beforeend",`<div class="video"><iframe src="${em}" allowfullscreen></iframe></div>`);if(a.pdf){$("pdf").href=a.pdf;$("pdf").classList.remove("hidden")}else $("pdf").classList.add("hidden");let qs=Object.values(a.quiz||{}),q=$("questions");q.innerHTML="";if(qs.length){$("quiz").classList.remove("hidden");qs.forEach((z,i)=>q.insertAdjacentHTML("beforeend",`<div class="q"><b>${i+1}. ${esc(z.q)}</b>${(z.options||[]).map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${esc(o)}</label>`).join("")}</div>`))}else $("quiz").classList.add("hidden");$("result").textContent="";views("lessonView")} window.openLesson=openLesson;
window.grade=()=>{let a=state.courses[cc].lessons[cl],qs=Object.values(a.quiz||{}),n=0;qs.forEach((q,i)=>{let r=document.querySelector(`input[name=q${i}]:checked`);if(r&&+r.value===+q.correct)n++});$("result").textContent=`Você acertou ${n} de ${qs.length}.`};

window.registerStudent=async()=>{try{let name=$("regName").value.trim(),email=$("regEmail").value.trim(),pass=$("regPass").value;if(!name)return alert("Informe seu nome.");let cred=await createUserWithEmailAndPassword(auth,email,pass);await updateProfile(cred.user,{displayName:name});await set(ref(db,"users/"+cred.user.uid),{name,email,createdAt:Date.now()});closeM("studentModal");alert("Cadastro criado com sucesso.")}catch(e){errorMsg(e)}};
window.studentLogin=async()=>{try{await signInWithEmailAndPassword(auth,$("loginEmail").value.trim(),$("loginPass").value);closeM("studentModal")}catch(e){errorMsg(e)}};
window.logoutUser=()=>signOut(auth);
window.openAdmin=()=>{$("adminModal").classList.add("show");$("adminGate").classList.toggle("hidden",isAdmin);$("adminPanel").classList.toggle("hidden",!isAdmin);if(isAdmin)renderAdmin()};
window.adminLogin=async()=>{if($("admPass").value!=="22061992"){alert("Senha incorreta.");return} $("admPass").value=""; isAdmin=true; $("adminGate").classList.add("hidden"); $("adminPanel").classList.remove("hidden"); renderAdmin();};
window.admTab=(n,b)=>{["site","courses","lessons","students"].forEach(x=>$("a-"+x).classList.add("hidden"));$("a-"+n).classList.remove("hidden");b.parentNode.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active")};

function renderAdmin(){
 $("a-site").innerHTML=`<div class="field"><label>Título</label><input id="st" value="${esc(state.settings.title)}"></div><div class="field"><label>Frase</label><textarea id="ss">${esc(state.settings.subtitle)}</textarea></div><div class="field"><label>Rodapé</label><textarea id="sf">${esc(state.settings.footer)}</textarea></div><button class="btn" onclick="saveSite()">Salvar</button>`;
 let ch=`<div class="panel"><h3>Novo curso</h3><div class="field"><input id="cn" placeholder="Nome"></div><div class="field"><textarea id="cd" placeholder="Descrição"></textarea></div><div class="field"><input id="ci" placeholder="URL da imagem"></div><button class="btn" onclick="addCourse()">Cadastrar</button></div>`;
 Object.entries(state.courses||{}).forEach(([id,c])=>ch+=`<div class="panel"><h3>${esc(c.name)}</h3><div class="field"><input id="n${id}" value="${esc(c.name)}"></div><div class="field"><textarea id="d${id}">${esc(c.desc||"")}</textarea></div><div class="field"><input id="i${id}" value="${esc(c.image||"")}" placeholder="URL da imagem"></div><div class="row"><button class="btn" onclick="updCourse('${id}')">Salvar</button><button class="btn danger" onclick="delCourse('${id}')">Excluir</button></div></div>`);$("a-courses").innerHTML=ch;
 let opts=Object.entries(state.courses||{}).map(([id,c])=>`<option value="${id}">${esc(c.name)}</option>`).join(""),lh=`<div class="panel"><h3>Nova aula</h3><div class="field"><select id="newLC">${opts}</select></div><div class="field"><input id="newLT" placeholder="Título da aula"></div><button class="btn" onclick="addLesson()">Cadastrar</button></div>`;
 Object.entries(state.courses||{}).forEach(([cid,c])=>Object.entries(c.lessons||{}).forEach(([lid,a])=>lh+=`<div class="panel"><div class="tag">${esc(c.name)}</div><h3>${esc(a.title)}</h3><div class="row"><button class="btn" onclick="editLesson('${cid}','${lid}')">Editar conteúdo</button><button class="btn danger" onclick="delLesson('${cid}','${lid}')">Excluir</button></div></div>`));$("a-lessons").innerHTML=lh;
 get(ref(db,"users")).then(s=>{let u=s.val()||{};$("a-students").innerHTML=Object.values(u).length?Object.entries(u).map(([uid,x])=>`<div class="panel"><b>${esc(x.name||"Aluno")}</b><div>${esc(x.email||"")}</div><small>UID: ${esc(uid)}</small></div>`).join(""):'<div class="note">Nenhum aluno cadastrado.</div>'})
}
window.saveSite=async()=>{try{await set(ref(db,"settings"),{title:$("st").value,subtitle:$("ss").value,footer:$("sf").value});alert("Salvo.")}catch(e){errorMsg(e)}};
window.addCourse=async()=>{try{let n=$("cn").value.trim();if(!n)return;let r=push(ref(db,"courses"));await set(r,{name:n,desc:$("cd").value,image:$("ci").value});}catch(e){errorMsg(e)}};
window.updCourse=async id=>{try{await update(ref(db,"courses/"+id),{name:$("n"+id).value,desc:$("d"+id).value,image:$("i"+id).value})}catch(e){errorMsg(e)}};
window.delCourse=async id=>{if(confirm("Excluir curso e todas as aulas?"))try{await remove(ref(db,"courses/"+id))}catch(e){errorMsg(e)}};
window.addLesson=async()=>{try{let cid=$("newLC").value,t=$("newLT").value.trim();if(!t)return;let r=push(ref(db,`courses/${cid}/lessons`));await set(r,{title:t,video:"",pdf:"",blocks:{},quiz:{}})}catch(e){errorMsg(e)}};
window.delLesson=async(c,l)=>{if(confirm("Excluir aula?"))try{await remove(ref(db,`courses/${c}/lessons/${l}`))}catch(e){errorMsg(e)}};
window.editLesson=(cid,lid)=>{let a=state.courses[cid].lessons[lid],blocks=Object.entries(a.blocks||{}),qs=Object.entries(a.quiz||{});$("a-lessons").innerHTML=`<button class="btn light" onclick="renderAdmin()">← Voltar</button><div class="panel"><h3>Editar aula</h3><div class="field"><label>Título</label><input id="et" value="${esc(a.title)}"></div><div class="field"><label>YouTube</label><input id="ev" value="${esc(a.video||"")}"></div><div class="field"><label>PDF (URL)</label><input id="ep" value="${esc(a.pdf||"")}"></div><button class="btn" onclick="saveLesson('${cid}','${lid}')">Salvar dados</button></div><h3>Artigo</h3>${blocks.map(([id,b])=>`<div class="panel"><b>${b.type==="text"?"Texto":"Imagem (URL)"}</b><textarea id="b_${id}">${esc(b.value)}</textarea><button class="btn danger small" onclick="removeBlock('${cid}','${lid}','${id}')">Excluir</button></div>`).join("")}<div class="row"><button class="btn light" onclick="addBlock('${cid}','${lid}','text')">+ Texto</button><button class="btn light" onclick="addBlock('${cid}','${lid}','image')">+ Imagem</button><button class="btn" onclick="saveBlocks('${cid}','${lid}')">Salvar artigo</button></div><h3>Perguntas</h3>${qs.map(([id,q],i)=>`<div class="panel"><b>Pergunta ${i+1}</b><div class="field"><input id="qq_${id}" value="${esc(q.q)}"></div>${[0,1,2,3].map(j=>`<div class="field"><input id="qo_${id}_${j}" value="${esc((q.options||[])[j]||"")}" placeholder="Alternativa ${j+1}"></div>`).join("")}<select id="qc_${id}">${[0,1,2,3].map(j=>`<option value="${j}" ${+q.correct===j?"selected":""}>Correta: ${String.fromCharCode(65+j)}</option>`).join("")}</select><button class="btn danger small" onclick="removeQuestion('${cid}','${lid}','${id}')">Excluir</button></div>`).join("")}<div class="row"><button class="btn light" onclick="addQuestion('${cid}','${lid}')">+ Pergunta</button><button class="btn" onclick="saveQuestions('${cid}','${lid}')">Salvar perguntas</button></div>`};
window.saveLesson=async(c,l)=>{await update(ref(db,`courses/${c}/lessons/${l}`),{title:$("et").value,video:$("ev").value,pdf:$("ep").value});alert("Salvo.")};
window.addBlock=async(c,l,t)=>{let r=push(ref(db,`courses/${c}/lessons/${l}/blocks`));await set(r,{type:t,value:""});setTimeout(()=>window.editLesson(c,l),250)};
window.removeBlock=async(c,l,id)=>{await remove(ref(db,`courses/${c}/lessons/${l}/blocks/${id}`));setTimeout(()=>window.editLesson(c,l),250)};
window.saveBlocks=async(c,l)=>{let a=state.courses[c].lessons[l];for(const id of Object.keys(a.blocks||{}))await update(ref(db,`courses/${c}/lessons/${l}/blocks/${id}`),{value:$("b_"+id).value});alert("Artigo salvo.")};
window.addQuestion=async(c,l)=>{let r=push(ref(db,`courses/${c}/lessons/${l}/quiz`));await set(r,{q:"Nova pergunta",options:["A","B","C","D"],correct:0});setTimeout(()=>window.editLesson(c,l),250)};
window.removeQuestion=async(c,l,id)=>{await remove(ref(db,`courses/${c}/lessons/${l}/quiz/${id}`));setTimeout(()=>window.editLesson(c,l),250)};
window.saveQuestions=async(c,l)=>{let a=state.courses[c].lessons[l];for(const id of Object.keys(a.quiz||{}))await set(ref(db,`courses/${c}/lessons/${l}/quiz/${id}`),{q:$("qq_"+id).value,options:[0,1,2,3].map(j=>$(`qo_${id}_${j}`).value),correct:+$("qc_"+id).value});alert("Perguntas salvas.")};
window.renderAdmin=renderAdmin;

onValue(ref(db,"settings"),s=>{if(s.exists())state.settings=s.val();render()});
onValue(ref(db,"courses"),s=>{state.courses=s.val()||{};render();if(isAdmin)renderAdmin()});
onAuthStateChanged(auth,async u=>{currentUser=u;isAdmin=false;if(u){let a=await get(ref(db,"admins/"+u.uid));isAdmin=a.exists()&&a.val()===true}render()});
render();showHome();
</script></body></html>
